<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroAnna — Space Data Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🚀 AstroAnna</h1>
        <p>Live Space Data Explorer</p>
    </header>

    <main>
        <section id="controls">
            <button id="fetch-btn">Load Data</button>
        </section>

        <!-- API results will be injected here by JavaScript -->
        <section id="results">
            <p class="placeholder">Click "Load Data" to fetch from the API.</p>
        </section>
    </main>

    <footer>
        <p>Data powered by a public API</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>

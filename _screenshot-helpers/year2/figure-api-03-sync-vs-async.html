<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 13.4 – Synchronous vs Asynchronous</title>
<style>
  body { margin:0; background:#0f172a; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',Arial,sans-serif; }
</style>
</head>
<body>
<svg width="740" height="400" viewBox="0 0 740 400">
  <rect width="740" height="400" fill="#1e293b" rx="12"/>
  <text x="370" y="30" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#94a3b8" letter-spacing=".5">SYNCHRONOUS vs ASYNCHRONOUS EXECUTION</text>

  <!-- ===================== LEFT: SYNCHRONOUS ===================== -->
  <text x="185" y="58" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="bold" fill="#f87171">❌ Synchronous (Blocking)</text>

  <!-- Time arrow -->
  <line x1="60" y1="75" x2="60" y2="355" stroke="#334155" stroke-width="2"/>
  <text x="48" y="75" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">0s</text>
  <text x="48" y="155" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">2s</text>
  <text x="48" y="235" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">4s</text>
  <text x="48" y="315" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">6s</text>
  <text x="48" y="360" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">↓ time</text>

  <!-- Task 1: fetch user -->
  <rect x="75" y="78" width="220" height="58" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="185" y="101" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#60a5fa">fetch('/api/user')</text>
  <text x="185" y="118" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#64748b">⏳ WAITING for response...</text>
  <text x="185" y="130" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#ef4444">Everything else BLOCKED</text>

  <!-- Task 2: blocked -->
  <rect x="75" y="140" width="220" height="58" rx="5" fill="#1c1c2e" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="185" y="168" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4b5563">fetch('/api/posts')</text>
  <text x="185" y="184" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#4b5563">⛔ Can't start yet — blocked</text>

  <!-- Task 3: blocked -->
  <rect x="75" y="202" width="220" height="58" rx="5" fill="#1c1c2e" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="185" y="230" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="#4b5563">renderPage()</text>
  <text x="185" y="246" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#4b5563">⛔ Can't start yet — blocked</text>

  <!-- Total time: 6s -->
  <rect x="75" y="264" width="220" height="36" rx="5" fill="#3c1f1f" stroke="#f87171" stroke-width="1.5"/>
  <text x="185" y="284" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#f87171">Total wait: ~6 seconds 😴</text>
  <text x="185" y="298" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#fca5a5">Page freezes the whole time</text>

  <!-- Divider -->
  <line x1="370" y1="60" x2="370" y2="360" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===================== RIGHT: ASYNCHRONOUS ===================== -->
  <text x="555" y="58" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" font-weight="bold" fill="#4ade80">✅ Asynchronous (Non-Blocking)</text>

  <!-- Time arrow right side -->
  <line x1="420" y1="75" x2="420" y2="355" stroke="#334155" stroke-width="2"/>
  <text x="408" y="75" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">0s</text>
  <text x="408" y="115" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">1s</text>
  <text x="408" y="155" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">2s</text>
  <text x="408" y="360" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#475569">↓ time</text>

  <!-- All 3 kick off simultaneously -->
  <rect x="435" y="78" width="130" height="32" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#60a5fa">fetch('/api/user')</text>
  <text x="500" y="104" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#64748b">Started ↗</text>

  <rect x="575" y="78" width="130" height="32" rx="5" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="640" y="92" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4ade80">fetch('/api/posts')</text>
  <text x="640" y="104" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#64748b">Started ↗</text>

  <!-- Concurrent execution bars -->
  <rect x="435" y="114" width="130" height="75" rx="4" fill="#1e3a5f" opacity=".6"/>
  <text x="500" y="152" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#60a5fa">⏳ waiting…</text>
  <text x="500" y="164" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#64748b">(non-blocking)</text>
  <text x="500" y="185" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#60a5fa">✓ Done!</text>

  <rect x="575" y="114" width="130" height="110" rx="4" fill="#1a2e1a" opacity=".6"/>
  <text x="640" y="160" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#4ade80">⏳ waiting…</text>
  <text x="640" y="172" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#64748b">(non-blocking)</text>
  <text x="640" y="220" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4ade80">✓ Done!</text>

  <!-- JS continues running while waiting -->
  <rect x="435" y="196" width="130" height="28" rx="4" fill="#2e1a47" stroke="#a855f7" stroke-width="1"/>
  <text x="500" y="213" text-anchor="middle" font-family="Consolas,monospace" font-size="9" fill="#c084fc">renderSkeleton() ▶</text>

  <!-- Promise.all resolves -->
  <rect x="435" y="232" width="270" height="40" rx="5" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="248" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#4ade80">Promise.all([user, posts])</text>
  <text x="570" y="263" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#64748b">Both resolved → renderPage()</text>

  <!-- Total time badge -->
  <rect x="435" y="280" width="270" height="36" rx="5" fill="#0f2d1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="570" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#4ade80">Total wait: ~2 seconds ⚡</text>
  <text x="570" y="314" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#86efac">Page stays responsive the whole time</text>
</svg>
</body>
</html>

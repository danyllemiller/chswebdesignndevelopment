<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 11.6 – Cloud Elasticity Graph</title>
<style>
  body { margin:0; background:#0f172a; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Segoe UI',Arial,sans-serif; }
</style>
</head>
<body>
<svg width="720" height="380" viewBox="0 0 720 380">
  <rect width="720" height="380" fill="#1e293b" rx="12"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#94a3b8" letter-spacing=".5">CLOUD ELASTICITY: Scaling Up &amp; Down Automatically</text>

  <!-- Chart area -->
  <!-- Axes -->
  <line x1="70" y1="60" x2="70" y2="290" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="290" x2="660" y2="290" stroke="#334155" stroke-width="2"/>

  <!-- Y axis label -->
  <text x="20" y="180" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#64748b" transform="rotate(-90,20,180)">Server Capacity</text>
  <!-- X axis label -->
  <text x="365" y="315" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#64748b">Time →</text>

  <!-- Grid lines -->
  <line x1="70" y1="180" x2="660" y2="180" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="120" x2="660" y2="120" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="240" x2="660" y2="240" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Y axis ticks -->
  <text x="58" y="244" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#475569">Low</text>
  <text x="58" y="184" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#475569">Mid</text>
  <text x="58" y="124" text-anchor="end" font-family="Consolas,monospace" font-size="10" fill="#475569">High</text>

  <!-- DEMAND curve (traffic spikes) - orange -->
  <polyline points="70,260 130,255 190,240 230,130 280,110 330,120 370,250 420,240 460,230 500,115 550,105 590,120 640,260 660,265"
    fill="none" stroke="#f97316" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- PROVISIONED (elastic) capacity - blue filled area tracking demand -->
  <polygon points="70,245 130,240 190,225 230,112 280,92 330,102 370,235 420,222 460,212 500,98 550,88 590,102 640,245 660,250 660,290 70,290"
    fill="#1e3a5f" opacity=".7"/>
  <polyline points="70,245 130,240 190,225 230,112 280,92 330,102 370,235 420,222 460,212 500,98 550,88 590,102 640,245 660,250"
    fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- FIXED capacity line (for comparison) -->
  <line x1="70" y1="160" x2="660" y2="160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="665" y="163" font-family="Segoe UI,Arial" font-size="10" fill="#ef4444">Fixed</text>

  <!-- Event annotations -->
  <!-- Flash sale spike -->
  <line x1="255" y1="100" x2="255" y2="290" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3" opacity=".5"/>
  <rect x="195" y="62" width="120" height="30" rx="4" fill="#431407" opacity=".9"/>
  <text x="255" y="74" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9.5" fill="#fed7aa">⚡ Flash Sale</text>
  <text x="255" y="87" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#f97316">Traffic spikes 5×</text>

  <!-- Cloud scales up annotation -->
  <text x="280" y="78" font-family="Segoe UI,Arial" font-size="9" fill="#38bdf8">↑ Cloud scales UP</text>

  <!-- Second spike -->
  <line x1="525" y1="88" x2="525" y2="290" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3" opacity=".5"/>
  <rect x="465" y="62" width="120" height="30" rx="4" fill="#431407" opacity=".9"/>
  <text x="525" y="74" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9.5" fill="#fed7aa">⚡ Viral Post</text>
  <text x="525" y="87" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#f97316">Traffic spikes 8×</text>

  <!-- Scale down annotation -->
  <text x="375" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="9" fill="#38bdf8">↓ Cloud scales DOWN — saves $$$</text>

  <!-- Legend -->
  <rect x="70" y="328" width="580" height="36" rx="6" fill="#0f172a"/>
  <line x1="90" y1="346" x2="118" y2="346" stroke="#f97316" stroke-width="2.5"/>
  <text x="124" y="350" font-family="Segoe UI,Arial" font-size="11" fill="#94a3b8">Actual traffic demand</text>
  <rect x="250" y="340" width="28" height="12" rx="2" fill="#1e3a5f" opacity=".8"/>
  <line x1="250" y1="346" x2="278" y2="346" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="284" y="350" font-family="Segoe UI,Arial" font-size="11" fill="#94a3b8">Elastic provisioned capacity</text>
  <line x1="460" y1="346" x2="488" y2="346" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="494" y="350" font-family="Segoe UI,Arial" font-size="11" fill="#94a3b8">Fixed (traditional) capacity</text>
</svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map & Video Embeds</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #fff; }
    h1 { font-size: 1.4rem; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
    h2 { font-size: 1.1rem; color: #555; margin-top: 30px; }
    .embed-container { margin: 16px 0 32px; }
    iframe { border: 1px solid #ccc; border-radius: 4px; display: block; }
  </style>
</head>
<body>

  <h1>Media Embeds Page</h1>

  <h2>YouTube Video</h2>
  <div class="embed-container">
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <h2>Google Map</h2>
  <div class="embed-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024.2219901290355!2d-74.00369368400567!3d40.71312937933115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a23e28c1191%3A0x49f75d3281df052a!2sFinancial%20District%2C%20New%20York%2C%20NY!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus"
      width="560"
      height="315"
      style="border:0;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>My Daily Journal | CHS Web Design</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <link href="/css/student-pages.css" rel="stylesheet" />

  <script type="module" src="/js/auth-guard.js"></script>
  <script src="/js/loader.js?v=20"></script>

  <style>
    .journal-entry { border-left: 4px solid #000099; background: #fff; border-radius: .5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .journal-date { font-weight: 700; color: #000099; font-size: .9rem; }
    .journal-standard { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #6c757d; background: #eef1fb; border-radius: 999px; padding: .15rem .6rem; display: inline-block; margin-left: .5rem; }
    .journal-prompt { font-style: italic; color: #495057; margin: .5rem 0 .35rem; }
    .journal-content { white-space: pre-wrap; }
    .journal-empty { color: #adb5bd; font-style: italic; text-align: center; padding: 3rem 1rem; }
  </style>
</head>
<body class="bg-light">

  <div id="nav-placeholder"></div>

  <div class="container my-4" style="max-width: 800px;">
    <div class="mb-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-book-open me-2"></i>My Daily Journal</h2>
      <p class="text-muted mb-0">Every clock-out reflection you've written, newest first. This is separate from your class notes.</p>
    </div>

    <div id="journalList">
      <div class="text-center text-primary py-4"><div class="spinner-border"></div></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script type="module" src="/js/student/wd-journal.js?v=1"></script>
</body>
</html>

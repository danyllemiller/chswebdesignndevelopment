<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Grocery Store | The Paycheck</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <link href="/css/dacStyleSheets.css" rel="stylesheet"/>
  <link href="/css/student-pages.css" rel="stylesheet"/>

  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script src="/js/loader.js?v=22"></script>
  <script type="module" src="/js/auth-guard.js?v=1"></script>

  <style>
    .grocery-header { background: linear-gradient(135deg, #2f9e44, #51cf66); color: #fff; border-radius: 14px; padding: 2rem; margin-bottom: 1.5rem; }
    .item-card { border: 1px solid #e3e6ea; border-radius: 12px; background: #fff; overflow: hidden; transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; height: 100%; }
    .item-card:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1.25rem rgba(0,0,0,.1); }
    .item-image-wrap { aspect-ratio: 1 / 1; background: #eef1f4; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .item-image-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .item-image-placeholder { font-size: 2.2rem; color: #c3cad1; }
    .item-card-body { padding: .75rem .9rem .9rem; display: flex; flex-direction: column; flex: 1; }
    .item-label { font-weight: 700; font-size: .92rem; line-height: 1.2; margin-bottom: .35rem; min-height: 2.3em; }
    .item-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .item-price-tag { font-weight: 800; color: #2f9e44; background: #e6f8e9; border-radius: .4rem; padding: .15rem .5rem; font-size: .9rem; font-variant-numeric: tabular-nums; }

    .cart-fab { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1050; width: 60px; height: 60px; border-radius: 50%; background: #2f9e44; color: #fff; border: none; box-shadow: 0 .5rem 1.25rem rgba(0,0,0,.25); font-size: 1.4rem; }
    .cart-count-badge { position: absolute; top: -4px; right: -4px; background: #dc3545; color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; }
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1040; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }
    .cart-drawer { position: fixed; top: 0; right: -420px; width: 400px; max-width: 90vw; height: 100%; background: #fff; z-index: 1045; box-shadow: -.5rem 0 1.5rem rgba(0,0,0,.15); transition: right .25s; display: flex; flex-direction: column; }
    .cart-drawer.open { right: 0; }
    .cart-drawer-header { padding: 1rem 1.25rem; border-bottom: 1px solid #e3e6ea; display: flex; justify-content: space-between; align-items: center; }
    .cart-drawer-items { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
    .cart-drawer-footer { padding: 1rem 1.25rem; border-top: 1px solid #e3e6ea; }
    .cart-row { display: flex; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid #f0f1f3; align-items: center; }
    .cart-row-img { width: 48px; height: 48px; border-radius: .5rem; background: #eef1f4; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .cart-row-img img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="bg-light">

<div id="nav-placeholder"></div>

<div class="container-ultrawide my-4">

  <div class="grocery-header d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <h1 class="fw-bold mb-1"><i class="fas fa-basket-shopping me-2"></i>Grocery Store</h1>
      <p class="mb-0 opacity-75">Everything you need for the week.</p>
    </div>
    <a href="/student/budget-game.html" class="btn btn-light fw-bold"><i class="fas fa-arrow-left me-1"></i>Back to The Paycheck</a>
  </div>

  <div id="blockedMsg" class="alert alert-warning d-none"></div>

  <div class="row g-3 mb-5" id="storeGrid"></div>

</div>

<button id="cartToggleBtn" class="cart-fab"><i class="fas fa-cart-shopping"></i><span id="cartCountBadge" class="cart-count-badge d-none">0</span></button>
<div id="cartOverlay" class="cart-overlay"></div>
<div id="cartDrawer" class="cart-drawer">
  <div class="cart-drawer-header">
    <h5 class="mb-0 fw-bold"><i class="fas fa-cart-shopping me-2"></i>Your Cart</h5>
    <button id="cartCloseBtn" type="button" class="btn-close"></button>
  </div>
  <div id="cartItems" class="cart-drawer-items"></div>
  <div class="cart-drawer-footer">
    <div class="d-flex justify-content-between fw-bold fs-5 mb-2">
      <span>Subtotal</span><span id="cartSubtotal">$0.00</span>
    </div>
    <button id="checkoutBtn" class="btn btn-success w-100 fw-bold py-2" disabled><i class="fas fa-credit-card me-1"></i>Checkout &amp; Pay</button>
    <div id="checkoutMsg" class="small mt-2"></div>
  </div>
</div>

<div class="modal fade" id="receiptModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Receipt</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="receiptBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary fw-bold" data-bs-dismiss="modal">Done</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script type="module" src="/js/student/budget-game-grocery.js?v=1"></script>
</body>
</html>

<head>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">

  </div>

    <div class="mb-4">
      <h2 class="gochi text-primary mb-0"><i class="fas fa-calendar-check me-2"></i>Mock Interview Sign-Up</h2>

          <p class="text-muted small mb-0"><i class="fas fa-spinner fa-spin me-1"></i>Loading…</p>

    </div>

  <div id="footer-placeholder"></div>

  <script src="/js/bootstrap.bundle.js"></script>

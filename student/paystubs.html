  <style>
    .period-card {
      border: 1px solid #dee2e6;
      border-radius: 10px;
      background: #fff;
      transition: box-shadow .2s;
    }
    .period-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .period-card .period-header {
      background: linear-gradient(135deg, #000099, #1f246b);
      color: #fff;
      border-radius: 9px 9px 0 0;
      padding: 1rem 1.25rem .75rem;
    }
    .period-card.estimated .period-header { background: linear-gradient(135deg, #5c669e, #7a82ab); }
    .period-card .period-body { padding: 1rem 1.25rem; }

    .stat-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
    .stat-val   { font-size: 1.4rem; font-weight: 800; }

    /* Paystub print layout */
    .paystub-doc {
      font-family: 'Courier New', Courier, monospace;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #000;
      max-width: 680px;
      margin: 0 auto;

    .paystub-doc .stub-body   { padding: 1.25rem 1.5rem; }
    .paystub-doc table { width: 100%; font-size: .85rem; }
    .paystub-doc table th { border-bottom: 1px solid #222; padding-bottom: .25rem; }
    .paystub-doc table td { padding: .2rem 0; }

    /* Detachable "check" portion -- deliberately a different (serif, not
       monospace) feel from the earnings statement above it, like a real
       paycheck's check stub vs. the check itself. */
    .fake-check {
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 680px;
      height: 2.75in;
      box-sizing: border-box;
      overflow: hidden;
      margin: 1.5rem auto 0;
      border: 2px solid #1a3a1a;
      border-radius: 4px;
      padding: 1.1rem 1.4rem;

      background:
        repeating-linear-gradient(135deg, rgba(26,58,26,.05) 0 2px, transparent 2px 14px),

    .check-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #1a3a1a; padding-bottom: .5rem; margin-bottom: .7rem; }
    .check-bank-name { font-weight: 700; font-size: 1rem; }
    .check-fake-tag { font-size: .65rem; font-style: italic; font-weight: 400; color: #6b6b6b; }
    .check-bank-addr { font-size: .7rem; color: #444; }
    .check-number, .check-date { font-size: .8rem; font-weight: 700; }
    .check-payline { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .6rem; }
    .check-label { font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .check-payee { flex: 1; min-width: 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .check-amount-box { white-space: nowrap; border: 1.5px solid #1a1a1a; border-radius: 3px; padding: .2rem .6rem; font-weight: 700; font-family: 'Courier New', monospace; }
    .check-words { border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; margin-bottom: .8rem; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .check-words span::after { content: ' ***************************'; color: #9aa89a; letter-spacing: 1px; }
    .check-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: .7rem; }
    .check-memo { font-size: .7rem; color: #444; font-style: italic; }
    .check-signature { text-align: center; }
    .sig-line { width: 190px; border-bottom: 1px solid #1a1a1a; height: 1.6rem; font-family: 'Brush Script MT', cursive; }
    .sig-label { font-size: .6rem; color: #444; }
    .check-micr { text-align: center; font-family: 'Courier New', monospace; letter-spacing: .25em; font-size: .95rem; color: #333; margin-bottom: .5rem; }
    .check-disclaimer { text-align: center; font-size: .6rem; font-weight: 700; color: #8a1f1f; letter-spacing: .03em; }
    .missing-block { max-width: 680px; margin: 1rem auto 0; border: 2px solid #dc3545; border-radius: 4px; padding: .6rem .9rem; background: #fff; }
    .fake-check, .paystub-doc { page-break-inside: avoid; }

    /* W-2 style */
    .w2-doc {
      border: 2px solid #000099;
      border-radius: 8px;
      background: #f0f2ff;
      padding: 1.5rem;
      max-width: 680px;

      border: 1px solid #000099;

    .w2-box-label { font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: #000099; }
    .w2-box-val   { font-size: 1.25rem; font-weight: 800; color: #1a1a2e; }

    .status-finalized { background: #d1fae5; color: #065f46; }
    .status-estimated { background: #fef3c7; color: #92400e; }

      .fake-check { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

<script type="module">
import { getLoggedInUser } from '/js/modules/user-session.js';
import { apiFetch } from '/js/modules/api-client.js';
import { renderPaystubHtml } from '/js/modules/paystub-template.js?v=2';

const user = getLoggedInUser();
if (!user) { location.href = '/login.html'; }

let myMissingAssignments = [];

const ON_TIME_BONUS = 5.00;
const ANCHOR_DATE   = new Date('2026-08-02T00:00:00');

function pad(n) { return n < 10 ? '0' + n : String(n); }

function getPayPeriodForDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const diffDays = Math.floor((d - ANCHOR_DATE) / 86400000);
  const periodsPassed = Math.floor(diffDays / 14);
  const ppStart = new Date(ANCHOR_DATE.getTime() + periodsPassed * 14 * 86400000);
  const ppEnd   = new Date(ppStart.getTime() + 13 * 86400000);
  const fmt = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  return { start: fmt(ppStart), end: fmt(ppEnd) };
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function fmtMoney(n) { return '$' + Number(n || 0).toFixed(2); }

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let currentStudentName = '';
let currentRole        = 'Web Developer';
let currentRate        = 35.00;

// ── Render finalized paystub card ─────────────────────────────────
function renderFinalCard(stub) {
  return `
    <div class="period-card mb-4">
      <div class="period-header">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="small opacity-75 mb-1"><i class="fas fa-calendar-check me-1"></i>Pay Period</div>
            <div class="fw-bold fs-5">${fmtDate(stub.period_start)} – ${fmtDate(stub.period_end)}</div>
          </div>
          <span class="badge status-finalized fw-bold"><i class="fas fa-check-circle me-1"></i>Official</span>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-4">
            <div class="stat-label">Role</div>
            <div class="fw-bold small">${escHtml(stub.role_title)}</div>
          </div>
          <div class="col-4">
            <div class="stat-label">Rate</div>
            <div class="fw-bold small">${fmtMoney(stub.hourly_rate)}/hr</div>
          </div>
          <div class="col-4">
            <div class="stat-label">Gross Pay</div>
            <div class="fw-bold fs-6 text-warning">${fmtMoney(stub.gross_pay)}</div>
          </div>
        </div>
      </div>
      <div class="period-body">
        <div class="row g-2 text-center mb-3">
          <div class="col-6 col-sm-3">
            <div class="stat-label">Hours</div>
            <div class="stat-val text-primary">${Number(stub.regular_hours).toFixed(2)}</div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="stat-label">Bonuses</div>
            <div class="stat-val text-success">${stub.bonus_count}</div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="stat-label">Deductions</div>
            <div class="stat-val text-danger">−${fmtMoney(stub.total_deductions)}</div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="stat-label">Net Pay</div>
            <div class="stat-val text-success">${fmtMoney(stub.net_pay)}</div>
          </div>
        </div>
        <button class="btn btn-outline-primary btn-sm fw-bold" onclick="showStubModal(${JSON.stringify(stub).replace(/"/g,'&quot;')})">
          <i class="fas fa-file-invoice-dollar me-1"></i>View Earnings Statement
        </button>
        <span class="ms-3 text-muted small">YTD Gross: ${fmtMoney(stub.ytd_gross)}</span>
      </div>
    </div>`;
}

// ── Render estimated card (computed from timesheets) ───────────────
// Server sends clock_in/clock_out as full ISO timestamps (mysql2 returns
// TIME columns as Date objects, which JSON.stringify always renders as
// UTC) -- combining that with t.date via string concatenation silently
// produced "Invalid Date" every time (the old `${t.date}T${t.clock_in}`
// pattern), zeroing out every estimated shift's hours. Only the time-of-day
// portion is meaningful here; both values get the same UTC shift applied,
// so it cancels out in the subtraction below even without correcting it.
function timeToMinutes(v) {
  if (!v) return null;
  const timePart = String(v).includes('T') ? String(v).split('T')[1] : String(v);
  const [h, m, s] = timePart.replace('Z', '').split(':').map(Number);
  if (Number.isNaN(h)) return null;
  return h * 60 + (m || 0) + (s || 0) / 60;
}

function renderEstimatedCard(period, shifts) {
  let totalMins = 0, bonusCount = 0;
  for (const t of shifts) {
    const inMin = timeToMinutes(t.clock_in);
    const outMin = timeToMinutes(t.clock_out);
    if (inMin !== null && outMin !== null) {
      const mins = outMin - inMin;
      if (mins > 0) totalMins += mins;
    }
    if (t.in_answer  === 'On Time') bonusCount++;
    if (t.out_answer === 'On Time') bonusCount++;
  }
  const hours     = totalMins / 60;
  const gross     = hours * currentRate + bonusCount * ON_TIME_BONUS;
  const fedTax    = gross * 0.10;
  const ssTax     = gross * 0.062;
  const medTax    = gross * 0.0145;
  const totalDed  = fedTax + ssTax + medTax;
  const net       = gross - totalDed;
  const stub = {
    period_start: period.start, period_end: period.end,
    role_title: currentRole, hourly_rate: currentRate,
    regular_hours: hours.toFixed(4), bonus_count: bonusCount, bonus_rate: ON_TIME_BONUS,
    gross_pay: gross.toFixed(2), fed_tax: fedTax.toFixed(2), ss_tax: ssTax.toFixed(2),
    med_tax: medTax.toFixed(2), total_deductions: totalDed.toFixed(2), net_pay: net.toFixed(2), ytd_gross: '—'
  };
  return `
    <div class="period-card estimated mb-4">
      <div class="period-header">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="small opacity-75 mb-1"><i class="fas fa-calendar me-1"></i>Pay Period</div>
            <div class="fw-bold fs-5">${fmtDate(period.start)} – ${fmtDate(period.end)}</div>
          </div>
          <span class="badge status-estimated fw-bold"><i class="fas fa-clock me-1"></i>Estimated</span>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-4"><div class="stat-label">Role</div><div class="fw-bold small">${escHtml(currentRole)}</div></div>
          <div class="col-4"><div class="stat-label">Rate</div><div class="fw-bold small">${fmtMoney(currentRate)}/hr</div></div>
          <div class="col-4"><div class="stat-label">Est. Gross</div><div class="fw-bold fs-6 text-warning">${fmtMoney(gross)}</div></div>
        </div>
      </div>
      <div class="period-body">
        <div class="row g-2 text-center mb-3">
          <div class="col-6 col-sm-3"><div class="stat-label">Hours</div><div class="stat-val text-primary">${hours.toFixed(2)}</div></div>
          <div class="col-6 col-sm-3"><div class="stat-label">Bonuses</div><div class="stat-val text-success">${bonusCount}</div></div>
          <div class="col-6 col-sm-3"><div class="stat-label">Deductions</div><div class="stat-val text-danger">−${fmtMoney(totalDed)}</div></div>
          <div class="col-6 col-sm-3"><div class="stat-label">Est. Net</div><div class="stat-val text-success">${fmtMoney(net)}</div></div>
        </div>
        <button class="btn btn-outline-secondary btn-sm fw-bold" onclick="showStubModal(${JSON.stringify(stub).replace(/"/g,'&quot;')})">
          <i class="fas fa-file-invoice-dollar me-1"></i>View Estimated Statement
        </button>
        <span class="ms-2 text-muted small">${shifts.length} shift${shifts.length !== 1 ? 's' : ''} this period</span>
      </div>
    </div>`;
}

// ── Paystub document modal ─────────────────────────────────────────
window.showStubModal = function(stub) {
  if (typeof stub === 'string') stub = JSON.parse(stub.replace(/&quot;/g, '"'));
  stub.employeeName = currentStudentName;
  document.getElementById('paystubModalContent').innerHTML = renderPaystubHtml(stub, myMissingAssignments);
  bootstrap.Modal.getOrCreateInstance(document.getElementById('paystubModal')).show();
};

// ── Main init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  if (!user) return;

  // Get role & rate
  try {
    const roster = await apiFetch(`/api/payroll/roster?username=${encodeURIComponent(user.username)}`);
    currentStudentName = `${roster.first_name || ''} ${roster.last_name || ''}`.trim() || user.username;
    if (roster.title) currentRole = roster.title;
    if (roster.hourly_rate) currentRate = Number(roster.hourly_rate);
  } catch { currentStudentName = user.username; }

  // So a student's own printed/viewed stub always matches what an admin-
  // printed check for them would show.
  try {
    const missingData = await apiFetch(`/api/admin/payroll/missing-assignments?student_ids=${encodeURIComponent(user.student_id)}`);
    myMissingAssignments = (missingData.missing && missingData.missing[user.student_id]) || [];
  } catch { myMissingAssignments = []; }

  document.getElementById('subtitleLine').textContent = `${currentRole} · ${currentStudentName}`;

  // Populate year selector
  const currentYear = new Date().getFullYear();
  const yearSel = document.getElementById('yearSelect');
  for (let y = currentYear; y >= currentYear - 2; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y; yearSel.appendChild(opt);
  }

  await loadPeriodsTab();
  await loadTaxTab(currentYear);

  yearSel.addEventListener('change', () => loadTaxTab(Number(yearSel.value)));
});

async function loadPeriodsTab() {
  try {
    // Load finalized paystubs
    const stubData = await apiFetch(`/api/paystubs/my?student_id=${encodeURIComponent(user.student_id)}`);
    const finalStubs = stubData.paystubs || [];
    const finalPeriodKeys = new Set(finalStubs.map(s => s.period_start + '_' + s.period_end));

    // Load timesheets to generate estimated periods
    const tsData  = await apiFetch(`/api/payroll/timesheets?student_id=${encodeURIComponent(user.student_id)}`);
    const shifts  = tsData.timesheets || [];

    // Group timesheets by pay period
    const periodMap = {};
    shifts.forEach(t => {
      const pp  = getPayPeriodForDate(t.date);
      const key = pp.start + '_' + pp.end;
      if (!periodMap[key]) periodMap[key] = { period: pp, shifts: [] };
      periodMap[key].shifts.push(t);
    });

    // Sort periods newest first
    const allPeriods = Object.values(periodMap).sort((a, b) => b.period.end.localeCompare(a.period.end));

    let html = '';
    if (!finalStubs.length && !allPeriods.length) {
      html = `<div class="text-center text-muted py-5"><i class="fas fa-clock fa-3x mb-3 d-block opacity-25"></i><p>No shifts logged yet. Use the timeclock to clock in when the school year begins.</p></div>`;
    } else {
      // Show finalized stubs first (they match timesheets for same period but are official)
      const shownKeys = new Set();
      for (const stub of finalStubs) {
        shownKeys.add(stub.period_start + '_' + stub.period_end);
        html += renderFinalCard(stub);
      }
      // Show estimated periods not yet finalized
      for (const { period, shifts: s } of allPeriods) {
        const key = period.start + '_' + period.end;
        if (!shownKeys.has(key)) html += renderEstimatedCard(period, s);
      }
    }
    document.getElementById('periodsContainer').innerHTML = html;
  } catch {
    document.getElementById('periodsContainer').innerHTML = `<div class="alert alert-danger">Could not load payroll records.</div>`;
  }
}

async function loadTaxTab(year) {
  document.getElementById('taxContainer').innerHTML = `<div class="text-center text-muted py-4"><div class="spinner-border text-primary mb-3"></div><p>Computing ${year} totals…</p></div>`;
  try {
    const data = await apiFetch(`/api/paystubs/ytd?student_id=${encodeURIComponent(user.student_id)}&year=${year}`);
    const ytd = data.ytd;
    if (!ytd || !Number(ytd.total_gross)) {
      document.getElementById('taxContainer').innerHTML = `<div class="text-center text-muted py-5"><i class="fas fa-file-alt fa-3x mb-3 d-block opacity-25"></i><p>No finalized pay periods for ${year} yet. Tax summary generates after payroll is run for this year.</p></div>`;
      return;
    }
    document.getElementById('taxContainer').innerHTML = `
      <div class="w2-doc">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <div class="fw-bold fs-5 text-primary" style="font-family:Georgia,serif">CHS Web Design Studio</div>
            <div class="text-muted small">1111 N Saliman Rd · Carson City, NV 89701</div>
          </div>
          <div class="text-end">
            <div class="fw-bold fs-4 text-primary">W-2</div>
            <div class="small fw-bold">Wage and Tax Statement</div>
            <div class="badge bg-primary">${year}</div>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <div class="w2-box">
              <div class="w2-box-label">Box a — Employee Name</div>
              <div class="w2-box-val">${escHtml(currentStudentName)}</div>
            </div>
          </div>
          <div class="col-6">
            <div class="w2-box">
              <div class="w2-box-label">Job Title</div>
              <div class="w2-box-val">${escHtml(ytd.role_title || currentRole)}</div>
            </div>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6 col-sm-3">
            <div class="w2-box">
              <div class="w2-box-label">Box 1 — Wages, Tips, Other</div>
              <div class="w2-box-val">${fmtMoney(ytd.total_gross)}</div>
            </div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="w2-box">
              <div class="w2-box-label">Box 2 — Federal Income Tax Withheld</div>
              <div class="w2-box-val">${fmtMoney(ytd.total_fed_tax)}</div>
            </div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="w2-box">
              <div class="w2-box-label">Box 4 — Social Security Tax Withheld</div>
              <div class="w2-box-val">${fmtMoney(ytd.total_ss_tax)}</div>
            </div>
          </div>
          <div class="col-6 col-sm-3">
            <div class="w2-box">
              <div class="w2-box-label">Box 6 — Medicare Tax Withheld</div>
              <div class="w2-box-val">${fmtMoney(ytd.total_med_tax)}</div>
            </div>
          </div>
        </div>
        <div class="row g-2">
          <div class="col-4">
            <div class="w2-box">
              <div class="w2-box-label">Total Hours Worked</div>
              <div class="w2-box-val">${Number(ytd.total_hours).toFixed(1)} hrs</div>
            </div>
          </div>
          <div class="col-4">
            <div class="w2-box">
              <div class="w2-box-label">On-Time Bonuses</div>
              <div class="w2-box-val">${ytd.total_bonuses}</div>
            </div>
          </div>
          <div class="col-4">
            <div class="w2-box" style="border-color:#065f46; background:#d1fae5;">
              <div class="w2-box-label" style="color:#065f46;">Net Pay (Take-Home)</div>
              <div class="w2-box-val" style="color:#065f46;">${fmtMoney(ytd.total_net_pay)}</div>
            </div>
          </div>
        </div>
        <div class="text-center mt-3 small text-muted">
          SIMULATED W-2 FOR EDUCATIONAL PURPOSES ONLY · ${ytd.period_count} Pay Period${ytd.period_count !== 1 ? 's' : ''} · ${year} Tax Year
        </div>
      </div>`;
  } catch {
    document.getElementById('taxContainer').innerHTML = `<div class="alert alert-danger">Could not load tax summary.</div>`;
  }
}
</script>
</body>
</html>

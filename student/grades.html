<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Student View | My Grades</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  
  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Foundation:wght@400;500;600;700&family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet" />
  <link href="/css/student-pages.css" rel="stylesheet" />
</head>
<body class="bg-white">
  <div class="container-fluid sticky-top px-0 no-print">
    <div id="nav-placeholder"></div>
  </div>

  <div class="container my-5">
    <div id="student-payroll-container"></div>
    <div id="studentHeader" class="mb-4">
        <h2 class="gochi text-primary mb-0">My Progress Report</h2>
        <p class="text-muted" id="userSubtitle">Connecting to Gradebook...</p>
    </div>

    <!-- One full panel (stats, badges, grade table, proficiency scales, growth
         chart) is rendered per class the student is actually enrolled in —
         see renderCoursePanel() in dashboard.js. -->
    <div id="courseGradesRoot">
        <div class="text-center p-5"><div class="spinner-border text-primary"></div><br><small class="text-muted mt-2 d-block">Fetching your scores from MariaDB...</small></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script type="module" src="/js/auth-guard.js"></script>
  <script src="/js/loader.js?v=17"></script>
  
  <script type="module" src="/js/student/dashboard.js?v=14"></script>
  <script type="module" src="/js/student/student-payroll.js"></script>
  <a href="#" class="back-to-top text-decoration-none" title="Back to Top">🚀</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Student View | Messages</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Foundation:wght@400;500;600;700&family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet" />
  <link href="/css/student-pages.css" rel="stylesheet" />

  <style>
    #messageThread { height: 55vh; overflow-y: auto; background: #f4f6fb; border-radius: 10px; padding: 1rem; }
    .msg-bubble { max-width: 75%; padding: .6rem 1rem; border-radius: 14px; margin-bottom: .75rem; word-wrap: break-word; white-space: pre-wrap; }
    .msg-teacher { background: #fff; border: 1px solid #dee2e6; margin-right: auto; border-bottom-left-radius: 4px; }
    .msg-student { background: #000099; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
    .msg-meta { font-size: .7rem; opacity: .7; margin-top: .25rem; }
  </style>
</head>
<body class="bg-white">
  <div class="container-fluid sticky-top px-0 no-print">
    <div id="nav-placeholder"></div>
  </div>

  <div class="container my-5" style="max-width: 720px;">
    <div class="mb-4">
      <h2 class="gochi text-primary mb-0"><i class="fas fa-envelope me-2"></i>Messages</h2>
      <p class="text-muted mb-0">A private conversation between you and Ms. Miller.</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div id="messageThread">
          <div class="text-center text-muted p-4" id="threadLoading">Loading…</div>
        </div>
        <form id="sendForm" class="d-flex gap-2 mt-3">
          <input type="text" id="messageInput" class="form-control" placeholder="Type a message…" maxlength="5000" autocomplete="off" required>
          <button type="submit" class="btn btn-primary fw-bold px-4"><i class="fas fa-paper-plane"></i></button>
        </form>
        <div id="sendError" class="alert alert-danger small mt-2 d-none"></div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script type="module" src="/js/auth-guard.js"></script>
  <script src="/js/loader.js?v=19"></script>

  <script type="module">
    const thread = document.getElementById('messageThread');
    const sendForm = document.getElementById('sendForm');
    const messageInput = document.getElementById('messageInput');
    const sendError = document.getElementById('sendError');

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatWhen(ts) {
      const d = new Date(ts.replace(' ', 'T'));
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function renderThread(messages) {
      if (messages.length === 0) {
        thread.innerHTML = '<p class="text-muted small text-center mb-0 mt-5">No messages yet — say hello!</p>';
        return;
      }
      thread.innerHTML = messages.map(m => `
        <div class="msg-bubble ${m.sender === 'student' ? 'msg-student' : 'msg-teacher'}">
          <div>${escapeHtml(m.body)}</div>
          <div class="msg-meta">${m.sender === 'student' ? 'You' : 'Ms. Miller'} · ${formatWhen(m.created_at)}</div>
        </div>`).join('');
      thread.scrollTop = thread.scrollHeight;
    }

    async function loadThread() {
      try {
        const res = await fetch('/api/student/messages');
        if (!res.ok) {
          thread.innerHTML = '<p class="text-danger small text-center mb-0 mt-5">Please log in to view your messages.</p>';
          return;
        }
        const data = await res.json();
        renderThread(data.messages || []);
      } catch (e) {
        thread.innerHTML = '<p class="text-danger small text-center mb-0 mt-5">Failed to load messages.</p>';
      }
    }

    sendForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      sendError.classList.add('d-none');
      const body = messageInput.value.trim();
      if (!body) return;
      try {
        const res = await fetch('/api/student/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to send message.');
        messageInput.value = '';
        await loadThread();
      } catch (err) {
        sendError.textContent = err.message;
        sendError.classList.remove('d-none');
      }
    });

    loadThread();
  </script>
  <a href="#" class="back-to-top text-decoration-none" title="Back to Top">🚀</a>
</body>
</html>

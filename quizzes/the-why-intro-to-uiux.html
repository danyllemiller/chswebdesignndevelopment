  <script>
    // QUESTION POOL FOR CHAPTER 4 mastery
    // Note: Correct option must always be at index 0 for initQuiz logic.
    const pool = [
        { question: "UI (User Interface) is best described as the:", options: ["Sensation - what the user sees and touches", "Solution - the overall journey and feeling", "Backend logic that powers a site", "Database structure behind a site"], correct: 0 },
        { question: "UX (User Experience) is best described as the:", options: ["Solution - the overall journey and ease of use", "Sensation - only the visual layer", "Color palette of a brand", "Font pairing used on a page"], correct: 0 },
        { question: "In the Ketchup Bottle analogy, the glass bottle (beautiful but you have to smack it to get ketchup out) represents:", options: ["High UI, Low UX", "Low UI, High UX", "High UI, High UX", "Low UI, Low UX"], correct: 0 },
        { question: "Which of these is one of the 7 Elements of Design?", options: ["Value", "Balance", "Emphasis", "Unity"], correct: 0 },
        { question: "Which of these is one of the 8 Principles of Design, not an Element?", options: ["Contrast", "Line", "Texture", "Shape"], correct: 0 },
        { question: "Two colors can look completely different (like red and green) but still fail a contrast check because they share the same:", options: ["Value", "Texture", "Form", "Line"], correct: 0 },
        { question: "A large photo on the left of a homepage balanced by a headline and text block (not a mirror image) on the right demonstrates:", options: ["Asymmetrical balance", "Symmetrical balance", "No balance at all", "Radial balance"], correct: 0 },
        { question: "On the color wheel, colors directly opposite each other (like blue and orange) are called:", options: ["Complementary", "Analogous", "Triadic", "Monochromatic"], correct: 0 },
        { question: "In the 60-30-10 color rule, the 10% accent color should be reserved for:", options: ["Call-to-action buttons", "Body text", "Page backgrounds", "Footer text"], correct: 0 },
        { question: "Pairing a bold Display heading font with a clean Sans-Serif body font follows which typography rule?", options: ["Pair for contrast, not similarity", "Always use exactly one font everywhere", "Match font weight exactly", "Use only serif fonts for headings"], correct: 0 },
        { question: "The difference between legibility and readability is:", options: ["Legibility is a font property; readability is a layout property (line-height, line length)", "They mean exactly the same thing", "Legibility only applies to headings", "Readability only applies to mobile screens"], correct: 0 },
        { question: "Deliberately empty space around a call-to-action button, used on purpose to make it stand out, is called:", options: ["White space (negative space)", "A wireframe", "A breakpoint", "A hero section"], correct: 0 },
        { question: "A full-bleed hero layout with minimal text is designed to work with which reading pattern?", options: ["Z-Pattern", "F-Pattern", "Both equally", "Neither pattern applies"], correct: 0 },
        { question: "The Gestalt principle where items placed close together are perceived as one group is called:", options: ["Proximity", "Similarity", "Closure", "Figure/Ground"], correct: 0 },
        { question: "A well-written branding message should include an audience, an outcome, and a:", options: ["Differentiator - what makes the business different", "Font stack", "Hex code", "Domain name"], correct: 0 },
        { question: "\"Best Site Ever!\" fails as a branding message mainly because it lacks:", options: ["A specific audience and outcome", "Capital letters", "An exclamation point", "A color reference"], correct: 0 },
        { question: "The Curb Cut Effect teaches that designing for accessibility:", options: ["Benefits everyone, not just users with disabilities", "Only benefits users with disabilities", "Slows down a website's load time", "Is optional for most businesses"], correct: 0 },
        { question: "The minimum recommended touch target size for a mobile button is approximately:", options: ["44x44 pixels", "10x10 pixels", "200x200 pixels", "1x1 pixel"], correct: 0 },
        { question: "A UI pattern that groups an image, headline, and text into one reusable container is called:", options: ["A Card", "A Modal", "A Breadcrumb", "A Hamburger Menu"], correct: 0 },
        { question: "During a usability test, the tester should mainly:", options: ["Shut up and watch, without helping the participant", "Explain every design decision as the user clicks", "Point out where to click", "Fix the design live during the test"], correct: 0 },
        { question: "Why is a usability test performed before writing code?", options: ["Fixing a design problem in a prototype is far cheaper than fixing it in code", "It's required by every design tool", "It makes the color palette more accurate", "It automatically generates the HTML"], correct: 0 },
        { question: "A design file organized with layers named \"nav-bg\" and \"submit-text\" instead of \"Rectangle 542\" demonstrates:", options: ["Professional file-naming decorum", "A finished color palette", "A completed usability test", "A branding message"], correct: 0 }
    ];

<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="google" content="notranslate">
  <title>WPR Practice Pro</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/wpr-practice/assets/wpr-practice-pro-favicon-64.png">
  <link rel="apple-touch-icon" href="/wpr-practice/assets/wpr-practice-pro-favicon-512.png">
  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <script src="/js/wrs-test-ui.js?v=7"></script>
  <style>
    body { background: #eef1f5; min-height: 100vh; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .card-main { background: #fff; border-radius: 1rem; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.12); padding: 1.5rem; }
    .brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; color: #1f2a44; }
    .brand i { font-size: 1.6rem; color: #0d6efd; }
    #code { text-transform: uppercase; letter-spacing: .25em; font-weight: 800; font-size: 1.4rem; text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="/" aria-label="WPR Practice Pro home"><img src="/wpr-practice/assets/wpr-practice-pro-logo.svg" alt="WPR Practice Pro" style="height:56px;width:auto"></a><div class="small text-muted ms-2 border-start ps-3">Nevada Workplace Readiness Skills practice</div></div>
  <div id="screen" class="card-main"></div>
</div>
<footer class="text-center small text-muted pb-4" style="max-width:900px;margin:0 auto;padding:0 1rem;">
  <a href="/wpr-practice/privacy.html">Privacy Policy</a> · <a href="/wpr-practice/terms.html">Terms of Use</a> · <a href="mailto:contact@wprpracticepro.com?subject=WPR%20Practice%20Pro%20bug%20or%20idea" data-wfb-open>Report a bug / Request a feature</a><br>
  Independent practice tool. Not affiliated with or endorsed by the Nevada Department of Education. No student information is kept after a session ends.
</footer>
<script src="/wpr-practice/assets/standards.js?v=1"></script>
<script src="/wpr-practice/assets/report-pdf.js?v=2"></script>
<script src="/wpr-practice/assets/feedback.js?v=2"></script>
<script>
// Student side of the WPR Practice Test (server/routes/wprPractice.js).
// No login: students join with the teacher's class code, their name, and
// student ID. Nothing is saved on this device except the join token for
// this one test (sessionStorage), so a refresh can resume, or come back to
// the results. Students see their score when they finish; their answers and
// report (assets/report-pdf.js) unlock when the teacher ends the test.
(function () {
  const screen = document.getElementById('screen');
  const esc = WrsTestUI.esc;
  let me = null; // { code, token, label, count, seconds }
  try { me = JSON.parse(sessionStorage.getItem('wpr_join') || 'null'); } catch (e) {}

  async function api(path, body) {
    const res = await fetch('/api' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || 'Something went wrong.'); e.status = res.status; throw e; }
    return data;
  }
  const fmtTime = s => {
    const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    return [h ? `${h} hour${h > 1 ? 's' : ''}` : '', m ? `${m} minutes` : ''].filter(Boolean).join(' ') || '0 minutes';
  };

  function showJoin(msg) {
    const params = new URLSearchParams(location.search);
    screen.innerHTML = `
      <h1 class="h4 fw-bold mb-3">Join your class's test</h1>
      ${msg ? `<div class="alert alert-warning py-2">${esc(msg)}</div>` : ''}
      <form id="joinForm" class="d-flex flex-column gap-3" autocomplete="off">
        <div><label class="form-label fw-bold" for="code">Class code</label>
          <input id="code" class="form-control" maxlength="6" required value="${esc(params.get('code') || '')}" placeholder="ABC123"></div>
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label fw-bold" for="first">First name</label><input id="first" class="form-control" maxlength="40" required></div>
          <div class="col-sm-6"><label class="form-label fw-bold" for="last">Last name</label><input id="last" class="form-control" maxlength="40" required></div>
        </div>
        <div><label class="form-label fw-bold" for="sid">Student ID number</label><input id="sid" class="form-control" maxlength="20" inputmode="numeric" required></div>
        <button class="btn btn-primary btn-lg fw-bold" type="submit">Join</button>
      </form>`;
    document.getElementById('joinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button'); btn.disabled = true;
      try {
        const out = await api('/wpr/join', {
          code: document.getElementById('code').value.trim(), firstName: document.getElementById('first').value,
          lastName: document.getElementById('last').value, studentId: document.getElementById('sid').value
        });
        me = { code: out.code, token: out.token, label: out.label, count: out.count, seconds: out.seconds, name: document.getElementById('first').value.trim() };
        try { sessionStorage.setItem('wpr_join', JSON.stringify(me)); } catch (x) {}
        showRules(out.started);
      } catch (err) { showJoin(err.message); }
    });
  }

  function showRules(started) {
    screen.innerHTML = `
      <h1 class="h4 fw-bold mb-1">Ready, ${esc(me.name || '')}?</h1>
      <p class="text-muted">${esc(me.label)}</p>
      <ul class="mb-3">
        <li><strong>${me.count} questions</strong>, multiple choice and true/false, on Nevada Workplace Readiness Skills, including workplace safety. You have <strong>${fmtTime(me.seconds)}</strong>.</li>
        <li>Answer as many as you can. The test submits itself when time runs out.</li>
        <li>Like the state test: <strong>Flag</strong> questions to come back to, use the on-screen <strong>Calculator</strong> and <strong>Scratch Paper</strong>, and check the <strong>Review</strong> screen before you submit.</li>
        <li class="text-danger fw-bold">The test runs full screen. Do not leave it. Switching tabs, opening another site, exiting full screen, or translating the page locks the test with a warning and tells your teacher. The second time, your test is submitted.</li>
        <li>The test is in English only, like the state test. Translators are turned off.</li>
        <li>When you finish you'll see your score right away. Your answers and your report unlock when your teacher ends the test.</li>
      </ul>
      <button id="startBtn" class="btn btn-primary btn-lg fw-bold w-100"><i class="fas fa-expand me-2"></i>${started ? 'Resume the test (the clock kept running)' : 'Start the test (full screen)'}</button>`;
    document.getElementById('startBtn').addEventListener('click', start);
  }

  async function start() {
    WrsTestUI.enterFullscreen(); // must happen inside the click itself
    document.getElementById('startBtn').disabled = true;
    try {
      const data = await api('/wpr/start', { code: me.code, token: me.token });
      WrsTestUI.run({
        mount: screen,
        questions: data.questions,
        answers: data.answers || {},
        secondsLeft: data.secondsLeft,
        flagKey: `wpr_flags_${me.code}`,
        save: answers => api('/wpr/save', { code: me.code, token: me.token, answers }),
        saveBeacon: answers => navigator.sendBeacon && navigator.sendBeacon('/api/wpr/save', new Blob([JSON.stringify({ code: me.code, token: me.token, answers })], { type: 'application/json' })),
        onViolation: count => api('/wpr/violation', { code: me.code, token: me.token, count }),
        clock: () => api('/wpr/clock', { code: me.code, token: me.token }),
        clockEvery: 5000,   // a pause for a break (or Read aloud) from the teacher shows up within 5 seconds
        readAloud: !!data.readAloud,
        paused: !!data.paused,
        noTranslate: true,   // the state test can't be translated, so the practice can't either
        submit: async (answers, reason) => {
          const out = await api('/wpr/submit', { code: me.code, token: me.token, answers, reason });
          me.submitted = true; me.reason = out.endReason || reason;
          remember();
          showResults(out.result);
        }
      });
    } catch (e) {
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (x) {}
      if (e.status === 404) { try { sessionStorage.removeItem('wpr_join'); } catch (x) {} me = null; return showJoin(e.message); }
      screen.innerHTML = `<div class="alert alert-warning mb-0">${esc(e.message)}</div>`;
    }
  }

  // ---- After submitting: the score now; the answers and the report once the teacher ends the test
  const remember = () => { try { sessionStorage.setItem('wpr_join', JSON.stringify(me)); } catch (x) {} };
  let resultsPoll = null;
  function showResults(score) {
    screen.innerHTML = `<h1 class="h4 fw-bold mb-3">Your results</h1>
      <div id="scoreBox">${score ? WrsTestUI.scoreHtml(score, me.reason) : '<p class="text-muted">Loading your score…</p>'}</div>
      <div class="alert alert-info"><i class="fas fa-lock me-2"></i><strong>Your answers and your report unlock when your teacher ends the test.</strong> Keep this page open. It updates by itself.</div>
      <p class="small text-muted mb-0">Your teacher has your score.</p>`;
    if (score) addSurvey();
    checkResults();
    clearInterval(resultsPoll);
    resultsPoll = setInterval(checkResults, 10000);
  }
  function addSurvey() {   // the pilot survey goes right under the score
    const score = screen.querySelector('.wt-big');
    if (window.WprFeedback && score && !me.surveyDone) WprFeedback.survey(score.closest('.d-flex'), { code: me.code, onDone: () => { me.surveyDone = true; remember(); } });
  }
  async function checkResults() {
    let out;
    try { out = await api('/wpr/results', { code: me.code, token: me.token }); }
    catch (e) {
      if (e.status !== 404) return;   // try again on the next check
      clearInterval(resultsPoll);
      try { sessionStorage.removeItem('wpr_join'); } catch (x) {}
      screen.innerHTML = '<h1 class="h4 fw-bold mb-3">Your results</h1><div class="alert alert-secondary mb-0">The results for this test have been erased. Ask your teacher if you need your score.</div>';
      return;
    }
    if (out.status === 'held' && !screen.querySelector('.wt-big')) { document.getElementById('scoreBox').innerHTML = WrsTestUI.scoreHtml(out.result, out.endReason); addSurvey(); }
    if (out.status === 'released') { clearInterval(resultsPoll); showReleased(out); }
  }
  function showReleased(out) {
    const until = new Date(out.report.availableUntil).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    screen.innerHTML = `<h1 class="h4 fw-bold mb-3">Your results</h1>
      <div class="alert alert-success d-flex flex-wrap align-items-center gap-3">
        <div class="flex-grow-1"><strong>Your teacher ended the test.</strong> Here are your answers. Save your report before <strong>${until}</strong>. After that, everything is erased.</div>
        <button id="pdfBtn" class="btn btn-success fw-bold"><i class="fas fa-file-pdf me-1"></i>Download my report (PDF)</button>
      </div>
      ${WrsTestUI.reviewHtml(out.result, out.endReason)}`;
    addSurvey();
    document.getElementById('pdfBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = 'Making your report…';
      try { await WprReport.download(out.report, out.result); btn.innerHTML = '<i class="fas fa-check me-1"></i>Saved. Download again'; }
      catch (err) { btn.textContent = 'Try again'; alert(err.message); }
      btn.disabled = false;
    });
  }

  if (me && me.token) { if (me.submitted) showResults(); else showRules(true); } else showJoin();
})();
</script>
</body>
</html>

  <script>
    const diagPool = [
        { question: "What is the primary role of an API in the 'Waiter' analogy?", options: ["The Chef (Server) who cooks the data from scratch whenever an order arrives.", "The Customer (Client) who decides what to order and then eats the result.", "The Waiter that carries your order to the kitchen and brings the data back.", "The Menu (Documentation) that lists every dish the kitchen is able to make."], answer: "The Waiter that carries your order to the kitchen and brings the data back." },
        { question: "Which HTTP method is used when you simply want to view a list of products on an e-commerce site?", options: ["POST", "PUT", "DELETE", "GET"], answer: "GET" },
        { question: "Which status code indicates that the request was successful and the data is attached?", options: ["200 OK", "404 Not Found", "500 Server Error", "401 Unauthorized"], answer: "200 OK" },
        { question: "What happens if you try to use data from a fetch() request before using the 'await' keyword?", options: ["The browser waits automatically until the data has arrived.", "You receive an empty JSON object that has no keys inside it.", "You receive a 'Pending Promise' instead of the actual data.", "The fetch request is canceled and has to be sent once again."], answer: "You receive a 'Pending Promise' instead of the actual data." },
        { question: "Which format is the modern standard for API data delivery because it looks like a JavaScript object?", options: ["XML", "CSV", "TXT", "JSON"], answer: "JSON" },
        { question: "What is an API 'Endpoint'?", options: ["The physical location of the server that stores the API's data.", "The specific URL address where a service or data can be accessed.", "The secret key that gives your application permission to use the API.", "The last line of a JSON file, which tells the browser to stop reading."], answer: "The specific URL address where a service or data can be accessed." },
        { question: "If a user enters the wrong password and the server denies access, which status code is most likely returned?", options: ["403 Forbidden", "404 Not Found", "401 Unauthorized", "400 Bad Request"], answer: "401 Unauthorized" },
        { question: "Which function is used to turn a usable JavaScript Object into a raw string of text for transmission?", options: ["JSON.parse()", "JSON.stringify()", "response.json()", "String.toJSON()"], answer: "JSON.stringify()" },
        { question: "What is a 'Rate Limit' on an API?", options: ["The fastest download speed the API's server is able to provide to users.", "A restriction on how many requests a user can make in a specific time period.", "The price the API provider charges for each gigabyte of data you use.", "The largest file size, like an image, that an API request can send at once."], answer: "A restriction on how many requests a user can make in a specific time period." },
        { question: "Why is a 'try/catch' block essential when fetching data?", options: ["It makes the API respond faster by retrying the request right away.", "It catches failures, like no Wi-Fi, so the app doesn't crash.", "It creates a new API key automatically whenever the old one expires.", "It is required by the HTML standard for any page that loads data."], answer: "It catches failures, like no Wi-Fi, so the app doesn't crash." },
        { question: "Which HTTP method is used to create a completely new user account on a server?", options: ["GET", "PUT", "DELETE", "POST"], answer: "POST" },
        { question: "What is a CORS error?", options: ["A syntax error in your JavaScript that stops the fetch from being sent.", "A security feature where a server blocks a domain from accessing its data.", "A timeout error that happens when the internet connection is too slow.", "An error the server sends when its database is full and can't save data."], answer: "A security feature where a server blocks a domain from accessing its data." },
        { question: "What does 'Stateless' mean in the context of a REST API?", options: ["The API only works in one country or state and blocks all the others.", "The server remembers nothing between requests; each one stands alone.", "The API stores each user's history so it can personalize the next reply.", "The API has no variables, so it always returns the very same data."], answer: "The server remembers nothing between requests; each one stands alone." },
        { question: "Which technology hosts copies of media on global servers to reduce lag for users?", options: ["CDN (Content Delivery Network)", "CMS (Content Management System)", "VPN (Virtual Private Network)", "DNS (Domain Name System)"], answer: "CDN (Content Delivery Network)" },
        { question: "If you receive a 404 status code, whose 'fault' is the error according to the standards?", options: ["The Server (it lost the file the user was looking for).", "The Client (The user requested something that doesn't exist).", "The API Provider (its database is down for maintenance).", "The Network (the request never reached the server at all)."], answer: "The Client (The user requested something that doesn't exist)." },
        { question: "What is 'Pagination' in an API?", options: ["Converting all of the API's results into a PDF so they can be printed out.", "Splitting a huge result set into smaller 'pages' (e.g., 20 results at a time).", "Adding a matching header and footer to every page that displays the API data.", "Numbering every single result so the list can be sorted from newest to oldest."], answer: "Splitting a huge result set into smaller 'pages' (e.g., 20 results at a time)." },
        { question: "What acts as a digital ID badge to authenticate your application to an API provider?", options: ["A Password", "An API Key", "A Cookie", "An Endpoint"], answer: "An API Key" },
        { question: "Which legacy format preceded JSON but is much heavier because of its tag-based structure?", options: ["CSV", "XML", "YAML", "HTML"], answer: "XML" },
        { question: "What does the 'CRUD' acronym stand for?", options: ["Compile, Run, Update, Delete", "Create, Read, Update, Delete", "Copy, Read, Upload, Download", "Create, Render, Undo, Deploy"], answer: "Create, Read, Update, Delete" },
        { question: "Which JavaScript keyword tells a function that it is allowed to 'pause' while waiting for a network request?", options: ["defer", "pause", "async", "wait"], answer: "async" },
        { question: "What is a 'Webhook'?", options: ["A request your app sends to the server every few seconds to check for new data.", "An automated message sent from one app to another triggered by a specific event.", "A special database query that pulls data from two different tables at once.", "A JavaScript library that connects your web page to any API you choose."], answer: "An automated message sent from one app to another triggered by a specific event." },
        { question: "When using fetch(), which boolean property do you check to see if the response was in the 200-range?", options: ["response.status", "response.ok", "response.success", "response.done"], answer: "response.ok" },
        { question: "Which status code means 'Forbidden' (You are logged in, but not allowed to see this specific data)?", options: ["401", "403", "404", "400"], answer: "403" },
        { question: "What is the 'Payload' of a POST request?", options: ["The headers that describe what the request is.", "The actual data body being sent to the server.", "The URL address the request is being sent to.", "The status code the server sends back to you."], answer: "The actual data body being sent to the server." },
        { question: "To display an image from a JSON object, you must inject the URL into which HTML attribute?", options: ["href", "class", "src", "alt"], answer: "src" },
        { question: "Which HTTP method is used to change a user's existing email address in a database?", options: ["GET", "POST", "DELETE", "PUT/PATCH"], answer: "PUT/PATCH" },
        { question: "What object is returned immediately by the fetch() command?", options: ["The JSON data", "A Promise", "A Response object", "An HTML string"], answer: "A Promise" },
        { question: "Which status code means 'Internal Server Error' (The provider's kitchen is broken)?", options: ["200", "404", "500", "401"], answer: "500" },
        { question: "Deserialization is the process of turning a string into a:", options: ["JSON String", "JavaScript Object", "HTML Element", "URL Parameter"], answer: "JavaScript Object" },
        { question: "Which symbol starts a Query Parameter in a URL?", options: ["#", "!", "?", "&"], answer: "?" },
        { question: "A 201 status code means:", options: ["Success (OK)", "Success (Created)", "Client Error (Forbidden)", "Redirect (Found)"], answer: "Success (Created)" },
        { question: "REST stands for:", options: ["Remote Execution Server Transfer", "Representational State Transfer", "Request and Response State Transfer", "Resource Exchange Standard Transfer"], answer: "Representational State Transfer" },
        { question: "Which HTTP status code is used for 'Unauthorized'?", options: ["200", "401", "403", "404"], answer: "401" },
        { question: "If an API is 'Read-Only', it only supports which method?", options: ["POST", "PUT", "DELETE", "GET"], answer: "GET" },
        { question: "What happens in the 'catch' block of a fetch request?", options: ["The successful data is logged to the console", "Network errors or failures are handled gracefully", "The page refreshes to send the request again", "The response is converted from JSON to an object"], answer: "Network errors or failures are handled gracefully" }
    ];

    };
    window.onload = () => initPreTest(config);
  </script>

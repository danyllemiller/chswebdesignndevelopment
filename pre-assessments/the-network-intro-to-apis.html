  <script>
    const diagPool = [
        { question: "What is the primary role of an API in the 'Waiter' analogy?", options: ["The Chef preparing data", "The Client placing orders", "The Messenger (Waiter) that takes your request to the kitchen and brings back data.", "The Restaurant Owner"], answer: "The Messenger (Waiter) that takes your request to the kitchen and brings back data." },
        { question: "Which HTTP method is used when you simply want to view a list of products on an e-commerce site?", options: ["POST", "PUT", "DELETE", "GET"], answer: "GET" },
        { question: "Which status code indicates that the request was successful and the data is attached?", options: ["200 OK", "404 Not Found", "500 Server Error", "401 Unauthorized"], answer: "200 OK" },
        { question: "What happens if you try to use data from a fetch() request before using the 'await' keyword?", options: ["The site crashes", "The code runs faster", "You receive a 'Pending Promise' instead of the actual data.", "The browser reloads"], answer: "You receive a 'Pending Promise' instead of the actual data." },
        { question: "Which format is the modern standard for API data delivery because it looks like a JavaScript object?", options: ["XML", "CSV", "TXT", "JSON"], answer: "JSON" },
        { question: "What is an API 'Endpoint'?", options: ["The physical location of a server.", "The specific URL address where a service or data can be accessed.", "The password for the API.", "The end of a JSON file."], answer: "The specific URL address where a service or data can be accessed." },
        { question: "If a user enters the wrong password and the server denies access, which status code is most likely returned?", options: ["200 OK", "404 Not Found", "401 Unauthorized", "500 Server Error"], answer: "401 Unauthorized" },
        { question: "Which function is used to turn a usable JavaScript Object into a raw string of text for transmission?", options: ["JSON.parse()", "JSON.stringify()", "fetch()", "await()"], answer: "JSON.stringify()" },
        { question: "What is a 'Rate Limit' on an API?", options: ["The maximum speed of the internet.", "A restriction on how many requests a user can make in a specific time period.", "The price per gigabyte.", "The maximum file size of an image."], answer: "A restriction on how many requests a user can make in a specific time period." },
        { question: "Why is a 'try/catch' block essential when fetching data?", options: ["It makes the API faster.", "It acts as a safety net that catches network failures (like no Wi-Fi) without crashing the app.", "It generates API keys automatically.", "It is required by the HTML standard."], answer: "It acts as a safety net that catches network failures (like no Wi-Fi) without crashing the app." },
        { question: "Which HTTP method is used to create a completely new user account on a server?", options: ["GET", "PUT", "DELETE", "POST"], answer: "POST" },
        { question: "What is a CORS error?", options: ["A syntax error in your JS.", "A security feature where a server blocks a domain from accessing its data.", "A slow internet connection error.", "An error when a database is full."], answer: "A security feature where a server blocks a domain from accessing its data." },
        { question: "What does 'Stateless' mean in the context of a REST API?", options: ["The API only works in one country.", "The server does not remember anything about previous requests; each request is independent.", "The API has no variables.", "The code is written in HTML."], answer: "The server does not remember anything about previous requests; each request is independent." },
        { question: "Which technology hosts copies of media on global servers to reduce lag for users?", options: ["CDN (Content Delivery Network)", "CMS", "VCS", "SQL"], answer: "CDN (Content Delivery Network)" },
        { question: "If you receive a 404 status code, whose 'fault' is the error according to the standards?", options: ["The Server", "The Client (The user requested something that doesn't exist).", "The API Provider", "The Wi-Fi Router"], answer: "The Client (The user requested something that doesn't exist)." },
        { question: "What is 'Pagination' in an API?", options: ["Converting data to a PDF.", "Splitting a huge result set into smaller 'pages' (e.g., 20 results at a time).", "Adding a header and footer.", "Printing the code."], answer: "Splitting a huge result set into smaller 'pages' (e.g., 20 results at a time)." },
        { question: "What acts as a digital ID badge to authenticate your application to an API provider?", options: ["A Password", "An API Key", "A Cookie", "A Username"], answer: "An API Key" },
        { question: "Which legacy format preceded JSON but is much heavier because of its tag-based structure?", options: ["JSON", "XML", "YAML", "TXT"], answer: "XML" },
        { question: "What does the 'CRUD' acronym stand for?", options: ["Compile, Run, Update, Delete", "Create, Read, Update, Delete", "Copy, Read, Upload, Download", "Create, Render, Undo, Deploy"], answer: "Create, Read, Update, Delete" },
        { question: "Which JavaScript keyword tells a function that it is allowed to 'pause' while waiting for a network request?", options: ["wait", "pause", "async", "stop"], answer: "async" },
        { question: "What is a 'Webhook'?", options: ["A physical cable.", "An automated message sent from one app to another triggered by a specific event.", "A type of database query.", "A CSS framework."], answer: "An automated message sent from one app to another triggered by a specific event." },
        { question: "When using fetch(), which boolean property do you check to see if the response was in the 200-range?", options: ["response.valid", "response.ok", "response.success", "response.true"], answer: "response.ok" },
        { question: "Which status code means 'Forbidden' (You are logged in, but not allowed to see this specific data)?", options: ["200", "403", "404", "500"], answer: "403" },
        { question: "What is the 'Payload' of a POST request?", options: ["The shipping cost.", "The actual data body being sent to the server.", "The time it takes to arrive.", "The name of the server."], answer: "The actual data body being sent to the server." },
        { question: "To display an image from a JSON object, you must inject the URL into which HTML attribute?", options: ["href", "class", "src", "alt"], answer: "src" },
        { question: "Which HTTP method is used to change a user's existing email address in a database?", options: ["GET", "POST", "DELETE", "PUT/PATCH"], answer: "PUT/PATCH" },
        { question: "What object is returned immediately by the fetch() command?", options: ["The JSON data", "A Promise", "An HTML string", "A CSV file"], answer: "A Promise" },
        { question: "Which status code means 'Internal Server Error' (The provider's kitchen is broken)?", options: ["200", "404", "500", "401"], answer: "500" },
        { question: "Deserialization is the process of turning a string into a:", options: ["Function", "JavaScript Object", "Boolean", "Number"], answer: "JavaScript Object" },
        { question: "Which symbol starts a Query Parameter in a URL?", options: ["#", "!", "?", "&"], answer: "?" },
        { question: "A 201 status code means:", options: ["Success (OK)", "Success (Created)", "Forbidden", "Found"], answer: "Success (Created)" },
        { question: "REST stands for:", options: ["Real Estate Standard Table", "Representational State Transfer", "Routing Engine System Tool", "Remote Entry Serial Terminal"], answer: "Representational State Transfer" },
        { question: "Which HTTP status code is used for 'Unauthorized'?", options: ["200", "401", "403", "404"], answer: "401" },
        { question: "If an API is 'Read-Only', it only supports which method?", options: ["POST", "PUT", "DELETE", "GET"], answer: "GET" },
        { question: "What happens in the 'catch' block of a fetch request?", options: ["Success is logged", "Network errors or failures are handled gracefully", "The page refreshes", "The data is deleted"], answer: "Network errors or failures are handled gracefully" }
    ];

    };

  </script>

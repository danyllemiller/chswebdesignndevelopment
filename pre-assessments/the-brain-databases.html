  <script>
    const diagPool = [
        { question: "What is the primary problem that a database solves for a dynamic website?", options: ["It makes the site's layout adjust automatically to fit phones and tablet screens.", "It writes all of the site's CSS code automatically based on the stored settings.", "It gives the site permanent, organized memory on a server, so it stops 'forgetting'.", "It speeds up the site by storing a picture of every page on the server ahead of time."], answer: "It gives the site permanent, organized memory on a server, so it stops 'forgetting'." },
        { question: "In a relational database, what is a Primary Key?", options: ["The main password that lets an admin log into the database server.", "Whatever value is in the first column of the table, like a name.", "A unique ID for each row, so no two records can ever be identical.", "A column that points to a matching record stored in a different table."], answer: "A unique ID for each row, so no two records can ever be identical." },
        { question: "What is a Foreign Key?", options: ["A column that points back to the Primary Key of another table, linking them.", "A unique ID number that makes sure no two rows in the same table are identical.", "A key that is used to encrypt the data before it is saved in the table.", "A column holding data that was imported from a database in another country."], answer: "A column that points back to the Primary Key of another table, linking them." },
        { question: "Which SQL command corresponds to the 'Read' action in CRUD?", options: ["INSERT", "UPDATE", "DELETE", "SELECT"], answer: "SELECT" },
        { question: "Which SQL command is used to add a brand new record to a table?", options: ["ADD NEW", "CREATE ROW", "UPDATE", "INSERT INTO"], answer: "INSERT INTO" },
        { question: "Why is 'Local Storage' not considered a true database?", options: ["It costs too much money to store data there for more than a few users at once.", "It lives only in one user's browser and vanishes if they clear it or switch devices.", "It can only store video and image files, not any text, numbers, or user settings.", "It uses up too much of the web server's bandwidth every single time a page is loaded."], answer: "It lives only in one user's browser and vanishes if they clear it or switch devices." },
        { question: "Which type of database stores data as flexible 'documents' like JSON objects?", options: ["SQL (Relational)", "Local Storage (Browser)", "IndexedDB (Browser)", "NoSQL (Non-Relational)"], answer: "NoSQL (Non-Relational)" },
        { question: "What is an SQL Injection (SQLi) attack?", options: ["A virus that sneaks into a website's server and deletes all of its CSS files.", "A hacker typing malicious SQL commands into an input field to trick the server.", "A slow internet connection that makes database queries pile up and time out.", "Flooding a database with so many fake requests that it crashes for everyone."], answer: "A hacker typing malicious SQL commands into an input field to trick the server." },
        { question: "How do professional developers prevent SQL Injection attacks?", options: ["By removing every search bar and form from the site.", "By shutting down the database server every night.", "By switching from SQL to a NoSQL database instead.", "By using 'Parameterized Queries' to sanitize inputs."], answer: "By using 'Parameterized Queries' to sanitize inputs." },
        { question: "What is 'Password Hashing'?", options: ["A two-way encryption that the site admin can decrypt to see the original password.", "A tool that automatically creates strong, random passwords for users when they sign up.", "A way to compress the whole passwords table so the database takes up less disk space.", "A one-way process that turns a password into a fingerprint that can't be reversed."], answer: "A one-way process that turns a password into a fingerprint that can't be reversed." },
        { question: "What does adding a 'Salt' to a password hash do?", options: ["Adds extra processing power so the database can look up each user's password faster.", "Removes all the vowels from the password so that it is harder for hackers to guess.", "Deletes old passwords automatically so users have to make a new one each year.", "Adds random characters before hashing so identical passwords get different hashes."], answer: "Adds random characters before hashing so identical passwords get different hashes." },
        { question: "In SQL, what does the JOIN command do?", options: ["Connects two separate database servers so they share all of their data.", "Merges two rows in the same table into one row and deletes the duplicate.", "Adds a new user to the mailing list table when they sign up for the site.", "Combines columns from two or more tables using a column they both share."], answer: "Combines columns from two or more tables using a column they both share." },
        { question: "If you execute DELETE FROM Users; without a WHERE clause, what happens?", options: ["Nothing happens without a WHERE clause.", "Only the first user in the table is deleted.", "The whole table and its columns are removed.", "Every single user in the table is deleted."], answer: "Every single user in the table is deleted." },
        { question: "What is a 'Database Schema'?", options: ["The visual color theme and layout used for the database's admin dashboard.", "A list of every query that has ever been run on the database, in order.", "The password and username that the database administrator uses to log in.", "The structural blueprint that defines the tables, columns, and relationships."], answer: "The structural blueprint that defines the tables, columns, and relationships." },
        { question: "What does the LIMIT 10 clause do at the end of a SQL query?", options: ["Deletes the first 10 rows after the query finishes running.", "Waits 10 seconds before the query is allowed to run.", "Returns only rows where the value is less than 10.", "Restricts the output to only return the first 10 rows."], answer: "Restricts the output to only return the first 10 rows." },
        { question: "In Local Storage, data is always saved as what data type?", options: ["An Array (List)", "A Number (Integer)", "A Boolean (True/False)", "A String (Text)"], answer: "A String (Text)" },
        { question: "How do you store a complex JavaScript Object into Local Storage?", options: ["You must use JSON.parse() to turn it into a string first.", "You can save it directly, since Local Storage accepts objects.", "You can't; Local Storage can only hold arrays, not objects.", "You must use JSON.stringify() to turn it into a string."], answer: "You must use JSON.stringify() to turn it into a string." },
        { question: "What does the SQL command ORDER BY score_value DESC do?", options: ["Orders the results alphabetically by player name.", "Orders the results from lowest score to highest.", "Removes duplicate scores from the results first.", "Orders the results from highest score to lowest."], answer: "Orders the results from highest score to lowest." },
        { question: "What is 'Data Validation'?", options: ["Deleting old data that hasn't been used in a long time to free up space.", "Hashing every user's password before it is stored so no one can read it.", "Making a full backup copy of the database each night in case it gets lost.", "Making sure data entered into a system meets certain rules before it's saved."], answer: "Making sure data entered into a system meets certain rules before it's saved." },
        { question: "Where should Data Validation occur for maximum security?", options: ["Only on the Client-Side (JavaScript).", "Only on the Server-Side, since users can't see it.", "Only in the CSS, using required and pattern styles.", "Both on the Client-Side and on the Server-Side."], answer: "Both on the Client-Side and on the Server-Side." },
        { question: "What is an ORM (Object-Relational Mapper)?", options: ["A type of SQL injection attack that targets the objects stored inside a database.", "A backup server that keeps a live mirror copy of every table in the database.", "A CSS framework for styling the HTML tables that display a database's results.", "A tool that lets developers work with a database in their language, not raw SQL."], answer: "A tool that lets developers work with a database in their language, not raw SQL." },
        { question: "Which is a more secure, modern algorithm for password hashing?", options: ["MD5 or SHA-1", "Base64 encoding", "Plain-text storage", "bcrypt or Argon2"], answer: "bcrypt or Argon2" },
        { question: "If 'Competitive Cody' wants his high score visible to friends, where must it be saved?", options: ["Local Storage (Browser)", "Session Storage (Tab)", "A Browser Cookie", "A Server-Side Database"], answer: "A Server-Side Database" },
        { question: "What does it mean to 'Drop' a database table?", options: ["To delete every row of data but keep the table's columns for later.", "To back up the table to a file before making any big changes to it.", "To hide the table from users while it's being updated by an admin.", "To permanently delete the entire table structure and all data inside it."], answer: "To permanently delete the entire table structure and all data inside it." },
        { question: "What is the maximum storage capacity limit for Local Storage in most browsers?", options: ["1 MB", "100 MB", "Unlimited", "5 MB"], answer: "5 MB" }
    ];

    };
    window.onload = () => initPreTest(config);
  </script>

  <script>
    const diagPool = [
        { question: "The moment you create an original piece of code or take a photo, what legal shield automatically applies?", options: ["Trademark", "Copyright", "Patent", "Trade secret"], answer: "Copyright" },
        { question: "What does the symbol '™' represent?", options: ["Copyright (creative work)", "Trademark (Brand identity)", "Patent (new invention)", "Service mark (a service)"], answer: "Trademark (Brand identity)" },
        { question: "Which type of intellectual property is NOT automatic and must be applied for and granted by the government?", options: ["Copyright", "Trademark", "Patent", "Trade Secret"], answer: "Patent" },
        { question: "What is 'Work Made for Hire'?", options: ["A contract where you keep the copyright but your employer may use the work.", "A contract where your employer owns the copyright to everything you build.", "Unpaid work you do, like volunteering, to build up a professional portfolio.", "Code you sell to a client after building it on your own time and equipment."], answer: "A contract where your employer owns the copyright to everything you build." },
        { question: "Which Creative Commons license requirement means 'You must give credit to the original creator'?", options: ["NonCommercial (NC)", "NoDerivatives (ND)", "Attribution (BY)", "ShareAlike (SA)"], answer: "Attribution (BY)" },
        { question: "If a license is marked 'NC', can you use that asset on a website that sells products?", options: ["Yes, as long as you credit the creator.", "No, NC means NonCommercial use only.", "Yes, NC means No Copyright restrictions.", "Only if you crop or change the image first."], answer: "No, NC means NonCommercial use only." },
        { question: "What does the 'ND' requirement in a CC license prohibit?", options: ["Using the work on any site that earns money (NonCommercial).", "Sharing the work without naming the creator (Attribution).", "Editing, cropping, or filtering the work (No Derivatives).", "Licensing your new version differently (ShareAlike)."], answer: "Editing, cropping, or filtering the work (No Derivatives)." },
        { question: "Work that has no copyright protection and is free for anyone to use without permission belongs to the:", options: ["Creative Commons", "Fair Use", "Public Domain", "Open Source"], answer: "Public Domain" },
        { question: "What is the 'Digital Footprint'?", options: ["The total amount of storage space your photos and files use in the cloud.", "A permanent record of every activity, search, and comment a user makes online.", "A record of your browsing that disappears once you clear your browser history.", "The personal information you choose to put on your social media profiles."], answer: "A permanent record of every activity, search, and comment a user makes online." },
        { question: "What does PII stand for in the context of user privacy?", options: ["Private Individual Internet Information", "Personally Identifiable Information", "Personal Internet Identity", "Publicly Indexed Information"], answer: "Personally Identifiable Information" },
        { question: "What is an 'Invasion of Privacy' in web development?", options: ["Using a photo from the internet on your site without asking the owner.", "Collecting or sharing a user's personal data without their consent.", "Building a site that doesn't work for users who rely on screen readers.", "Copying a company's logo and using it to sell your own products."], answer: "Collecting or sharing a user's personal data without their consent." },
        { question: "HTTP is like sending a ____________, while HTTPS is like sending a sealed armored letter.", options: ["Postcard", "Sealed envelope", "Locked package", "Certified letter"], answer: "Postcard" },
        { question: "What technology provides the 's' in HTTPS and the padlock icon in the browser?", options: ["Secure DNS (DNSSEC) Record", "VPN Connection", "SSL/TLS Certificate", "Browser Firewall"], answer: "SSL/TLS Certificate" },
        { question: "How many steps are typically involved in the SSL/TLS Handshake?", options: ["3", "5", "8", "10"], answer: "8" },
        { question: "What is a 'Certificate Authority' (CA)?", options: ["A government office that approves every website before it can go live.", "A trusted third party that verifies a website is who they say they are.", "The company that hosts a website and keeps its server running securely.", "A browser setting that blocks sites that don't use an SSL certificate."], answer: "A trusted third party that verifies a website is who they say they are." },
        { question: "The European privacy law that uses an 'OPT-IN' model for data collection is:", options: ["CCPA", "SB220", "GDPR", "ADA"], answer: "GDPR" },
        { question: "The Nevada privacy law SB220 uses which model for the sale of consumer data?", options: ["Opt-In", "Opt-Out", "No-Sale Ban", "Implied Consent"], answer: "Opt-Out" },
        { question: "What does 'Privacy by Design' mean?", options: ["Adding a detailed privacy policy page to the site right before it launches.", "Building data protection into the technology from the very start of development.", "Designing the site so users can hide their own profiles from other users.", "Encrypting all user data, but only after a security breach has been discovered."], answer: "Building data protection into the technology from the very start of development." },
        { question: "What does 'a11y' stand for?", options: ["Availability", "Accessibility", "Adaptability", "Authenticity"], answer: "Accessibility" },
        { question: "Which federal law makes web accessibility a legal requirement for public businesses?", options: ["GDPR (General Data Protection Regulation)", "ADA (Americans with Disabilities Act)", "COPPA (Children's Online Privacy Protection Act)", "DMCA (Digital Millennium Copyright Act)"], answer: "ADA (Americans with Disabilities Act)" },
        { question: "What is the global standard for web accessibility guidelines?", options: ["W3C (World Wide Web Consortium)", "ARIA (Accessible Rich Internet Applications)", "WCAG (Web Content Accessibility Guidelines)", "ADA (Americans with Disabilities Act)"], answer: "WCAG (Web Content Accessibility Guidelines)" },
        { question: "In the 'POUR' principles, what does the 'P' stand for?", options: ["Predictable", "Programmable", "Perceivable", "Portable"], answer: "Perceivable" },
        { question: "Which principle ensures that a user can navigate your entire site using only a keyboard?", options: ["Operable", "Understandable", "Robust", "Perceivable"], answer: "Operable" },
        { question: "Why is 'Alt Text' required for images?", options: ["So the image still shows a caption under it when the page first loads.", "So screen readers can describe the image to visually impaired users.", "So search engines rank the page higher, which is its only real purpose.", "So the image can load faster on slow connections by using less data."], answer: "So screen readers can describe the image to visually impaired users." },
        { question: "What is the minimum required color contrast ratio for normal text under WCAG standards?", options: ["3:1", "7:1", "4.5:1", "2.5:1"], answer: "4.5:1" }
    ];
    const config = {
        questions: diagPool,
        questionCount: 15,
        chapterTitle: "Chapter 2 Diagnostic",

    };

  </script>

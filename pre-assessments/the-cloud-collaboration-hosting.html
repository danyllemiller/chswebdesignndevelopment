  <script>
    // Chapter 13 Full Pool (52 Questions)
    const ch13Pool = [
        { question: "What is the main purpose of a Version Control System (VCS)?", options: ["To host finished websites so visitors can reach them online.", "To track changes and act as a time machine for code.", "To format and clean up code automatically each time you save.", "To compress project files so they upload to servers faster."], answer: "To track changes and act as a time machine for code." },
        { question: "Which of the following best describes Git?", options: ["A website where developers store and share their repositories.", "Local version control software installed on your computer.", "A cloud hosting provider that publishes your site automatically.", "A code editor that saves a backup each time you press Ctrl+S."], answer: "Local version control software installed on your computer." },
        { question: "How is GitHub different from Git?", options: ["GitHub is the newer version of Git, so Git itself is no longer needed.", "Git runs in the browser; GitHub is the app you install on your computer.", "GitHub is a cloud hosting service specifically for your Git repositories.", "GitHub is Microsoft's version of Git; Git is the open-source original."], answer: "GitHub is a cloud hosting service specifically for your Git repositories." },
        { question: "What is a 'branch' in Git?", options: ["A saved snapshot of your code with a message describing the change.", "An isolated copy of the project for safely testing new features.", "A teammate's account that has permission to edit the repository.", "A copy of the whole repository downloaded from GitHub to your laptop."], answer: "An isolated copy of the project for safely testing new features." },
        { question: "What does the term 'commit' mean in version control?", options: ["Uploading your latest changes from your laptop to GitHub.", "Saving a permanent snapshot of your code to the local history.", "Publishing the website live so visitors can see the update.", "Combining the code from two branches into a single timeline."], answer: "Saving a permanent snapshot of your code to the local history." },
        { question: "What is a Data Center?", options: ["A virtual storage space in the cloud that has no physical location.", "A highly secured physical building filled with powerful servers.", "A piece of software that manages and backs up a company's databases.", "The main office where an internet provider's support staff work."], answer: "A highly secured physical building filled with powerful servers." },
        { question: "Which company is known as the 'Original and Biggest' cloud provider (the PlayStation of the cloud)?", options: ["Google Cloud Platform (GCP)", "Microsoft Azure Cloud", "Amazon Web Services (AWS)", "Oracle Cloud Infrastructure"], answer: "Amazon Web Services (AWS)" },
        { question: "Which cloud service model (like a Dine-In Restaurant) provides a completed piece of software online where the provider manages everything?", options: ["SaaS", "PaaS", "IaaS", "On-premise"], answer: "SaaS" },
        { question: "Which cloud service model provides the raw hardware (like a blank Virtual Machine) where you have to build everything inside it?", options: ["PaaS", "SaaS", "IaaS", "On-premise"], answer: "IaaS" },
        { question: "Which cloud service model (like Netlify) gives developers the environment to deploy code without managing the operating system?", options: ["IaaS", "PaaS", "SaaS", "On-premise"], answer: "PaaS" },
        { question: "What is a Public Cloud?", options: ["Cloud storage that anyone on the internet can open without logging in.", "Infrastructure owned by a provider and shared among many customers.", "A free Wi-Fi network offered in public places like libraries and cafes.", "Servers owned by the government and shared among public agencies."], answer: "Infrastructure owned by a provider and shared among many customers." },
        { question: "What is a Private Cloud?", options: ["Cloud infrastructure dedicated solely to a single organization.", "A cloud account protected by a password and two-factor login.", "A hidden folder on your laptop that syncs only when you're online.", "A server that runs with no internet connection to stay secure."], answer: "Cloud infrastructure dedicated solely to a single organization." },
        { question: "What is a Hybrid Cloud?", options: ["A cloud that runs on both Mac and Windows servers at the same time.", "Using two public cloud providers, like AWS and Azure, at once.", "A mix of public and private clouds working together.", "A cloud that stores files online and on a USB drive as a backup."], answer: "A mix of public and private clouds working together." },
        { question: "What does 'Scalability' mean in cloud computing?", options: ["Automatically lowering computing power when traffic drops to save money.", "The ability to handle more work by adding more computing power.", "The physical size of the server racks a provider can fit in a building.", "How quickly a cloud server can load a web page for a single visitor."], answer: "The ability to handle more work by adding more computing power." },
        { question: "What is the primary benefit of cloud 'Elasticity'?", options: ["Blocking viruses automatically before they reach your servers.", "Automatically scaling down when traffic drops to save money.", "Making websites stretch and shrink to fit any phone screen.", "Running code faster by spreading it across several processors."], answer: "Automatically scaling down when traffic drops to save money." },
        { question: "Why is emailing files back and forth the 'wrong way' to collaborate on code?", options: ["Email is too slow to send large code files between computers.", "It leads to chaos, overwritten files, and lost work.", "Email programs change HTML tags so the code no longer runs.", "Email attachments can only hold one file at a time."], answer: "It leads to chaos, overwritten files, and lost work." },
        { question: "What is a 'push' in Git?", options: ["Downloading a teammate's latest changes from GitHub to your laptop.", "Uploading your local history to a remote repository like GitHub.", "Saving a snapshot of your changes to your local project history.", "Sending a branch to teammates so they can review it before merging."], answer: "Uploading your local history to a remote repository like GitHub." },
        { question: "What is the purpose of a README file on GitHub?", options: ["To list the passwords and keys the project needs to run.", "To act as the main stylesheet that every page links to.", "To explain what your project is to visitors.", "To block visitors from reading or copying your code."], answer: "To explain what your project is to visitors." },
        { question: "Who currently owns GitHub?", options: ["Google", "Amazon", "Microsoft", "Apple"], answer: "Microsoft" },
        { question: "If your home internet goes down, can you still use Git?", options: ["No, because every commit is saved directly to GitHub.", "Yes, because Git works locally on your hard drive.", "Only if you connect to a phone hotspot to reach GitHub.", "Yes, but you can only edit files, not commit them."], answer: "Yes, because Git works locally on your hard drive." },
        { question: "What does the term 'Cloud Computing' actually mean?", options: ["Storing your data on satellites that orbit above the Earth.", "Renting computer power from someone else over the internet.", "Connecting your devices together using wireless signals.", "Running every program in your browser instead of installing it."], answer: "Renting computer power from someone else over the internet." },
        { question: "Which major cloud provider is known as the 'Business' choice and deeply integrates with Windows?", options: ["Amazon Web Services", "Google Cloud", "Microsoft Azure", "DigitalOcean"], answer: "Microsoft Azure" },
        { question: "Which major cloud provider is known as the 'Data & AI' king (hosting YouTube)?", options: ["AWS (Amazon Web Services)", "GCP (Google Cloud Platform)", "Azure (Microsoft's Cloud)", "OCI (Oracle Cloud Infrastructure)"], answer: "GCP (Google Cloud Platform)" },
        { question: "What is a 'Repository' (Repo)?", options: ["A copy of your project that only exists on GitHub, never on your laptop.", "The main folder that contains all of your project's files and version history.", "A list of every command you have typed into Git since the project began.", "A special branch where finished code is stored after it has been reviewed."], answer: "The main folder that contains all of your project's files and version history." },
        { question: "What is a 'merge' in version control?", options: ["Combining several project files into one zip folder to upload them.", "Combining code from one branch into another, like a feature into main.", "Copying a remote repository from GitHub onto your own computer.", "Replacing your teammate's changes with your own version of a file."], answer: "Combining code from one branch into another, like a feature into main." },
        { question: "In the 'Pizza as a Service' analogy, what does 'Take and Bake' represent?", options: ["SaaS", "IaaS", "PaaS", "On-Premises"], answer: "IaaS" },
        { question: "In the 'Pizza as a Service' analogy, what does 'Pizza Delivery' represent?", options: ["SaaS", "IaaS", "PaaS", "On-Premises"], answer: "PaaS" },
        { question: "Google Docs and Netflix are examples of which service model?", options: ["IaaS", "PaaS", "SaaS", "NaaS"], answer: "SaaS" },
        { question: "Why do Data Centers have massive industrial air conditioning units?", options: ["Because the fiber-optic cables stop working if they get too warm.", "Because thousands of running servers create heat that can damage them.", "Because the cool air keeps dust and humidity out of the building.", "Because building codes require cooling wherever employees work."], answer: "Because thousands of running servers create heat that can damage them." },
        { question: "What is the role of backup generators at a Data Center?", options: ["To give the cooling system extra power on the hottest days.", "To keep servers running and sites online during power outages.", "To boost processing speed when traffic suddenly spikes.", "To charge the backup drives that store copies of the data."], answer: "To keep servers running and sites online during power outages." },
        { question: "What does it mean to work in 'parallel' using Git?", options: ["One developer editing two copies of the same file to compare them.", "Teammates taking turns editing main so only one person codes at once.", "Teammates building different features on separate branches at the same time.", "Running the same code on two computers to check that it gives the same result."], answer: "Teammates building different features on separate branches at the same time." },
        { question: "How does GitHub serve as a modern resume?", options: ["It turns your commit history into a PDF resume you can download.", "Employers can read the actual code in your public repositories.", "It ranks developers by followers so employers can find top coders.", "It shares your job history and references with hiring companies."], answer: "Employers can read the actual code in your public repositories." },
        { question: "When creating a new repository on GitHub, what does setting it to 'Public' mean?", options: ["Anyone on the internet can see your code and edit it directly.", "Anyone on the internet can see your code, but only you can change it.", "Your code is automatically published as a live website at a public URL.", "Only your team can see it, but anyone can request access to it."], answer: "Anyone on the internet can see your code, but only you can change it." },
        { question: "If you want to keep highly sensitive financial data completely isolated, which deployment model should you use?", options: ["Public Cloud", "Private Cloud", "Hybrid Cloud", "Distributed Cloud"], answer: "Private Cloud" },
        { question: "Which cloud deployment model is like 'Renting an apartment in a giant skyscraper'?", options: ["Private Cloud", "Hybrid Cloud", "Public Cloud", "Multi-Cloud"], answer: "Public Cloud" },
        { question: "When traffic spikes from 100 users to 50,000 users, what prevents a cloud-hosted site from crashing?", options: ["Scaling that adds more server power automatically as traffic grows.", "Minifying the HTML and CSS so each page takes up less bandwidth.", "Switching every image to a smaller, compressed file format.", "A faster home internet connection on the developer's computer."], answer: "Scaling that adds more server power automatically as traffic grows." },
        { question: "How do you pay for Cloud Computing resources?", options: ["A one-time lifetime fee that covers all the power you will ever use.", "By the minute or second based exactly on how much power you use.", "A flat monthly price, no matter how much computing power you use.", "By buying the physical servers and paying the provider to store them."], answer: "By the minute or second based exactly on how much power you use." },
        { question: "What does the command 'git clone' do?", options: ["Downloads only the newest changes into a repository you already have.", "Downloads a full copy of a remote repository to your local machine.", "Uploads your local commits to a remote repository like GitHub.", "Creates a copy of the current branch so you can test a new feature."], answer: "Downloads a full copy of a remote repository to your local machine." },
        { question: "What does the command 'git pull' do?", options: ["Downloads a brand-new full copy of a repository onto your machine.", "Downloads the newest changes from the remote into your local repository.", "Uploads your latest local commits to the remote repository.", "Asks teammates on GitHub to review and merge your branch into main."], answer: "Downloads the newest changes from the remote into your local repository." },
        { question: "What is a 'merge conflict'?", options: ["Two people pushed at the same moment, so GitHub rejected both pushes.", "Two people changed the same line, and Git can't tell which version to keep.", "A branch was deleted before its changes were merged into main.", "Two files in the project have the same name in different folders."], answer: "Two people changed the same line, and Git can't tell which version to keep." },
        { question: "Why is it important to write descriptive commit messages?", options: ["Because Git refuses to save a commit with a short message.", "So the team can see exactly what changed in each snapshot.", "Because the message becomes the version number of the site.", "Because GitHub uses the messages to rank your repositories."], answer: "So the team can see exactly what changed in each snapshot." },
        { question: "What is 'Web Hosting'?", options: ["Paying a company to reserve your website's name, like mysite.com.", "Paying a company to keep your site's files on an internet-connected server.", "Paying a company to design your layout and write your site's code.", "Paying a company to keep a backup copy of your site on a hard drive."], answer: "Paying a company to keep your site's files on an internet-connected server." },
        { question: "What is an Operating System (OS) in the context of servers?", options: ["The web server program, like Apache, that sends pages to browsers.", "Core software, like Linux, that manages the server's hardware.", "The database software, like MySQL, that stores the site's data.", "The browser software, like Chrome, used to manage the server."], answer: "Core software, like Linux, that manages the server's hardware." },
        { question: "If you rent a Virtual Machine on AWS, what model are you using?", options: ["SaaS", "PaaS", "IaaS", "On-premise"], answer: "IaaS" },
        { question: "Why is 'The Cloud' considered a nickname?", options: ["Because data travels through the air on wireless and satellite signals.", "Because it actually refers to physical computers sitting in a warehouse.", "Because files are stored in the sky using satellites that orbit Earth.", "Because the servers are virtual and don't exist anywhere physically."], answer: "Because it actually refers to physical computers sitting in a warehouse." },
        { question: "What does it mean to deploy a website?", options: ["To finish writing the HTML so the site is ready to be tested.", "To move a site from your private computer to a live, public server.", "To save a final commit of the project to your local history.", "To send the site to the client as a zip file to review offline."], answer: "To move a site from your private computer to a live, public server." },
        { question: "What is the primary advantage of working on a 'Branch'?", options: ["It creates a backup of the whole project on GitHub automatically.", "You can experiment freely without breaking the main, working version.", "It lets several people edit the very same line at the same time.", "It makes the project smaller so it uploads to GitHub faster."], answer: "You can experiment freely without breaking the main, working version." },
        { question: "If your startup suddenly goes viral on TikTok, which cloud feature saves you from going bankrupt after the viral spike ends?", options: ["Scalability (scaling up)", "Elasticity (scaling down)", "Hybrid cloud (shared load)", "Private cloud (own servers)"], answer: "Elasticity (scaling down)" },
        { question: "What is the 'Main' or 'Master' branch?", options: ["The branch where each developer tests their newest features.", "The default, definitive timeline of your project's code.", "The copy of your project stored on GitHub instead of your laptop.", "The developer on the team who reviews and approves every merge."], answer: "The default, definitive timeline of your project's code." },
        { question: "How does version control act as a 'time machine'?", options: ["It saves your files every few minutes, even without commits.", "You can rewind the project to an earlier commit if something breaks.", "It shows you what your code will look like after future changes.", "It changes file dates so old versions open in the right order."], answer: "You can rewind the project to an earlier commit if something breaks." },
        { question: "Why do companies use a Hybrid Cloud?", options: ["Two providers are cheaper than one, so they split all data evenly between them.", "Sensitive data stays private while public sites run on cheaper shared servers.", "It lets them avoid paying for servers by mixing free and paid cloud plans.", "It lets their websites run on both Mac and Windows servers at once."], answer: "Sensitive data stays private while public sites run on cheaper shared servers." },
        { question: "Which tool do you install on your local computer to track version history?", options: ["GitHub", "Git", "AWS", "Netlify"], answer: "Git" }
    ];

    const config = {
        questions: ch13Pool,
        questionCount: 25,
        chapterTitle: "Chapter 11 Diagnostic",
        webhookUrl: "https://script.google.com/macros/s/AKfycbzgJFP8F23d1C8UtIT1jG-eosRq1YBaA2dfqCIQnPMuZeAfGd1gVPYrObO8UQgkIb3atQ/exec"
    };

    window.onload = () => initPreTest(config);
  </script>

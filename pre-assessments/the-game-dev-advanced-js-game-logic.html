            <p class="mt-2 fw-bold">Loading Diagnostic Environment...</p>

  <script>
    const pool = [
        { question: "Standard order for a game loop?", options: ["Clear -> Update -> Draw", "Update -> Clear -> Draw", "Draw -> Clear -> Update", "Update -> Draw -> Clear"], answer: "Clear -> Update -> Draw" },
        { question: "Keyword to instantiate a new class object?", options: ["make", "build", "new", "create"], answer: "new" },
        { question: "Physics system checking for rectangle overlap?", options: ["AABB Collision", "Circle Collision", "Sprite Math", "Delta Time"], answer: "AABB Collision" },
        { question: "Function that runs automatically in an ES6 Class?", options: ["setup()", "constructor()", "init()", "start()"], answer: "constructor()" },
        { question: "How do you stop a loop using requestAnimationFrame?", options: ["stopAnimation()", "cancelAnimationFrame()", "break;", "clearInterval()"], answer: "cancelAnimationFrame()" },
        { question: "Origin point (0,0) location?", options: ["Center", "Bottom-Left", "Top-Left", "Top-Right"], answer: "Top-Left" },
        { question: "Which Math method rounds a number DOWN to a whole number (the one paired with Math.random() to pick a random integer)?", options: ["Math.ceil", "Math.random", "Math.floor", "Math.round"], answer: "Math.floor" },
        { question: "Property for physical key pressed?", options: ["event.key", "event.code", "event.which", "event.id"], answer: "event.code" },
        { question: "Keyword for specific class instance?", options: ["this", "that", "it", "self"], answer: "this" },
        { question: "Remove FIRST element of an array?", options: ["pop()", "splice()", "shift()", "delete"], answer: "shift()" },
        { question: "Time elapsed since last frame?", options: ["Frame Rate", "Delta Time", "Lag", "Frequency"], answer: "Delta Time" },
        { question: "Simulate gravity logic?", options: ["Multiply x by y", "Add constant to vertical velocity", "Set y to 0", "Subtract from mass"], answer: "Add constant to vertical velocity" },
        { question: "Math theorem for circle collision?", options: ["Euler", "Newton", "Pythagoras", "Pascal"], answer: "Pythagoras" },
        { question: "Detect key RELEASE?", options: ["keydown", "keyrelease", "keyup", "keyoff"], answer: "keyup" },
        { question: "Clear entire canvas ctx?", options: ["ctx.clear()", "ctx.clearRect()", "ctx.reset()", "canvas.innerHTML = ''"], answer: "ctx.clearRect()" },
        { question: "Math.floor(Math.random() * 10) range?", options: ["0 to 10", "1 to 10", "0 to 9", "1 to 9"], answer: "0 to 9" },
        { question: "Advantage of ES6 Classes?", options: ["Runs faster", "Reusability/Blueprints", "Less code", "Automatic physics"], answer: "Reusability/Blueprints" },
        { question: "Draw image to canvas?", options: ["ctx.draw()", "ctx.paint()", "ctx.drawImage()", "ctx.render()"], answer: "ctx.drawImage()" },
        { question: "Coordinate for top-left corner?", options: ["(0,0)", "(100,100)", "(-1,-1)", "(width,height)"], answer: "(0,0)" },
        { question: "Move object RIGHT logic?", options: ["x--", "x++", "y++", "y--"], answer: "x++" },
        { question: "Single image with multiple animation frames?", options: ["GIF", "MP4", "Sprite Sheet", "PNG"], answer: "Sprite Sheet" },
        { question: "Checks for invisible calculation area?", options: ["Haptic", "Hitbox", "VUI", "Anchor"], answer: "Hitbox" },
        { question: "Background layers moving at different speeds?", options: ["Parallax", "Delta", "Sync", "Frame Tearing"], answer: "Parallax" },
        { question: "Convert degrees to radians formula?", options: ["degrees * 180", "degrees / PI", "degrees * (PI / 180)", "Math.toRadians"], answer: "degrees * (PI / 180)" },
        { question: "Gradually reducing velocity over time?", options: ["Gravity", "Friction", "Acceleration", "Mass"], answer: "Friction" },
        { question: "Remove item from MIDDLE of array?", options: ["pop()", "shift()", "splice()", "delete"], answer: "splice()" },
        { question: "Canvas 'Depth' order equivalent?", options: ["Z-Index", "Drawing Order", "Mass", "Opacity"], answer: "Drawing Order" },
        { question: "Refers to speed and direction?", options: ["Mass", "Friction", "Velocity", "Gravity"], answer: "Velocity" },
        { question: "Method to start custom shape path?", options: ["ctx.start()", "ctx.newPath()", "ctx.beginPath()", "ctx.moveTo()"], answer: "ctx.beginPath()" },
        { question: "Why separate Update from Draw logic?", options: ["Browser requirement", "Easier to maintain and debug", "Faster on mobile", "Required for CSS"], answer: "Easier to maintain and debug" },
        { question: "What object is returned by fetch()?", options: ["JSON", "HTML", "Promise", "String"], answer: "Promise" },
        { question: "Which method draws a full circle arc?", options: ["ctx.circle()", "ctx.round()", "ctx.arc()", "ctx.draw()"], answer: "ctx.arc()" },
        { question: "What is the 'context' for canvas?", options: ["The parent div", "The CSS rule", "The 2D drawing API (ctx)", "The script tag"], answer: "The 2D drawing API (ctx)" },
        { question: "How many radians in a full circle?", options: ["360", "180", "Math.PI", "Math.PI * 2"], answer: "Math.PI * 2" },
        { question: "Horizontal flip canvas scaling?", options: ["scale(-1, 1)", "scale(1, -1)", "rotate(180)", "flipX()"], answer: "scale(-1, 1)" },
        { question: "Keyword to inherit from a Class?", options: ["inherits", "copies", "extends", "imports"], answer: "extends" },
        { question: "A game state variable uses which type?", options: ["String", "Boolean", "Number", "Array"], answer: "String" },
        { question: "What prevents 'smearing' on canvas?", options: ["ctx.save()", "ctx.clearRect()", "ctx.beginPath()", "ctx.restore()"], answer: "ctx.clearRect()" },
        { question: "Which method starts a custom path?", options: ["beginPath()", "startPath()", "closePath()", "stroke()"], answer: "beginPath()" },
        { question: "Axis for jumping up and down?", options: ["X-axis", "Y-axis", "Z-axis", "W-axis"], answer: "Y-axis" },
        { question: "Force that reduces velocity every frame?", options: ["Gravity", "Friction", "Speed", "Collision"], answer: "Friction" },
        { question: "What is an 'instance'?", options: ["The Class itself", "A specific object created from a Class", "A line of code", "A CSS file"], answer: "A specific object created from a Class" },
        { question: "Which method renders text on canvas?", options: ["drawText()", "write()", "fillText()", "paintText()"], answer: "fillText()" },
        { question: "What does ctx.save() do?", options: ["Saves score to database", "Saves the current drawing state", "Downloads a PNG", "Pauses the game"], answer: "Saves the current drawing state" },
        { question: "Haptic feedback uses which sense?", options: ["Sight", "Sound", "Touch", "Smell"], answer: "Touch" },
        { question: "Standard frames per second for smooth games?", options: ["12 FPS", "24 FPS", "30 FPS", "60 FPS"], answer: "60 FPS" },
        { question: "A 'Hard-coded' unexplained number is a:", options: ["Logic bomb", "Magic number", "Variable", "Constant"], answer: "Magic number" },
        { question: "A character sprite sheet contains:", options: ["One background", "Multiple frames of animation", "Sound effects", "CSS styles"], answer: "Multiple frames of animation" },
        { question: "Function to round 4.9 down to 4?", options: ["Math.round()", "Math.ceil()", "Math.floor()", "Math.min()"], answer: "Math.floor()" },
        { question: "What method stops a setInterval engine?", options: ["stopInterval()", "clearInterval()", "end()", "cancel()"], answer: "clearInterval()" },
        { question: "Hitbox logic is the same concept as:", options: ["Game Loop", "Bounding Box", "Constructor", "Method"], answer: "Bounding Box" },
        { question: "Final Result of a STAR description?", options: ["Situation", "Action", "Result", "Reason"], answer: "Result" }
    ];
    const config = {
        questions: pool,
        questionCount: 25,
        chapterTitle: "Chapter 10 Diagnostic",
        webhookUrl: "https://script.google.com/macros/s/AKfycbzgJFP8F23d1C8UtIT1jG-eosRq1YBaA2dfqCIQnPMuZeAfGd1gVPYrObO8UQgkIb3atQ/exec"
    };
    window.onload = () => initPreTest(config);
  </script>

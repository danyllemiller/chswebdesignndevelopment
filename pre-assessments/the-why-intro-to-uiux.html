  <script>
    const diagPool = [
        { question: "What does UX stand for in the context of web design?", options: ["User Exchange", "User Execution", "User Experience", "Universal Experience"], answer: "User Experience" },
        { question: "What does UI stand for in the context of web design?", options: ["User Integration", "User Interface", "Universal Interface", "Unified Input"], answer: "User Interface" },
        { question: "Which of the following best describes the difference between UI and UX?", options: ["UI is how it looks (the paint); UX is how it feels and functions (the architecture).", "UX is how it looks (the paint); UI is how it feels and functions (the architecture).", "UI is the code behind the page; UX is the visual design that sits on top of it.", "UI is for desktop sites (big screens); UX is for mobile apps (small touchscreens)."], answer: "UI is how it looks (the paint); UX is how it feels and functions (the architecture)." },
        { question: "What is User-Centered Design (UCD)?", options: ["Building every feature the client requests, in the order the client lists them.", "Putting the end user's needs and limits at the center of every design stage.", "Centering the layout on one main goal so every page looks consistent and clean.", "Testing the finished product with real users once all the design work is done."], answer: "Putting the end user's needs and limits at the center of every design stage." },
        { question: "In visual design, what is 'White Space' (Negative Space)?", options: ["Any area of a page that uses a white background color instead of a dark one.", "The empty space between and around elements that gives a design room to breathe.", "Extra space added at the bottom of a page so the footer never covers content.", "The blank area left behind when an image or video fails to load on a slow connection."], answer: "The empty space between and around elements that gives a design room to breathe." },
        { question: "What is Visual Hierarchy?", options: ["Arranging elements by importance so the eye notices the most important first.", "Organizing pages into a top-down tree so users can navigate the whole site.", "Giving every element the same size and weight so no content looks favored.", "Ordering menu links alphabetically so users can scan and find pages faster."], answer: "Arranging elements by importance so the eye notices the most important first." },
        { question: "How do users typically scan highly visual, image-based websites?", options: ["In an F-Pattern: across the top, then down the left side in short scans.", "In a Z-Pattern: across the top, diagonally down, then across again.", "In a center column: straight down the middle, ignoring both sides.", "In an L-Pattern: down the left edge, then across the bottom of the page."], answer: "In a Z-Pattern: across the top, diagonally down, then across again." },
        { question: "What is the 60-30-10 Rule in UI color design?", options: ["A color split: 60% dominant color, 30% secondary color, 10% accent color.", "A layout split: 60% content, 30% images, and 10% white space on each page.", "A font scale: headings at 60px, subheadings at 30px, and body text at 10px.", "A device split: design for 60% mobile, 30% desktop, and 10% tablet users."], answer: "A color split: 60% dominant color, 30% secondary color, 10% accent color." },
        { question: "What is an 'Affordance' in UX design?", options: ["A short text label, like a tooltip, that explains what a button will do when clicked.", "A visual clue that shows how something is used, like a button that looks clickable.", "A design rule that keeps every button and link the same color across all pages.", "Feedback the page gives after an action, like a button changing color when pressed."], answer: "A visual clue that shows how something is used, like a button that looks clickable." },
        { question: "What is 'Cognitive Load' in UX?", options: ["The amount of data and images a page must load before it can be used.", "The mental effort a user needs to understand and use an interface.", "The number of clicks a user needs to reach the page they want.", "The emotional reaction a user has the first time they see a design."], answer: "The mental effort a user needs to understand and use an interface." },
        { question: "What is the primary purpose of a 'Call to Action' (CTA)?", options: ["To sum up what the company does in one bold headline at the top of the page.", "To prompt the user to take one specific action, like 'Buy Now' or 'Sign Up'.", "To give users a way to reach the company, like a phone number or email link.", "To show customer reviews and star ratings that build trust in the product."], answer: "To prompt the user to take one specific action, like 'Buy Now' or 'Sign Up'." },
        { question: "What is a 'Prototype' in UI/UX?", options: ["A quick paper sketch of a page layout made during the first brainstorming session.", "An interactive model that simulates how the final product will work before coding.", "A finished, coded version of the site published on a test server for the client.", "A static, full-color picture of a page used to get the client's approval on looks."], answer: "An interactive model that simulates how the final product will work before coding." },
        { question: "Which font type is generally considered best for large blocks of text on digital screens?", options: ["Serif", "Monospace", "Sans-Serif", "Script"], answer: "Sans-Serif" },
        { question: "What is a 'Dark Pattern' in UI design?", options: ["A dark color theme that lowers screen glare and saves battery on mobile devices.", "A deceptive design trick that pushes users into doing something they didn't intend.", "A hidden menu that only appears after the user scrolls or hovers over the page.", "A pop-up that asks permission before collecting cookies or other personal data."], answer: "A deceptive design trick that pushes users into doing something they didn't intend." },
        { question: "What is the 'Curb Cut Effect'?", options: ["Cutting features that only a few users need so the site loads faster for all.", "Designing for users with disabilities often ends up helping everyone else too.", "Removing barriers from the checkout process so more visitors finish buying.", "Designing for the average user first, then adding accessibility features later."], answer: "Designing for users with disabilities often ends up helping everyone else too." },
        { question: "Users reading a text-heavy blog post usually scan the page in which reading pattern?", options: ["Z-Pattern", "F-Pattern", "Diagonal pattern", "Circular pattern"], answer: "F-Pattern" },
        { question: "What is the imaginary line where the screen cuts off content before scrolling?", options: ["The Viewport", "The Margin", "The Fold", "The Header Line"], answer: "The Fold" },
        { question: "Small bits of text like button labels and tooltips are called:", options: ["Metadata", "Microcopy", "Alt text", "Body copy"], answer: "Microcopy" },
        { question: "A pop-up window that appears on top of the main page is a:", options: ["Modal", "Banner", "Tooltip", "Card"], answer: "Modal" },
        { question: "UX strategy that prioritizes small screens first:", options: ["Desktop-First", "Mobile-First", "Responsive Scaling", "Graceful Degradation"], answer: "Mobile-First" },
        { question: "The feeling of friction or barriers in an interface is a:", options: ["Bottleneck", "Pain Point", "Dark Pattern", "Edge Case"], answer: "Pain Point" },
        { question: "What tool is used for high-fidelity UI design?", options: ["VS Code", "Figma", "FileZilla", "GitHub"], answer: "Figma" },
        { question: "User research to find 'Why' via interviews is:", options: ["Quantitative", "Qualitative", "Analytical", "Demographic"], answer: "Qualitative" },
        { question: "User research to find 'How Many' via stats is:", options: ["Qualitative", "Quantitative", "Observational", "Anecdotal"], answer: "Quantitative" },
        { question: "Which Gestalt principle states close items are related?", options: ["Similarity", "Proximity", "Continuity", "Closure"], answer: "Proximity" }
    ];

    const config = {
        questions: diagPool,
        questionCount: 15,
        chapterTitle: "Chapter 4 Diagnostic",
        webhookUrl: "https://script.google.com/macros/s/AKfycbzgJFP8F23d1C8UtIT1jG-eosRq1YBaA2dfqCIQnPMuZeAfGd1gVPYrObO8UQgkIb3atQ/exec"
    };

    window.onload = () => initPreTest(config);
  </script>

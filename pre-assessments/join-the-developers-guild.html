    const diagPool = [
        { question: "What does the acronym CTSO stand for (e.g., SkillsUSA or FBLA)?", options: ["Career and Technical Student Organization", "College and Technical Skills Organization", "Computer Technology Student Organization", "Career Training and Skills Opportunity"], answer: "Career and Technical Student Organization" },
        { question: "What are 'Soft Skills' in the tech industry?", options: ["Communication, teamwork, empathy, and problem-solving.", "Writing clean HTML, CSS, and JavaScript code quickly.", "Fixing hardware, servers, and network connections.", "Using design software like Photoshop and Figma well."], answer: "Communication, teamwork, empathy, and problem-solving." },
        { question: "Which Career 'Class' is responsible for writing the code (HTML/CSS/JS) that runs locally in the browser?", options: ["Front-End Developer", "Back-End Developer", "QA Tester", "Database Administrator"], answer: "Front-End Developer" },
        { question: "What is the 'Project Triangle' rule for building an MVP (Minimum Viable Product)?", options: ["You can only pick two: Fast, Cheap, or Good.", "You can have all three if the team works hard.", "Speed is the only thing that matters to clients.", "Quality always comes first, no matter the cost."], answer: "You can only pick two: Fast, Cheap, or Good." },
        { question: "What is the mandatory, non-negotiable filename for the homepage of a professional website?", options: ["index.html", "home.html", "main.html", "start.html"], answer: "index.html" },
        { question: "What is the physical network of cables, routers, and servers connecting the globe called?", options: ["The Internet", "The World Wide Web", "The Intranet", "The Cloud"], answer: "The Internet" },
        { question: "What system acts as the 'phone book' of the internet, translating human-readable domain names into numerical IP addresses?", options: ["DNS (Domain Name System)", "HTTP (Hypertext Transfer Protocol)", "W3C (World Wide Web Consortium)", "ISP (Internet Service Provider)"], answer: "DNS (Domain Name System)" },
        { question: "In web architecture, your browser requests files and a powerful remote computer delivers them. What is this model called?", options: ["The Client-Server Model", "The Peer-to-Peer Model", "The Cloud-Storage Model", "The Local-Host Model"], answer: "The Client-Server Model" },
        { question: "What cryptographic mechanism does a website need to establish a secure, encrypted HTTPS connection?", options: ["An SSL Certificate", "A Content Delivery Network (CDN)", "A fast IP Address", "A Private Intranet"], answer: "An SSL Certificate" },
        { question: "Which cloud hosting model is analogous to a 'Take-and-Bake' pizza, where you rent raw hardware but configure the operating system yourself?", options: ["IaaS (Infrastructure as a Service)", "PaaS (Platform as a Service)", "SaaS (Software as a Service)", "DaaS (Database as a Service)"], answer: "IaaS (Infrastructure as a Service)" },
        { question: "Which core web language is considered the 'Bones' or structural foundation of a webpage?", options: ["HTML (HyperText Markup Language)", "CSS (Cascading Style Sheets)", "JS (JavaScript Programming)", "PHP (Hypertext Preprocessor)"], answer: "HTML (HyperText Markup Language)" },
        { question: "Arranging elements on a page by size and color so the user's eye is naturally guided to the most important information first is known as:", options: ["Visual Hierarchy", "White Space", "The Z-Pattern", "Color Theory"], answer: "Visual Hierarchy" },
        { question: "Automatic legal protection for original creative works (like code, photos, or text) that you create is called:", options: ["Copyright", "Trademark", "Patent", "Fair Use"], answer: "Copyright" },
        { question: "Deceptive techniques used to artificially boost a website's ranking on search engines (like keyword stuffing or invisible text) are called:", options: ["Spamdexing", "Search Engine Optimization (SEO)", "Clickbait", "Link Building"], answer: "Spamdexing" },
        { question: "What sociological principle proves that designing for marginalized users (like adding alt-text for the blind) inherently makes the web better for everyone?", options: ["The Curb Cut Effect", "The Ripple Effect", "The Network Effect", "The Domino Effect"], answer: "The Curb Cut Effect" },
        { question: "What is the fundamental difference between the Internet and the World Wide Web?", options: ["The Internet is the physical network; the Web is a service that runs on top of it.", "The Web is the physical infrastructure; the Internet is a service that runs on it.", "They're exactly the same thing; 'the Web' is just the older name for the Internet.", "The Internet is only for email and chat; the Web is only for videos and games."], answer: "The Internet is the physical network; the Web is a service that runs on top of it." },
        { question: "A restricted, internal network only for members of a specific organization (like a company's employees) is called an:", options: ["Intranet", "Extranet", "ARPANET", "Dark Web"], answer: "Intranet" },
        { question: "Who is credited with inventing the World Wide Web in 1989?", options: ["Tim Berners-Lee", "Bill Gates", "Steve Jobs", "Mark Zuckerberg"], answer: "Tim Berners-Lee" },
        { question: "What does the 'W3C' (World Wide Web Consortium) do?", options: ["Develops open standards like HTML and CSS so sites work the same in every browser.", "Sells domain names to businesses and keeps a public list of who owns each one.", "Provides free cloud hosting for school and nonprofit websites around the world.", "Tracks down the hackers who attack websites and reports them to the police."], answer: "Develops open standards like HTML and CSS so sites work the same in every browser." },
        { question: "What is an IP Address?", options: ["A unique numerical coordinate assigned to every device on a network.", "The password that lets a device join a home or school Wi-Fi network.", "The street address of the building where a website's server is kept.", "The name of a website, like google.com, that users type into a browser."], answer: "A unique numerical coordinate assigned to every device on a network." },
        { question: "Which global non-profit organization manages the rules for Domain Name registrars?", options: ["ICANN", "W3C", "IEEE", "IETF"], answer: "ICANN" },
        { question: "What is the primary purpose of a CDN (Content Delivery Network)?", options: ["It stores copies of files on servers around the world so pages load faster.", "It creates strong, unique passwords for each user when they sign up for the site.", "It writes and minifies the site's CSS code automatically while you build it.", "It deletes old, unused files from the site's database so the server runs faster."], answer: "It stores copies of files on servers around the world so pages load faster." },
        { question: "Which web language provides the 'Clothes' (Style and Appearance) of a website?", options: ["CSS", "HTML", "JavaScript", "Python"], answer: "CSS" },
        { question: "Which web language provides the 'Brains' (Interactivity and Logic) of a website?", options: ["JavaScript", "HTML", "CSS", "SQL"], answer: "JavaScript" },
        { question: "Which career role focuses primarily on visual aesthetics (UI) and user psychology (UX) to create a frictionless journey?", options: ["UI/UX Designer", "Database Administrator", "DevOps Engineer", "QA Tester"], answer: "UI/UX Designer" },
        { question: "What do you call an elite developer who has mastered both the Front-End interface and the Back-End database architecture?", options: ["Full-Stack Developer", "Front-End Developer", "Back-End Developer", "Project Manager"], answer: "Full-Stack Developer" },
        { question: "Which debugging technique involves a developer articulating their code line-by-line to an inanimate object to illuminate logic errors?", options: ["Rubber Duck Debugging", "Pair Programming", "Code Review", "Console Logging"], answer: "Rubber Duck Debugging" },
        { question: "Why must web developers NEVER use spaces in their file or folder names?", options: ["Spaces turn into broken characters like %20 in URLs, so developers use hyphens.", "Spaces take up extra memory on the server, so every page loads more slowly.", "HTML tags can't contain any spaces, so the browser refuses to open the file at all.", "Google lowers the search ranking of any site with spaces in its file names."], answer: "Spaces turn into broken characters like %20 in URLs, so developers use hyphens." },
        { question: "What is the industry term for deceptive UI tricks designed to manipulate users into clicking things they did not intend to?", options: ["Dark Patterns", "Visual Hierarchies", "Microinteractions", "Affordances"], answer: "Dark Patterns" },
        { question: "The legal contract professionals sign to protect a company's Trade Secrets is called an:", options: ["NDA (Non-Disclosure Agreement)", "Work-for-Hire Contract (WFH)", "Copyright Registration Form", "Terms of Service Agreement (TOS)"], answer: "NDA (Non-Disclosure Agreement)" },
        { question: "Which nationally recognized organization acts as a 'cheat code' for your career by providing leadership training and technical competitions?", options: ["A CTSO (like SkillsUSA or FBLA)", "The W3C (World Wide Web Consortium)", "ICANN (the domain name authority)", "IEEE (an engineering society)"], answer: "A CTSO (like SkillsUSA or FBLA)" },
        { question: "According to the Agile Project Triangle, every project balances Time (Fast), Cost (Cheap), and Quality (Good). What is the golden rule?", options: ["You can only pick TWO.", "Always choose the most expensive option.", "Speed is the only thing that matters.", "Clients prefer cheap and slow projects."], answer: "You can only pick TWO." }
    ];

    };

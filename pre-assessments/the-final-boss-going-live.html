  <script>
    const diagPool = [
        { question: "What does the term 'Deployment' mean in web development?", options: ["Writing the final CSS so that the site looks the same in every single browser.", "Saving a backup copy of the site's files onto an external hard drive.", "Moving files from a local private environment to a public live environment.", "Deleting the old code and files from the server before the new launch."], answer: "Moving files from a local private environment to a public live environment." },
        { question: "What does FTP stand for?", options: ["File Tracking Program", "File Transfer Protocol", "Fast Transfer Pipeline", "Folder Transfer Path"], answer: "File Transfer Protocol" },
        { question: "Why is the 'Old School' FTP method considered dangerous for modern team development?", options: ["It's too cheap for professional teams to use, so clients don't trust the results.", "It's manual and error-prone, and it can overwrite live files with no 'undo' button.", "It only works for mobile apps, not for websites that run in a desktop web browser.", "It requires a special monitor and keyboard setup that most developers don't own."], answer: "It's manual and error-prone, and it can overwrite live files with no 'undo' button." },
        { question: "What is the name of the popular, legacy software program used as a digital 'moving truck' for FTP?", options: ["FileZilla", "Photoshop", "Git", "Netlify"], answer: "FileZilla" },
        { question: "In modern development, what does CI/CD stand for?", options: ["Code Inspection / Code Delivery", "Continuous Integration / Continuous Deployment", "Cloud Integration / Cloud Deployment", "Continuous Iteration / Content Design"], answer: "Continuous Integration / Continuous Deployment" },
        { question: "How does a modern cloud host know when you have updated your code on GitHub?", options: ["Through an automatic email that GitHub sends to the host.", "Through an automated digital tripwire called a Webhook.", "By checking your repository for changes once every day.", "By restarting the server each time a developer logs in."], answer: "Through an automated digital tripwire called a Webhook." },
        { question: "What is the primary benefit of a CI/CD pipeline?", options: ["It removes the need to write HTML, since the pipeline builds each page for you.", "It makes the website's code impossible to hack by scanning it before every update.", "It automatically updates the live website seconds after you push code to GitHub.", "It keeps the website's hosting free for life as long as the code is stored on GitHub."], answer: "It automatically updates the live website seconds after you push code to GitHub." },
        { question: "What is the Domain Name System (DNS)?", options: ["A virus scanner that checks every website for malware before your browser opens it.", "The internet's phonebook, translating domain names into the IP addresses computers use.", "A type of database that stores a copy of every website's HTML and CSS files.", "The company that sells you a domain name and renews it for you every single year."], answer: "The internet's phonebook, translating domain names into the IP addresses computers use." },
        { question: "When you purchase a domain name from a Registrar (like GoDaddy), how long do you typically 'own' it before having to renew?", options: ["Forever.", "One Month.", "One Year.", "Ten Years."], answer: "One Year." },
        { question: "What is a DNS 'A Record' used for?", options: ["Pointing a domain name to another domain name, like an alias.", "Routing a domain's incoming email to the right mail server.", "Pointing a domain name to a specific numeric IP address.", "Storing a text note that proves who owns the domain name."], answer: "Pointing a domain name to a specific numeric IP address." },
        { question: "What is a DNS 'CNAME Record' used for?", options: ["Pointing a domain name directly to a specific numeric IP address.", "Pointing a domain to another domain name, like a Netlify app link.", "Routing a domain's incoming email to the correct mail server.", "Hiding the server's real IP address from people who visit."], answer: "Pointing a domain to another domain name, like a Netlify app link." },
        { question: "What does 'DNS Propagation' refer to?", options: ["The time it takes a new DNS setting to spread to servers around the world.", "The yearly cost of keeping a domain name registered in your name.", "An attack that floods DNS servers with fake requests to slow them down.", "The process of uploading all of a site's files to a server using FTP."], answer: "The time it takes a new DNS setting to spread to servers around the world." },
        { question: "In the context of launching a site, what does QA stand for?", options: ["Quick Approval", "Quantity Assessment", "Quality Assurance", "Query Analysis"], answer: "Quality Assurance" },
        { question: "Why should you perform the 'Resize Test' before launching?", options: ["To check that every word on the page is spelled correctly before launch.", "To make sure the layout doesn't break and stays responsive on phone-sized screens.", "To test how fast the site loads for someone on a slow school Wi-Fi connection.", "To make sure the images are resized to the correct file size for the web."], answer: "To make sure the layout doesn't break and stays responsive on phone-sized screens." },
        { question: "What is 'Link Rot'?", options: ["When an old server slows down over time because its parts are wearing out.", "When links point to pages that were deleted or moved, causing 404 errors.", "When an image gets blurry after it's resized and saved too many times.", "When code gets messy because many people have edited it without any comments."], answer: "When links point to pages that were deleted or moved, causing 404 errors." },
        { question: "When conducting an 'Alt Audit' for accessibility, what are you checking?", options: ["That every heading uses a font size that is large enough for users to read.", "That every <img> tag has a descriptive alt='' attribute for screen readers.", "That the background colors have enough contrast with the text on top.", "That every page's URL is short and simple enough for users to type by hand."], answer: "That every <img> tag has a descriptive alt='' attribute for screen readers." },
        { question: "What should you be looking for when you open the Browser Developer Console during QA testing?", options: ["Bright red JavaScript errors or failed image loads.", "The site's admin password, to make sure it is secure.", "The HTML code for the navbar, to check its structure.", "Yellow warnings about the site's font and color choices."], answer: "Bright red JavaScript errors or failed image loads." },
        { question: "What is Google Lighthouse?", options: ["A free hosting service from Google that runs your website on Google's own servers.", "A free tool built into Chrome that grades a site's performance and accessibility.", "A Google search feature that ranks your website higher once it passes a speed test.", "A Chrome extension that blocks ads and trackers so that every page loads faster."], answer: "A free tool built into Chrome that grades a site's performance and accessibility." },
        { question: "Why is a portfolio so critical for a developer seeking a job?", options: ["It replaces a diploma, so employers don't need to see any school records.", "It's a 'Show, Don't Tell' showcase that proves you can build working software.", "It is required by law for anyone applying for a developer job in the U.S.", "It lists every class you've taken, so employers can check all of your grades."], answer: "It's a 'Show, Don't Tell' showcase that proves you can build working software." },
        { question: "What is the 'STAR Method' used for in a portfolio Case Study?", options: ["Describing a project by its Situation, Task, Action, and Result.", "Naming variables by Scope, Type, Area, and Role so code is readable.", "Rating each project from one to five stars based on how hard it was.", "Animating the portfolio's case studies so they appear one at a time."], answer: "Describing a project by its Situation, Task, Action, and Result." },
        { question: "Why is it important to include a link to the GitHub Repository for your portfolio projects?", options: ["So GitHub hosts the portfolio for free and gives you a custom domain name.", "So hiring managers can read your actual code and see how you solved problems.", "So the portfolio's images load in much higher quality from GitHub's servers.", "So the portfolio site can get past school and company firewalls more easily."], answer: "So hiring managers can read your actual code and see how you solved problems." },
        { question: "What is 'Imposter Syndrome'?", options: ["When a hacker copies your whole portfolio and pretends that your work is theirs.", "Feeling like you aren't a 'real' professional, despite what you've accomplished.", "A computer virus that disguises itself as a trusted program to get installed.", "Being overconfident and claiming skills you don't actually have on a resume."], answer: "Feeling like you aren't a 'real' professional, despite what you've accomplished." },
        { question: "What is a 'Subdomain'?", options: ["A hidden page on a domain that only people with the exact link are able to find.", "A prefix added to a domain to separate content, like blog.mysite.com.", "An old domain name that has expired and is waiting to be bought by someone again.", "The ending of a domain name, like .com or .org, that shows what type of site it is."], answer: "A prefix added to a domain to separate content, like blog.mysite.com." },
        { question: "What is the primary function of a Content Delivery Network (CDN)?", options: ["To write and update a site's HTML automatically whenever the content changes.", "To host copies of your website on servers globally so it loads fast for everyone.", "To block spam messages before they ever reach a website's contact form inbox.", "To automatically translate a website into each visitor's language based on location."], answer: "To host copies of your website on servers globally so it loads fast for everyone." },
        { question: "What is the danger of hardcoding an Absolute Path (like C:/Users/...) in your HTML?", options: ["It uses too much memory, so the site runs slowly on every single visitor's device.", "It works on your laptop, but will break completely when moved to a cloud server.", "It lets viruses spread from your own laptop to the server when you upload the site.", "It makes the page's custom fonts switch back to the browser's default fonts."], answer: "It works on your laptop, but will break completely when moved to a cloud server." },
        { question: "Which file is automatically recognized as the default homepage by almost all web servers?", options: ["home.html", "index.html", "main.html", "start.html"], answer: "index.html" },
        { question: "What is the purpose of an SSL/TLS Certificate on a live website?", options: ["To enable the padlock icon and encrypt data sent between the user and the server.", "To make the website's URL shorter and much easier for visitors to remember.", "To translate the whole site automatically for visitors from other countries.", "To prove the site is fast enough to be listed on the first page of Google results."], answer: "To enable the padlock icon and encrypt data sent between the user and the server." },
        { question: "What is 'Vendor Lock-in'?", options: ["When a hacker takes over a website and locks the real owner out of its dashboard.", "Building on a closed platform, like Wix, so you can't easily move to another host.", "When a site's IP address changes and its domain name stops pointing to the server.", "A hosting contract that requires you to pay for at least two years in advance."], answer: "Building on a closed platform, like Wix, so you can't easily move to another host." }
    ];

    const config = {
        questions: diagPool,
        questionCount: 15,
        chapterTitle: "Chapter 16 Diagnostic",
        webhookUrl: "https://script.google.com/macros/s/AKfycbzgJFP8F23d1C8UtIT1jG-eosRq1YBaA2dfqCIQnPMuZeAfGd1gVPYrObO8UQgkIb3atQ/exec"
    };

    window.onload = () => initPreTest(config);
  </script>

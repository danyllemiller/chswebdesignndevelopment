<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Classroom Tools | Infinite Campus Sync</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=23"></script>
  <script type="module" src="/js/auth-guard.js?v=1"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .tools-card { max-width: 800px; margin: 2.5rem auto; }
    .status-badge { font-weight: 700; font-size: .8rem; padding: .3rem .65rem; border-radius: 999px; }
    .status-tardy { background: #fff3cd; color: #997404; }
    .status-absent { background: #fde0de; color: #842029; }
    .status-excused { background: #cfe2ff; color: #084298; }
    .excused-row { background: #f0f6ff; }
    .excused-note { font-size: .75rem; color: #084298; font-weight: 700; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container tools-card">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
        <div>
          <h2 class="gochi text-primary mb-1"><i class="fas fa-right-left me-2"></i>Infinite Campus Sync</h2>
          <p class="text-muted mb-0">Tardy/absent marks from scanning that still need to be re-entered in IC by hand. Nothing here touches IC itself — check them off once you've actually made the change there.</p>
          <div class="d-flex gap-2 mt-2">
            <a href="/admin/attendance-scan.html" class="btn btn-outline-primary btn-sm"><i class="fas fa-qrcode me-1"></i>Go to Attendance Scanning</a>
            <a href="/admin/attendance-report.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-clipboard-check me-1"></i>Go to Attendance Report</a>
          </div>
        </div>
        <button id="markAllBtn" class="btn btn-success fw-bold"><i class="fas fa-check-double me-1"></i>Mark All Done</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-bordered bg-white">
          <thead class="table-warning">
            <tr><th style="width:2.5rem;"></th><th>Student</th><th>Period</th><th>Date</th><th>What to enter in IC</th></tr>
          </thead>
          <tbody id="pendingBody">
            <tr><td colspan="5" class="text-center p-5 text-muted"><div class="spinner-border text-primary mb-3"></div><br>Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <button id="markSelectedBtn" class="btn btn-primary fw-bold d-none"><i class="fas fa-check me-1"></i>Mark Selected Done</button>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script type="module" src="/js/admin/ic-sync-reminder.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Teacher Admin | Checklist</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Foundation:wght@400;500;600;700&family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet" />

  <script src="/js/loader.js?v=6"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    .checklist-item { transition: background 0.15s; border-radius: 6px; padding: 10px 12px; }
    .checklist-item:hover { background: rgba(0,0,0,.04); }
    .checklist-item.is-done label { text-decoration: line-through; color: #6c757d; }
    .checklist-item .form-check-input { width: 1.25em; height: 1.25em; margin-top: 0.15em; cursor: pointer; }
    .checklist-item label { cursor: pointer; font-size: .95rem; }
    .flash-saved { animation: flashGreen 0.5s ease; }
    @keyframes flashGreen { 0%{background:#d1fae5} 100%{background:transparent} }
    .tab-cadence-badge { font-size: .75rem; font-weight: 600; letter-spacing: .03em; }
    .progress { height: 10px; border-radius: 99px; }
    .nav-pills .nav-link { font-size: .85rem; padding: .35rem .85rem; }
    .section-header { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: #6c757d; font-weight: 700; margin: 1rem 0 .4rem; }
  </style>
</head>
<body class="bg-white">

  <div class="container-fluid sticky-top px-0">
    <div id="nav-placeholder"></div>
  </div>

  <div class="container my-5" style="max-width:800px;">
    <div class="card shadow-sm border-primary">
      <div class="card-header bg-primary text-white py-3 d-flex align-items-center gap-3">
        <i class="fas fa-clipboard-check fs-4"></i>
        <div>
          <h4 class="mb-0 gochi">Teacher Checklist</h4>
          <small class="opacity-75">Items auto-reset at the start of each new day / week / month / period</small>
        </div>
        <span id="teacher-badge" class="badge bg-light text-primary ms-auto shadow-sm">Loading...</span>
      </div>

      <div class="card-body p-4">
        <div id="login-error" class="alert alert-danger d-none">
          <i class="fas fa-lock me-2"></i>You must be logged in as a teacher or admin to use this checklist.
        </div>

        <!-- Tab Pills -->
        <ul class="nav nav-pills flex-wrap gap-1 mb-4" id="checklist-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-cadence="daily" data-bs-toggle="pill" type="button">
              <i class="fas fa-sun me-1"></i>Daily
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-cadence="weekly" data-bs-toggle="pill" type="button">
              <i class="fas fa-calendar-week me-1"></i>Weekly
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-cadence="biweekly" data-bs-toggle="pill" type="button">
              <i class="fas fa-calendar-alt me-1"></i>Bi-Weekly
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-cadence="monthly" data-bs-toggle="pill" type="button">
              <i class="fas fa-calendar me-1"></i>Monthly
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-cadence="quarterly" data-bs-toggle="pill" type="button">
              <i class="fas fa-chart-bar me-1"></i>Quarterly
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-cadence="semester" data-bs-toggle="pill" type="button">
              <i class="fas fa-graduation-cap me-1"></i>Semester
            </button>
          </li>
        </ul>

        <!-- Period label + progress + actions -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3" id="checklist-meta">
          <span id="period-label" class="badge bg-light text-dark border tab-cadence-badge"></span>
          <div class="d-flex gap-2">
            <button id="btn-mark-all" class="btn btn-sm btn-outline-success">
              <i class="fas fa-check-double me-1"></i>Mark All Done
            </button>
            <button id="btn-reset-all" class="btn btn-sm btn-outline-danger">
              <i class="fas fa-undo me-1"></i>Reset All
            </button>
          </div>
        </div>
        <div class="mb-1 d-flex justify-content-between small text-muted">
          <span id="progress-label">Loading…</span>
        </div>
        <div class="progress mb-4">
          <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width:0%"></div>
        </div>

        <!-- Quarterly / Semester event notice -->
        <div id="event-notice" class="alert alert-info d-none small py-2 mb-3">
          <i class="fas fa-calendar-check me-2"></i><span id="event-notice-text"></span>
        </div>
        <div id="no-event-notice" class="alert alert-secondary d-none small py-2 mb-3">
          <i class="fas fa-info-circle me-2"></i><span id="no-event-text"></span>
        </div>

        <!-- Checklist items container -->
        <div id="checklist-items">
          <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/bootstrap.bundle.js"></script>

  <script>
  (async function () {
    const SPECIAL_DATES_URL = '/special-dates.csv';

    // --- Cadence accent colors ---
    const CADENCE_COLORS = {
      daily:     'primary',
      weekly:    'info',
      biweekly:  'purple',
      monthly:   'warning',
      quarterly: 'danger',
      semester:  'dark',
    };

    // --- State ---
    let teacherId = null;
    let currentCadence = 'daily';
    let currentPeriodKey = null;
    let currentItems = [];
    let specialDates = [];

    // --- Auth ---
    function getTeacherId() {
      try {
        const u = JSON.parse(localStorage.getItem('user') || 'null');
        return u && (u.role === 'admin' || u.role === 'teacher') ? u.student_id : null;
      } catch (_) { return null; }
    }

    // --- Special dates ---
    async function loadSpecialDates() {
      try {
        const text = await fetch(SPECIAL_DATES_URL).then(r => r.text());
        specialDates = text.trim().split('\n').slice(1).map(line => {
          const parts = line.split(',');
          return { date: (parts[0] || '').trim(), type: (parts[1] || '').trim(), desc: (parts[2] || '').trim() };
        }).filter(r => r.date);
      } catch (_) { specialDates = []; }
    }

    function findEventDate(keywords) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      // future events first
      const future = specialDates.filter(r => {
        const d = new Date(r.date + 'T00:00:00');
        return d >= today && keywords.some(k => r.desc.toLowerCase().includes(k.toLowerCase()));
      }).sort((a, b) => a.date.localeCompare(b.date));
      if (future.length) return future[0];
      // fall back to most recent past
      const past = specialDates.filter(r => {
        const d = new Date(r.date + 'T00:00:00');
        return d < today && keywords.some(k => r.desc.toLowerCase().includes(k.toLowerCase()));
      }).sort((a, b) => b.date.localeCompare(a.date));
      return past[0] || null;
    }

    // --- Period key computation ---
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function isoWeekKey() {
      const d = new Date();
      const thu = new Date(d);
      thu.setDate(d.getDate() + (4 - (d.getDay() || 7)));
      const yearStart = new Date(thu.getFullYear(), 0, 1);
      const wk = Math.ceil(((thu - yearStart) / 86400000 + 1) / 7);
      return `${thu.getFullYear()}-W${String(wk).padStart(2,'0')}`;
    }

    function getPeriodKey(cadence, eventDate) {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      switch (cadence) {
        case 'daily':     return todayStr();
        case 'weekly':    return isoWeekKey();
        case 'biweekly':  return `${y}-${m}-${d.getDate() < 15 ? '01' : '15'}`;
        case 'monthly':   return `${y}-${m}`;
        case 'quarterly': return eventDate ? `Q-${eventDate.date}` : null;
        case 'semester':  return eventDate ? `S-${eventDate.date}` : null;
      }
      return todayStr();
    }

    function getPeriodLabel(cadence, pKey, eventDate) {
      const d = new Date();
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      switch (cadence) {
        case 'daily':     return `Today: ${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`;
        case 'weekly':    return `Week ${pKey.split('-W')[1]} · ${d.getFullYear()}`;
        case 'biweekly':  return `${months[d.getMonth()]} ${d.getDate() < 15 ? '1st–14th' : '15th–end'} · ${d.getFullYear()}`;
        case 'monthly':   return `${months[d.getMonth()]} ${d.getFullYear()}`;
        case 'quarterly': return eventDate ? `Quarter End: ${eventDate.date}` : '';
        case 'semester':  return eventDate ? `Semester End: ${eventDate.date}` : '';
      }
      return pKey;
    }

    // --- UI helpers ---
    function updateProgress() {
      const total = currentItems.length;
      const done = currentItems.filter(i => i.completed).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-label').textContent = `${done} of ${total} done`;
    }

    function renderItems() {
      const container = document.getElementById('checklist-items');
      if (!currentItems.length) {
        container.innerHTML = '<p class="text-muted text-center py-4">No items for this period.</p>';
        return;
      }
      container.innerHTML = currentItems.map(item => `
        <div class="checklist-item d-flex align-items-start gap-2 mb-1 ${item.completed ? 'is-done' : ''}" id="row-${item.key}">
          <div class="form-check mb-0 d-flex align-items-start gap-2 w-100">
            <input class="form-check-input mt-1 flex-shrink-0" type="checkbox" id="chk-${item.key}"
              data-key="${item.key}" ${item.completed ? 'checked' : ''}>
            <label class="form-check-label" for="chk-${item.key}">${item.text}</label>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.form-check-input').forEach(chk => {
        chk.addEventListener('change', async () => {
          const key = chk.dataset.key;
          const completed = chk.checked;
          const item = currentItems.find(i => i.key === key);
          if (item) item.completed = completed;
          const row = document.getElementById(`row-${key}`);
          row.classList.toggle('is-done', completed);
          row.classList.add('flash-saved');
          row.addEventListener('animationend', () => row.classList.remove('flash-saved'), { once: true });
          updateProgress();
          await fetch('/api/admin/checklist/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ teacher_id: teacherId, cadence: currentCadence, item_key: key, period_key: currentPeriodKey, completed })
          }).catch(console.error);
        });
      });
    }

    async function loadChecklist(cadence, periodKey) {
      document.getElementById('checklist-items').innerHTML =
        '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
      document.getElementById('progress-label').textContent = 'Loading…';
      document.getElementById('progress-bar').style.width = '0%';

      const url = `/api/admin/checklist?teacher_id=${encodeURIComponent(teacherId)}&cadence=${cadence}` +
                  (periodKey ? `&period_key=${encodeURIComponent(periodKey)}` : '');
      try {
        const data = await fetch(url).then(r => r.json());
        currentItems = data.items || [];
        currentPeriodKey = data.period_key || periodKey;
        renderItems();
        updateProgress();
      } catch (_) {
        document.getElementById('checklist-items').innerHTML =
          '<p class="text-danger text-center py-4">Failed to load checklist.</p>';
      }
    }

    async function switchCadence(cadence) {
      currentCadence = cadence;

      // Clear event notices
      document.getElementById('event-notice').classList.add('d-none');
      document.getElementById('no-event-notice').classList.add('d-none');

      let eventDate = null;
      let periodKey = null;

      if (cadence === 'quarterly') {
        eventDate = findEventDate(['End Q1', 'End Q3']);
        if (eventDate) {
          const evtD = new Date(eventDate.date + 'T00:00:00');
          const today = new Date(); today.setHours(0,0,0,0);
          const diff = Math.ceil((evtD - today) / 86400000);
          const notice = document.getElementById('event-notice');
          const txt = document.getElementById('event-notice-text');
          if (diff >= 0) txt.textContent = `Upcoming quarter end: ${eventDate.desc || eventDate.date} (${diff === 0 ? 'today' : `in ${diff} day${diff===1?'':'s'}`}).`;
          else txt.textContent = `Last quarter end was ${eventDate.date} (${eventDate.desc || ''}).`;
          notice.classList.remove('d-none');
        } else {
          const n = document.getElementById('no-event-notice');
          document.getElementById('no-event-text').textContent = 'No quarterly end date found in special-dates.csv.';
          n.classList.remove('d-none');
        }
        periodKey = getPeriodKey('quarterly', eventDate);
      } else if (cadence === 'semester') {
        eventDate = findEventDate(['End S1', 'Last Day of School']);
        if (eventDate) {
          const evtD = new Date(eventDate.date + 'T00:00:00');
          const today = new Date(); today.setHours(0,0,0,0);
          const diff = Math.ceil((evtD - today) / 86400000);
          const notice = document.getElementById('event-notice');
          const txt = document.getElementById('event-notice-text');
          if (diff >= 0) txt.textContent = `Upcoming semester end: ${eventDate.desc || eventDate.date} (${diff === 0 ? 'today' : `in ${diff} day${diff===1?'':'s'}`}).`;
          else txt.textContent = `Last semester end was ${eventDate.date} (${eventDate.desc || ''}).`;
          notice.classList.remove('d-none');
        } else {
          const n = document.getElementById('no-event-notice');
          document.getElementById('no-event-text').textContent = 'No semester end date found in special-dates.csv.';
          n.classList.remove('d-none');
        }
        periodKey = getPeriodKey('semester', eventDate);
      } else {
        periodKey = getPeriodKey(cadence);
      }

      const label = getPeriodLabel(cadence, periodKey || '', eventDate);
      document.getElementById('period-label').textContent = label;

      if (!periodKey) {
        document.getElementById('checklist-items').innerHTML =
          '<p class="text-muted text-center py-4">No event date found — checklist unavailable for this period.</p>';
        document.getElementById('progress-label').textContent = '0 of 0 done';
        document.getElementById('progress-bar').style.width = '0%';
        currentItems = [];
        currentPeriodKey = null;
        return;
      }

      await loadChecklist(cadence, periodKey);
    }

    // --- Mark all / Reset all ---
    document.getElementById('btn-mark-all').addEventListener('click', async () => {
      if (!currentPeriodKey) return;
      currentItems.forEach(i => i.completed = true);
      renderItems();
      updateProgress();
      for (const item of currentItems) {
        await fetch('/api/admin/checklist/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teacher_id: teacherId, cadence: currentCadence, item_key: item.key, period_key: currentPeriodKey, completed: true })
        }).catch(console.error);
      }
    });

    document.getElementById('btn-reset-all').addEventListener('click', async () => {
      if (!currentPeriodKey) return;
      if (!confirm('Reset all items for this period?')) return;
      await fetch('/api/admin/checklist/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teacher_id: teacherId, cadence: currentCadence, period_key: currentPeriodKey })
      }).catch(console.error);
      currentItems.forEach(i => i.completed = false);
      renderItems();
      updateProgress();
    });

    // --- Tab switching ---
    document.querySelectorAll('[data-cadence]').forEach(btn => {
      btn.addEventListener('click', () => switchCadence(btn.dataset.cadence));
    });

    // --- Init ---
    teacherId = getTeacherId();
    if (!teacherId) {
      document.getElementById('login-error').classList.remove('d-none');
      document.getElementById('checklist-items').innerHTML = '';
      document.getElementById('checklist-meta').classList.add('d-none');
      document.getElementById('checklist-tabs').classList.add('d-none');
      return;
    }

    try {
      const u = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('teacher-badge').textContent = `${u.username || teacherId}`;
    } catch (_) {}

    await loadSpecialDates();
    await switchCadence('daily');
  })();
  </script>
</body>
</html>

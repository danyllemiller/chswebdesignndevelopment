<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Classroom Tools | Random Name Picker</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=12"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .tools-card { max-width: 800px; margin: 2.5rem auto; }
    .name-chip {
      display: inline-flex; align-items: center; gap: .4rem;
      background: #eef0ff; border-radius: 999px; padding: .3rem .7rem; margin: .2rem;
      font-size: .85rem;
    }
    .name-chip.picked { background: #e9ecef; color: #adb5bd; text-decoration: line-through; }
    .name-chip i { cursor: pointer; color: #6c757d; }
    .name-chip i:hover { color: #dc3545; }
    .picker-display {
      background: #fff; border: 4px solid #000099; border-radius: 20px;
      min-height: 160px; display: flex; align-items: center; justify-content: center;
      font-size: 2.75rem; font-weight: 800; color: #000099; text-align: center; padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .picker-display.spinning { animation: pulse .1s ease infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container tools-card">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-shuffle me-2"></i>Random Name Picker</h2>
      <p class="text-muted mb-4">Loads the class roster automatically — edit the name list below before picking if you need to.</p>

      <div class="row g-3 mb-3">
        <div class="col-md-7">
          <label class="form-label fw-bold small mb-1">Class Period</label>
          <select id="periodSelect" class="form-select">
            <option value="">Loading roster…</option>
          </select>
        </div>
        <div class="col-md-5 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="noRepeat" checked>
            <label class="form-check-label" for="noRepeat">Don't repeat until everyone's picked</label>
          </div>
        </div>
      </div>

      <div id="pickerDisplay" class="picker-display">Pick a name to begin</div>
      <div class="d-flex gap-2 mb-4">
        <button id="pickBtn" class="btn btn-primary btn-lg flex-grow-1"><i class="fas fa-dice me-2"></i>Pick a Name</button>
        <button id="resetPickedBtn" class="btn btn-outline-secondary btn-lg">Reset</button>
      </div>

      <label class="form-label fw-bold small mb-1">Names in this class (edit freely — won't touch the real roster)</label>
      <div id="nameChips" class="border rounded p-2 mb-2" style="min-height:60px;"></div>
      <div class="d-flex gap-2">
        <input id="addNameInput" type="text" class="form-control" placeholder="Add a name and press Enter">
        <button id="resetRosterBtn" class="btn btn-outline-secondary">Reset to Roster</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const courseHint = params.get('course');
  const trackHint = params.get('track');
  const TRACK_PERIODS = { A: ['A3', 'A5'], B: ['B4', 'B6', 'B8'] };
  const COURSE_PERIOD = { wd1: 'A1', wd2: 'B2' };

  let periods = [];
  let currentNames = [];
  let pickedNames = new Set();

  function periodKey(period, courseName) { return `${period}|${courseName}`; }

  fetch('/api/admin/roster')
    .then(r => r.json())
    .then(rows => {
      const grouped = new Map();
      rows.forEach(s => {
        if (s.archived) return;
        const period = s.display_period || s.section_id;
        const courseName = s.display_course_name || '';
        if (!period || period === 'Teacher' || s.role === 'teacher') return;
        const key = periodKey(period, courseName);
        if (!grouped.has(key)) grouped.set(key, { period, courseName, names: [] });
        const name = `${s.first_name || ''} ${s.last_name || ''}`.trim() || s.student_id;
        grouped.get(key).names.push(name);
      });
      periods = Array.from(grouped.entries()).map(([key, v]) => ({
        key, label: `${v.period} — ${v.courseName}`, names: v.names.sort()
      })).sort((a, b) => a.label.localeCompare(b.label));

      const sel = document.getElementById('periodSelect');
      sel.innerHTML = '';
      periods.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.key;
        opt.textContent = `${p.label} (${p.names.length})`;
        sel.appendChild(opt);
      });

      let defaultKey = null;
      if (courseHint && COURSE_PERIOD[courseHint]) {
        const match = periods.find(p => p.period === COURSE_PERIOD[courseHint]);
        if (match) defaultKey = match.key;
      } else if (courseHint === 'cs_s1' && trackHint && TRACK_PERIODS[trackHint]) {
        const match = periods.find(p => TRACK_PERIODS[trackHint].includes(p.period));
        if (match) defaultKey = match.key;
      }
      if (defaultKey) sel.value = defaultKey;
      loadPeriod(sel.value);
    })
    .catch(() => {
      document.getElementById('periodSelect').innerHTML = '<option value="">Failed to load roster</option>';
    });

  function loadPeriod(key) {
    const p = periods.find(x => x.key === key);
    currentNames = p ? [...p.names] : [];
    pickedNames = new Set();
    renderChips();
  }

  function renderChips() {
    const wrap = document.getElementById('nameChips');
    wrap.innerHTML = '';
    currentNames.forEach((name, i) => {
      const chip = document.createElement('span');
      chip.className = 'name-chip' + (pickedNames.has(name) ? ' picked' : '');
      chip.appendChild(document.createTextNode(name + ' '));
      const removeIcon = document.createElement('i');
      removeIcon.className = 'fas fa-xmark';
      removeIcon.addEventListener('click', () => {
        currentNames.splice(i, 1);
        renderChips();
      });
      chip.appendChild(removeIcon);
      wrap.appendChild(chip);
    });
  }

  document.getElementById('periodSelect').addEventListener('change', (e) => loadPeriod(e.target.value));
  document.getElementById('resetRosterBtn').addEventListener('click', () => loadPeriod(document.getElementById('periodSelect').value));
  document.getElementById('addNameInput').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = e.target.value.trim();
    if (val) { currentNames.push(val); renderChips(); e.target.value = ''; }
  });

  document.getElementById('resetPickedBtn').addEventListener('click', () => {
    pickedNames = new Set();
    renderChips();
    document.getElementById('pickerDisplay').textContent = 'Pick a name to begin';
  });

  document.getElementById('pickBtn').addEventListener('click', () => {
    if (currentNames.length === 0) { alert('No names loaded.'); return; }
    const noRepeat = document.getElementById('noRepeat').checked;
    let pool = noRepeat ? currentNames.filter(n => !pickedNames.has(n)) : currentNames;
    if (pool.length === 0) {
      pickedNames = new Set();
      pool = currentNames;
    }
    const display = document.getElementById('pickerDisplay');
    display.classList.add('spinning');
    let ticks = 0;
    const spin = setInterval(() => {
      display.textContent = pool[Math.floor(Math.random() * pool.length)];
      ticks++;
      if (ticks > 12) {
        clearInterval(spin);
        display.classList.remove('spinning');
        const winner = pool[Math.floor(Math.random() * pool.length)];
        display.textContent = winner;
        if (noRepeat) pickedNames.add(winner);
        renderChips();
      }
    }, 80);
  });
</script>
</body>
</html>

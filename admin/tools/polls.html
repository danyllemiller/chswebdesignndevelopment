<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Classroom Tools | Polls</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=17"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .tools-card { max-width: 800px; margin: 2.5rem auto; }
    .poll-option {
      background: #fff; border: 2px solid #dee2e6; border-radius: 12px;
      padding: 1rem 1.25rem; margin-bottom: .75rem;
    }
    .poll-option.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
    .poll-option.clickable:hover { border-color: #000099; background: #f0f2ff; }
    .poll-option-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .poll-option-label { font-weight: 700; font-size: 1.05rem; }
    .poll-option-count { font-size: 1.5rem; font-weight: 800; color: #000099; min-width: 2.5rem; text-align: center; }
    .poll-bar-track { height: 10px; background: #e9ecef; border-radius: 6px; margin-top: .5rem; overflow: hidden; }
    .poll-bar-fill { height: 100%; background: #000099; transition: width .25s ease; }
    .setup-row { display: flex; gap: .5rem; margin-bottom: .5rem; }
    .broadcast-badge { font-size: .75rem; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container tools-card">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-square-poll-vertical me-2"></i>Polls</h2>
      <p class="text-muted mb-4">Either tap votes yourself as students raise their hands, or push the question straight to every student's screen in a period.</p>

      <div id="setupView">
        <label class="form-label fw-bold small">Question</label>
        <input id="questionInput" type="text" class="form-control mb-3" placeholder="e.g. Which topic should we review first?">
        <label class="form-label fw-bold small">Options (2-6)</label>
        <div id="optionRows"></div>
        <div class="d-flex gap-2 mb-3">
          <button id="addOptionBtn" class="btn btn-outline-secondary btn-sm"><i class="fas fa-plus me-1"></i>Add Option</button>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="broadcastToggle" checked>
          <label class="form-check-label fw-bold" for="broadcastToggle">Push to students' screens</label>
        </div>
        <div id="periodRow" class="mb-3">
          <label class="form-label fw-bold small mb-1">Class Period</label>
          <select id="periodSelect" class="form-select">
            <option value="">Loading periods…</option>
          </select>
        </div>

        <button id="startPollBtn" class="btn btn-primary btn-lg w-100"><i class="fas fa-play me-2"></i>Start Poll</button>
      </div>

      <div id="pollView" class="d-none">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h4 id="pollQuestion" class="mb-1"></h4>
            <span id="broadcastBadge" class="badge bg-success broadcast-badge d-none"><i class="fas fa-tower-broadcast me-1"></i>Live on student screens</span>
          </div>
          <div class="d-flex gap-2">
            <button id="endPollBtn" class="btn btn-outline-danger btn-sm d-none"><i class="fas fa-stop me-1"></i>End Poll</button>
            <button id="newPollBtn" class="btn btn-outline-secondary btn-sm"><i class="fas fa-rotate-left me-1"></i>New Poll</button>
          </div>
        </div>
        <div id="pollOptions"></div>
        <p class="text-muted small mt-2">Total votes: <span id="totalVotes">0</span></p>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script>
  const optionRows = document.getElementById('optionRows');
  const COLORS = ['#000099', '#198754', '#dc3545', '#fd7e14', '#6f42c1', '#0dcaf0'];

  function addOptionRow(value = '') {
    if (optionRows.children.length >= 6) return;
    const row = document.createElement('div');
    row.className = 'setup-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'form-control option-input';
    input.placeholder = `Option ${optionRows.children.length + 1}`;
    input.value = value;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn btn-outline-danger';
    removeBtn.innerHTML = '<i class="fas fa-xmark"></i>';
    removeBtn.addEventListener('click', () => {
      if (optionRows.children.length <= 2) return;
      row.remove();
    });
    row.append(input, removeBtn);
    optionRows.appendChild(row);
  }
  addOptionRow(); addOptionRow();
  document.getElementById('addOptionBtn').addEventListener('click', () => addOptionRow());

  // ── Class period list (for broadcast mode) ──────────────────────────────
  fetch('/api/admin/sections')
    .then(r => r.json())
    .then(rows => {
      const sel = document.getElementById('periodSelect');
      sel.innerHTML = '';
      rows.filter(s => s.section_id && s.section_id !== 'Teacher').forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.section_id;
        opt.textContent = `${s.section_id} — ${s.course_name || ''}`;
        sel.appendChild(opt);
      });
    })
    .catch(() => {
      document.getElementById('periodSelect').innerHTML = '<option value="">Failed to load periods</option>';
    });

  document.getElementById('broadcastToggle').addEventListener('change', (e) => {
    document.getElementById('periodRow').classList.toggle('d-none', !e.target.checked);
  });

  // ── Poll state ───────────────────────────────────────────────────────────
  let poll = null;          // local-only mode: { question, options: [{label, votes}] }
  let broadcastPollId = null;
  let resultsInterval = null;

  document.getElementById('startPollBtn').addEventListener('click', async () => {
    const question = document.getElementById('questionInput').value.trim() || 'Poll';
    const options = Array.from(optionRows.querySelectorAll('.option-input'))
      .map(i => i.value.trim())
      .filter(Boolean);
    if (options.length < 2) { alert('Add at least 2 options.'); return; }

    const broadcast = document.getElementById('broadcastToggle').checked;
    if (broadcast) {
      const sectionId = document.getElementById('periodSelect').value;
      if (!sectionId) { alert('Pick a class period to push this poll to.'); return; }
      try {
        const res = await fetch('/api/admin/polls/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, options, section_id: sectionId })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Failed to start poll');
        broadcastPollId = data.id;
        poll = null;
        document.getElementById('pollQuestion').textContent = question;
        document.getElementById('broadcastBadge').classList.remove('d-none');
        document.getElementById('endPollBtn').classList.remove('d-none');
        document.getElementById('setupView').classList.add('d-none');
        document.getElementById('pollView').classList.remove('d-none');
        startResultsPolling();
      } catch (e) {
        alert('Failed to start poll: ' + e.message);
      }
    } else {
      broadcastPollId = null;
      poll = { question, options: options.map(label => ({ label, votes: 0 })) };
      document.getElementById('pollQuestion').textContent = poll.question;
      document.getElementById('broadcastBadge').classList.add('d-none');
      document.getElementById('endPollBtn').classList.add('d-none');
      document.getElementById('setupView').classList.add('d-none');
      document.getElementById('pollView').classList.remove('d-none');
      renderLocalPoll();
    }
  });

  function renderLocalPoll() {
    const wrap = document.getElementById('pollOptions');
    wrap.innerHTML = '';
    const total = poll.options.reduce((s, o) => s + o.votes, 0);
    document.getElementById('totalVotes').textContent = total;

    poll.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'poll-option clickable';
      const pct = total > 0 ? Math.round((opt.votes / total) * 100) : 0;
      const row = document.createElement('div');
      row.className = 'poll-option-row';
      const labelSpan = document.createElement('span');
      labelSpan.className = 'poll-option-label';
      labelSpan.textContent = opt.label;
      const countSpan = document.createElement('span');
      countSpan.className = 'poll-option-count';
      countSpan.textContent = opt.votes;
      row.append(labelSpan, countSpan);

      const track = document.createElement('div');
      track.className = 'poll-bar-track';
      const fill = document.createElement('div');
      fill.className = 'poll-bar-fill';
      fill.style.width = pct + '%';
      fill.style.background = COLORS[i % COLORS.length];
      track.appendChild(fill);

      div.append(row, track);
      div.addEventListener('click', () => { opt.votes++; renderLocalPoll(); });
      wrap.appendChild(div);
    });
  }

  function renderBroadcastResults(question, options, counts, total) {
    document.getElementById('pollQuestion').textContent = question;
    document.getElementById('totalVotes').textContent = total;
    const wrap = document.getElementById('pollOptions');
    wrap.innerHTML = '';
    options.forEach((label, i) => {
      const votes = counts[i] || 0;
      const pct = total > 0 ? Math.round((votes / total) * 100) : 0;
      const div = document.createElement('div');
      div.className = 'poll-option';
      const row = document.createElement('div');
      row.className = 'poll-option-row';
      const labelSpan = document.createElement('span');
      labelSpan.className = 'poll-option-label';
      labelSpan.textContent = label;
      const countSpan = document.createElement('span');
      countSpan.className = 'poll-option-count';
      countSpan.textContent = votes;
      row.append(labelSpan, countSpan);

      const track = document.createElement('div');
      track.className = 'poll-bar-track';
      const fill = document.createElement('div');
      fill.className = 'poll-bar-fill';
      fill.style.width = pct + '%';
      fill.style.background = COLORS[i % COLORS.length];
      track.appendChild(fill);

      div.append(row, track);
      wrap.appendChild(div);
    });
  }

  function startResultsPolling() {
    if (resultsInterval) clearInterval(resultsInterval);
    const fetchResults = async () => {
      if (!broadcastPollId) return;
      try {
        const res = await fetch(`/api/admin/polls/results?id=${broadcastPollId}`);
        const data = await res.json();
        if (data.poll) renderBroadcastResults(data.poll.question, data.poll.options, data.counts, data.total);
      } catch (e) {}
    };
    fetchResults();
    resultsInterval = setInterval(fetchResults, 3000);
  }

  document.getElementById('endPollBtn').addEventListener('click', async () => {
    if (!broadcastPollId) return;
    try {
      await fetch('/api/admin/polls/close', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: broadcastPollId })
      });
    } catch (e) {}
    document.getElementById('broadcastBadge').classList.add('d-none');
    document.getElementById('endPollBtn').classList.add('d-none');
    if (resultsInterval) clearInterval(resultsInterval);
  });

  document.getElementById('newPollBtn').addEventListener('click', async () => {
    if (broadcastPollId) {
      try {
        await fetch('/api/admin/polls/close', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: broadcastPollId })
        });
      } catch (e) {}
    }
    if (resultsInterval) clearInterval(resultsInterval);
    broadcastPollId = null;
    poll = null;
    document.getElementById('pollView').classList.add('d-none');
    document.getElementById('setupView').classList.remove('d-none');
  });
</script>
</body>
</html>

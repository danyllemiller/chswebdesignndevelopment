<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphone Checkout | Teacher Tools</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <link href="/css/dacStyleSheets.css" rel="stylesheet">
  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script src="/js/loader.js?v=24"></script>
  <script type="module" src="/js/auth-guard.js?v=1"></script>
  <style>
    body { background: #111827; min-height: 100vh; }
    .kiosk-wrap { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .kiosk-card { background: #fff; border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0,0,0,.35); overflow: hidden; }
    .kiosk-header { background: #6f42c1; color: #fff; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; }
    .scan-body { padding: 2.25rem 1.5rem 1.5rem; text-align: center; }
    #scanInput { font-size: 1.4rem; text-align: center; letter-spacing: .05em; padding: .9rem; border-radius: .6rem; border: 3px solid #6f42c1; }
    #scanInput:focus { box-shadow: 0 0 0 .25rem rgba(111,66,193,.25); }
    .feedback-panel { margin-top: 1.5rem; border-radius: .8rem; padding: 1.25rem; display: none; }
    .feedback-panel.out { background: #d1f2e0; border: 3px solid #198754; }
    .feedback-panel.back { background: #dbeafe; border: 3px solid #0d6efd; }
    .feedback-panel.error { background: #fde0de; border: 3px solid #dc3545; }
    .feedback-icon { font-size: 2.6rem; }
    .feedback-name { font-size: 1.5rem; font-weight: 800; margin: .25rem 0; }
    .feedback-sub { font-size: 1.05rem; font-weight: 600; }
    .step-panel { max-width: 460px; background: #6f42c1; color: #fff; font-size: 1.3rem; font-weight: 800; border-radius: .8rem; padding: .8rem 1rem; }
    .out-row.overdue td { background: #fde0de !important; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="kiosk-wrap">
  <div class="kiosk-card">
    <div class="kiosk-header">
      <div>
        <div class="small opacity-75 fw-bold text-uppercase">Check Out / Return</div>
        <div class="fs-4 fw-bold"><i class="fas fa-headphones me-2"></i>Headphones</div>
      </div>
      <div class="text-end">
        <div class="fs-5 fw-bold"><span id="outCount">0</span> checked out</div>
        <a href="/admin/tools/headphone-labels.html" class="small text-white fw-bold"><i class="fas fa-barcode me-1"></i>Print headphone labels</a>
      </div>
    </div>

    <div class="scan-body">
      <div id="stepPanel" class="step-panel d-none mx-auto mb-3">
        <i class="fas fa-headphones me-2"></i><span id="stepText"></span>
        <button id="cancelStep" type="button" class="btn btn-sm btn-light fw-bold ms-3">Cancel</button>
      </div>
      <h4 class="fw-bold mb-1" id="promptTitle">Scan the Headphones</h4>
      <p class="text-muted mb-3" id="promptSub"></p>
      <input type="text" id="scanInput" class="form-control mx-auto" style="max-width: 420px;" autocomplete="off" placeholder="Waiting for scan…" autofocus>
      <div id="feedbackPanel" class="feedback-panel mx-auto" style="max-width: 460px;">
        <div class="feedback-icon" id="feedbackIcon"></div>
        <div class="feedback-name" id="feedbackName"></div>
        <div class="feedback-sub" id="feedbackSub"></div>
      </div>

      <button id="noIdToggle" class="btn btn-link btn-sm mt-3 fw-bold text-decoration-none"><i class="fas fa-magnifying-glass me-1"></i>No ID? Click your name instead (scan the headphones first)</button>
      <div id="noIdPanel" class="d-none mt-2 text-start mx-auto" style="max-width: 420px;">
        <input type="text" id="nameSearch" class="form-control mb-2" placeholder="Type to search names…">
        <div id="nameList" class="list-group" style="max-height: 260px; overflow-y: auto;"></div>
      </div>
    </div>

    <div class="border-top">
      <div class="px-3 pt-3 d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0"><i class="fas fa-list me-1"></i>Who has headphones right now</h6>
        <span class="small text-muted"><span class="badge bg-danger">red</span> = not returned from an earlier day</span>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0 mt-2">
          <thead class="table-light"><tr><th class="ps-3">#</th><th>Student</th><th>Period</th><th>Checked out</th><th class="text-end pe-3"></th></tr></thead>
          <tbody id="outBody"><tr><td colspan="5" class="text-center text-muted py-3">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<script type="module" src="/js/admin/headphone-checkout.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Print Paystubs | CHS Admin</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css" rel="stylesheet"/>
  <link href="/css/dacPrint.css" media="print" rel="stylesheet"/>
  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script src="/js/loader.js?v=19"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { background: #f4f6fb; }
    .paystub-doc {
      font-family: 'Courier New', Courier, monospace;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #000;
      max-width: 680px;
      margin: 0 auto 2rem;
    }
    .paystub-doc .stub-header { border-bottom: 2px solid #222; padding: 1rem 1.5rem; }
    .paystub-doc .stub-body   { padding: 1.25rem 1.5rem; }
    .paystub-doc table { width: 100%; font-size: .85rem; }
    .paystub-doc table th { border-bottom: 1px solid #222; padding-bottom: .25rem; }
    .paystub-doc table td { padding: .2rem 0; }

    /* Detachable "check" portion -- deliberately a different (serif, not
       monospace) feel from the earnings statement above it, like a real
       paycheck's check stub vs. the check itself. */
    /* Fixed height, not auto -- so every check in a printed stack is
       identical regardless of a student's name length or dollar amount,
       which is what actually makes a paper-cutter/perforation pass line
       up across every page. box-sizing so padding/border count inside
       that height instead of adding to it. */
    .fake-check {
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 680px;
      height: 2.75in;
      box-sizing: border-box;
      overflow: hidden;
      margin: 0 auto;
      border: 2px solid #1a3a1a;
      border-radius: 4px;
      padding: 1.1rem 1.4rem;
      color: #1a1a1a;
      background:
        repeating-linear-gradient(135deg, rgba(26,58,26,.05) 0 2px, transparent 2px 14px),
        #f7faf5;
    }
    .check-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #1a3a1a; padding-bottom: .5rem; margin-bottom: .7rem; }
    .check-bank-name { font-weight: 700; font-size: 1rem; }
    .check-fake-tag { font-size: .65rem; font-style: italic; font-weight: 400; color: #6b6b6b; }
    .check-bank-addr { font-size: .7rem; color: #444; }
    .check-number, .check-date { font-size: .8rem; font-weight: 700; }
    .check-payline { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .6rem; }
    .check-label { font-size: .7rem; font-weight: 700; white-space: nowrap; }
    /* Both of these carry variable-length content (student name, spelled-
       out dollar amount) -- locked to one line so an unusually long one
       never wraps and grows the check's height on just that page. */
    .check-payee { flex: 1; min-width: 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .check-amount-box { white-space: nowrap; border: 1.5px solid #1a1a1a; border-radius: 3px; padding: .2rem .6rem; font-weight: 700; font-family: 'Courier New', monospace; }
    .check-words { border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; margin-bottom: .8rem; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .check-words span::after { content: ' ***************************'; color: #9aa89a; letter-spacing: 1px; }
    .check-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: .7rem; }
    .check-memo { font-size: .7rem; color: #444; font-style: italic; }
    .check-signature { text-align: center; }
    .sig-line { width: 190px; border-bottom: 1px solid #1a1a1a; height: 1.6rem; font-family: 'Brush Script MT', cursive; }
    .sig-label { font-size: .6rem; color: #444; }
    .check-micr { text-align: center; font-family: 'Courier New', monospace; letter-spacing: .25em; font-size: .95rem; color: #333; margin-bottom: .5rem; }
    .check-disclaimer { text-align: center; font-size: .6rem; font-weight: 700; color: #8a1f1f; letter-spacing: .03em; }

    .missing-block { max-width: 680px; margin: 1rem auto 0; border: 2px solid #dc3545; border-radius: 4px; padding: .6rem .9rem; background: #fff; }

    .stub-sheet:not(:last-child) { page-break-after: always; }

    /* Check and earnings statement are fixed-height and must always land
       on the same page together -- only MISSING ASSIGNMENTS can grow
       unbounded, so it's the one block allowed to spill onto its own next
       page instead of dragging the check down with it. */
    .fake-check, .paystub-doc { page-break-inside: avoid; }

    @media print {
      /* Tight margins on purpose -- these get printed, cut apart on a
         paper cutter, and the check portion perforated to look real, so
         consistent close-to-full-bleed margins matter more than they
         would for an on-screen document. */
      @page { margin: 0.25in; }
      .no-print { display: none !important; }
      /* The sitewide /css/dacPrint.css (loaded above) sets body { margin:
         .5in; width: 90%; } for every printed page on the site. Same bug
         as section.container below: a margin/width on <body> is a single
         box applied once at the very start of the printed flow -- it does
         NOT repeat on each new page the way an @page margin does. Page 1
         got dacPrint.css's extra .5in on top of ours, every page after it
         didn't, which is exactly why only the first check looked right.
         Override both properties here so nothing but our own @page margin
         is ever in play. */
      body { background: #fff; margin: 0 !important; width: 100% !important; padding: 0 !important; }
      /* section.container's own my-5 (3rem) top margin has the identical
         problem -- zero it out too so every page starts from the same
         @page margin with nothing else added on top. */
      section.container { margin: 0 !important; padding: 0 !important; max-width: none !important; }
      #stubsContainer { margin: 0 !important; }
      .paystub-doc { border-color: #000 !important; margin-bottom: 0; }
      .fake-check { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div class="container-fluid sticky-top px-0 no-print">
  <div id="nav-placeholder"></div>
</div>

<section class="container my-5">
  <div class="d-flex align-items-center mb-4 no-print">
    <div>
      <h1 class="gochi text-primary mb-0"><i class="fas fa-print me-2"></i>Print Paystubs</h1>
      <p class="text-muted mb-0" id="subtitleLine">Loading run…</p>
    </div>
    <div class="ms-auto">
      <a href="/admin/run-payroll.html" class="btn btn-outline-secondary btn-sm fw-bold me-2"><i class="fas fa-arrow-left me-1"></i>Back</a>
      <button class="btn btn-primary btn-sm fw-bold" onclick="window.print()"><i class="fas fa-print me-1"></i>Print All</button>
    </div>
  </div>

  <div id="stubsContainer">
    <div class="text-center text-muted py-5 no-print">
      <div class="spinner-border text-primary mb-3"></div>
      <p>Loading paystubs…</p>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script type="module">
import { apiFetch } from '/js/modules/api-client.js';
import { renderPaystubHtml } from '/js/modules/paystub-template.js?v=2';

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

const runId = new URLSearchParams(location.search).get('run');

async function init() {
  if (!runId) {
    document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-danger no-print">No run specified. Go back and pick a run to print.</div>`;
    return;
  }
  try {
    const detail = await apiFetch(`/api/admin/payroll/run-detail/${encodeURIComponent(runId)}`);
    const stubs = detail.stubs || [];
    if (stubs.length === 0) {
      document.getElementById('subtitleLine').textContent = 'Run #' + runId;
      document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-warning no-print">No paystubs in this run.</div>`;
      return;
    }
    document.getElementById('subtitleLine').textContent =
      `${stubs.length} paystub${stubs.length !== 1 ? 's' : ''} · ${fmtDate(stubs[0].period_start)} – ${fmtDate(stubs[0].period_end)}`;

    let missing = {};
    try {
      const studentIds = [...new Set(stubs.map(s => s.student_id))].join(',');
      const missingData = await apiFetch(`/api/admin/payroll/missing-assignments?student_ids=${encodeURIComponent(studentIds)}`);
      missing = missingData.missing || {};
    } catch { /* print still works without the missing-assignments block */ }

    document.getElementById('stubsContainer').innerHTML = stubs
      .map(s => `<div class="stub-sheet">${renderPaystubHtml(s, missing[s.student_id] || [])}</div>`)
      .join('');
  } catch (e) {
    document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-danger no-print">Could not load this payroll run.</div>`;
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

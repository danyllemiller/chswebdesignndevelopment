<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Print Paystubs | CHS Admin</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css" rel="stylesheet"/>
  <link href="/css/dacPrint.css" media="print" rel="stylesheet"/>
  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script src="/js/loader.js?v=19"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { background: #f4f6fb; }
    .paystub-doc {
      font-family: 'Courier New', Courier, monospace;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #000;
      max-width: 680px;
      margin: 0 auto 2rem;
    }
    .paystub-doc .stub-header { border-bottom: 2px solid #222; padding: 1rem 1.5rem; }
    .paystub-doc .stub-body   { padding: 1.25rem 1.5rem; }
    .paystub-doc table { width: 100%; font-size: .85rem; }
    .paystub-doc table th { border-bottom: 1px solid #222; padding-bottom: .25rem; }
    .paystub-doc table td { padding: .2rem 0; }

    .stub-sheet:not(:last-child) { page-break-after: always; }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .paystub-doc { border-color: #000 !important; margin-bottom: 0; }
    }
  </style>
</head>
<body>

<div class="container-fluid sticky-top px-0 no-print">
  <div id="nav-placeholder"></div>
</div>

<section class="container my-5">
  <div class="d-flex align-items-center mb-4 no-print">
    <div>
      <h1 class="gochi text-primary mb-0"><i class="fas fa-print me-2"></i>Print Paystubs</h1>
      <p class="text-muted mb-0" id="subtitleLine">Loading run…</p>
    </div>
    <div class="ms-auto">
      <a href="/admin/run-payroll.html" class="btn btn-outline-secondary btn-sm fw-bold me-2"><i class="fas fa-arrow-left me-1"></i>Back</a>
      <button class="btn btn-primary btn-sm fw-bold" onclick="window.print()"><i class="fas fa-print me-1"></i>Print All</button>
    </div>
  </div>

  <div id="stubsContainer">
    <div class="text-center text-muted py-5 no-print">
      <div class="spinner-border text-primary mb-3"></div>
      <p>Loading paystubs…</p>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script type="module">
import { apiFetch } from '/js/modules/api-client.js';
import { renderPaystubHtml } from '/js/modules/paystub-template.js';

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

const runId = new URLSearchParams(location.search).get('run');

async function init() {
  if (!runId) {
    document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-danger no-print">No run specified. Go back and pick a run to print.</div>`;
    return;
  }
  try {
    const detail = await apiFetch(`/api/admin/payroll/run-detail/${encodeURIComponent(runId)}`);
    const stubs = detail.stubs || [];
    if (stubs.length === 0) {
      document.getElementById('subtitleLine').textContent = 'Run #' + runId;
      document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-warning no-print">No paystubs in this run.</div>`;
      return;
    }
    document.getElementById('subtitleLine').textContent =
      `${stubs.length} paystub${stubs.length !== 1 ? 's' : ''} · ${fmtDate(stubs[0].period_start)} – ${fmtDate(stubs[0].period_end)}`;

    let missing = {};
    try {
      const studentIds = [...new Set(stubs.map(s => s.student_id))].join(',');
      const missingData = await apiFetch(`/api/admin/payroll/missing-assignments?student_ids=${encodeURIComponent(studentIds)}`);
      missing = missingData.missing || {};
    } catch { /* print still works without the missing-assignments block */ }

    document.getElementById('stubsContainer').innerHTML = stubs
      .map(s => `<div class="stub-sheet">${renderPaystubHtml(s, missing[s.student_id] || [])}</div>`)
      .join('');
  } catch (e) {
    document.getElementById('stubsContainer').innerHTML = `<div class="alert alert-danger no-print">Could not load this payroll run.</div>`;
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

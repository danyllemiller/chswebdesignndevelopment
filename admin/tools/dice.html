<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Classroom Tools | Dice</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=14"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .tools-card { max-width: 760px; margin: 2.5rem auto; }
    .die-row {
      display: flex; align-items: center; gap: .5rem;
      background: #f8f9fb; border: 1px solid #e2e5ec; border-radius: 10px;
      padding: .5rem .6rem; margin-bottom: .5rem;
    }
    .die-row .die-index { font-weight: 700; color: #000099; min-width: 1.6rem; }
    .die-row select { max-width: 140px; }
    .die-row .remove-die { margin-left: auto; color: #adb5bd; cursor: pointer; }
    .die-row .remove-die:hover { color: #dc3545; }
    .die-face {
      width: 100px; height: 100px;
      border-radius: 16px;
      background: #fff;
      border: 3px solid #000099;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: 800; color: #000099;
      box-shadow: 0 4px 10px rgba(0,0,153,.15);
    }
    .die-face .die-sides-label { font-size: .65rem; font-weight: 700; color: #6c757d; margin-top: -.2rem; }
    .die-face.rolling { animation: spin .5s ease; }
    @keyframes spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(200deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .dice-tray { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; min-height: 120px; }
    .total-badge { font-size: 1.4rem; font-weight: 700; color: #000099; }
    .history-item { font-size: .85rem; color: #6c757d; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container tools-card">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-dice me-2"></i>Dice</h2>
      <p class="text-muted mb-4">Set up each die's own number of sides, then roll them all at once.</p>

      <div id="dieRows" class="mb-2"></div>
      <div class="d-flex gap-2 mb-4">
        <button id="addDieBtn" class="btn btn-outline-primary btn-sm"><i class="fas fa-plus me-1"></i>Add Die</button>
        <button id="rollBtn" class="btn btn-primary btn-lg ms-auto"><i class="fas fa-dice me-2"></i>Roll</button>
        <button id="clearBtn" class="btn btn-outline-secondary">Clear Results</button>
      </div>

      <div id="diceTray" class="dice-tray mb-3"></div>
      <div class="text-center mb-4">
        <span id="totalBadge" class="total-badge d-none"></span>
      </div>

      <h6 class="text-muted">Roll History</h6>
      <ul id="historyList" class="list-unstyled mb-0"></ul>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script>
  const SIDE_OPTIONS = [4, 6, 8, 10, 12, 20];
  const MAX_DICE = 10;
  const dieRowsWrap = document.getElementById('dieRows');
  const tray = document.getElementById('diceTray');
  const totalBadge = document.getElementById('totalBadge');
  const historyList = document.getElementById('historyList');
  const history = [];

  let dice = [{ sides: 6 }, { sides: 6 }];

  function renderDieRows() {
    dieRowsWrap.innerHTML = '';
    dice.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'die-row';

      const idx = document.createElement('span');
      idx.className = 'die-index';
      idx.textContent = `#${i + 1}`;

      const select = document.createElement('select');
      select.className = 'form-select form-select-sm';
      SIDE_OPTIONS.forEach(sides => {
        const opt = document.createElement('option');
        opt.value = sides;
        opt.textContent = `d${sides}`;
        if (sides === d.sides) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => { d.sides = parseInt(select.value, 10); });

      const removeIcon = document.createElement('i');
      removeIcon.className = 'fas fa-xmark remove-die';
      removeIcon.title = 'Remove this die';
      removeIcon.addEventListener('click', () => {
        if (dice.length <= 1) return;
        dice.splice(i, 1);
        renderDieRows();
      });

      row.append(idx, select, removeIcon);
      dieRowsWrap.appendChild(row);
    });
  }

  document.getElementById('addDieBtn').addEventListener('click', () => {
    if (dice.length >= MAX_DICE) return;
    dice.push({ sides: 6 });
    renderDieRows();
  });

  function roll() {
    tray.innerHTML = '';
    const results = [];
    dice.forEach(d => {
      const value = 1 + Math.floor(Math.random() * d.sides);
      results.push({ sides: d.sides, value });
      const die = document.createElement('div');
      die.className = 'die-face rolling';
      const valueSpan = document.createElement('span');
      valueSpan.textContent = value;
      const sidesLabel = document.createElement('span');
      sidesLabel.className = 'die-sides-label';
      sidesLabel.textContent = `d${d.sides}`;
      die.append(valueSpan, sidesLabel);
      tray.appendChild(die);
    });

    if (results.length > 1) {
      const sum = results.reduce((a, b) => a + b.value, 0);
      totalBadge.textContent = `Total: ${sum}`;
      totalBadge.classList.remove('d-none');
    } else {
      totalBadge.classList.add('d-none');
    }

    history.unshift({ results, time: new Date().toLocaleTimeString() });
    history.splice(8);
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    history.forEach(h => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.textContent = `${h.time} — ${h.results.map(r => `d${r.sides}: ${r.value}`).join(', ')}`;
      historyList.appendChild(li);
    });
  }

  document.getElementById('rollBtn').addEventListener('click', roll);
  document.getElementById('clearBtn').addEventListener('click', () => {
    tray.innerHTML = '';
    totalBadge.classList.add('d-none');
    history.length = 0;
    renderHistory();
  });

  renderDieRows();
</script>
</body>
</html>

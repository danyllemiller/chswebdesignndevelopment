<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Classroom Tools | Dice</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=6"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .tools-card { max-width: 720px; margin: 2.5rem auto; }
    .die-face {
      width: 110px; height: 110px;
      border-radius: 16px;
      background: #fff;
      border: 3px solid #000099;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.6rem; font-weight: 800; color: #000099;
      box-shadow: 0 4px 10px rgba(0,0,153,.15);
      transition: transform .15s ease;
    }
    .die-face.rolling { animation: spin .5s ease; }
    @keyframes spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(200deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .dice-tray { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; min-height: 130px; }
    .total-badge { font-size: 1.4rem; font-weight: 700; color: #000099; }
    .history-item { font-size: .85rem; color: #6c757d; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container tools-card">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-dice me-2"></i>Dice</h2>
      <p class="text-muted mb-4">Roll dice for randomization, warm-ups, or games.</p>

      <div class="d-flex flex-wrap gap-3 align-items-end mb-4">
        <div>
          <label class="form-label fw-bold small mb-1">Die type</label>
          <select id="dieType" class="form-select">
            <option value="4">d4</option>
            <option value="6" selected>d6</option>
            <option value="8">d8</option>
            <option value="10">d10</option>
            <option value="12">d12</option>
            <option value="20">d20</option>
          </select>
        </div>
        <div>
          <label class="form-label fw-bold small mb-1">Number of dice</label>
          <input id="dieCount" type="number" min="1" max="10" value="2" class="form-control" style="width:90px">
        </div>
        <button id="rollBtn" class="btn btn-primary btn-lg"><i class="fas fa-dice me-2"></i>Roll</button>
        <button id="clearBtn" class="btn btn-outline-secondary">Clear</button>
      </div>

      <div id="diceTray" class="dice-tray mb-3"></div>
      <div class="text-center mb-4">
        <span id="totalBadge" class="total-badge d-none"></span>
      </div>

      <h6 class="text-muted">Roll History</h6>
      <ul id="historyList" class="list-unstyled mb-0"></ul>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script>
  const tray = document.getElementById('diceTray');
  const totalBadge = document.getElementById('totalBadge');
  const historyList = document.getElementById('historyList');
  const history = [];

  function roll() {
    const sides = parseInt(document.getElementById('dieType').value, 10);
    const count = Math.min(10, Math.max(1, parseInt(document.getElementById('dieCount').value, 10) || 1));
    tray.innerHTML = '';
    const results = [];
    for (let i = 0; i < count; i++) {
      const value = 1 + Math.floor(Math.random() * sides);
      results.push(value);
      const die = document.createElement('div');
      die.className = 'die-face rolling';
      die.textContent = value;
      tray.appendChild(die);
    }
    if (count > 1) {
      const sum = results.reduce((a, b) => a + b, 0);
      totalBadge.textContent = `Total: ${sum}`;
      totalBadge.classList.remove('d-none');
    } else {
      totalBadge.classList.add('d-none');
    }
    history.unshift({ sides, results, time: new Date().toLocaleTimeString() });
    history.splice(8);
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    history.forEach(h => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.textContent = `${h.time} — d${h.sides} × ${h.results.length}: ${h.results.join(', ')}`;
      historyList.appendChild(li);
    });
  }

  document.getElementById('rollBtn').addEventListener('click', roll);
  document.getElementById('clearBtn').addEventListener('click', () => {
    tray.innerHTML = '';
    totalBadge.classList.add('d-none');
    history.length = 0;
    renderHistory();
  });
</script>
</body>
</html>

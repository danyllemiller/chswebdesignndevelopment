<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Admin | Agency Job Applications</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <script src="/js/loader.js?v=20"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fb; }
    .apps-card { max-width: 1100px; margin: 2.5rem auto; }
    .app-row { cursor: pointer; }
    .app-row:hover { background: #f1f3f9; }
    .role-badge { font-size: .75rem; }
    .answer-block { border-left: 3px solid #0d6efd; padding: .5rem .9rem; margin-bottom: 1rem; background: #f8f9fb; border-radius: .25rem; }
    .answer-q { font-weight: 700; font-size: .85rem; color: #333; margin-bottom: .25rem; }
    .answer-a { white-space: pre-wrap; font-size: .9rem; }
    .no-apps { color: #adb5bd; font-style: italic; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container apps-card">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-4">
      <h2 class="gochi text-primary mb-1"><i class="fas fa-file-signature me-2"></i>Agency Job Applications</h2>
      <p class="text-muted mb-0">Every application submitted through the Agency Application form, newest first. Click a row to read the full answers.</p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Student</th>
              <th>Period</th>
              <th>Role Applied For</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="appsBody">
            <tr><td colspan="4" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="appDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="appDetailTitle">Application</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="appDetailBody"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="/js/bootstrap.bundle.js"></script>
<script type="module" src="/js/admin/job-applications.js?v=1"></script>
</body>
</html>

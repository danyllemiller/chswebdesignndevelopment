<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Attendance Scan Station | CHS Admin</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">

  <link href="/css/dacStyleSheets.css?v=1.2" rel="stylesheet"/>

  <script src="/js/loader.js?v=21"></script>
  <script type="module" src="/js/auth-guard.js?v=1"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #111827; min-height: 100vh; }
    .kiosk-wrap { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .kiosk-card { background: #fff; border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0,0,0,.35); overflow: hidden; }
    .kiosk-header { background: #0d6efd; color: #fff; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; }
    .kiosk-header select { max-width: 220px; }
    .tally { display: flex; gap: 1rem; padding: .75rem 1.5rem; background: #f4f6fb; border-bottom: 1px solid #e6e8ee; font-weight: 700; font-size: .9rem; }
    .tally span.count { font-size: 1.15rem; margin-right: .3rem; }
    .scan-body { padding: 2.5rem 1.5rem; text-align: center; }
    #scanInput { font-size: 1.4rem; text-align: center; letter-spacing: .05em; padding: .9rem; border-radius: .6rem; border: 3px solid #0d6efd; }
    #scanInput:focus { box-shadow: 0 0 0 .25rem rgba(13,110,253,.25); }
    .feedback-panel { margin-top: 1.75rem; min-height: 180px; border-radius: .8rem; padding: 1.5rem; display: none; }
    .feedback-panel.present { background: #d1f2e0; border: 3px solid #198754; }
    .feedback-panel.tardy { background: #fff3cd; border: 3px solid #e8a500; }
    .feedback-panel.error { background: #fde0de; border: 3px solid #dc3545; }
    .feedback-panel.already { background: #e9ecef; border: 3px solid #6c757d; }
    .feedback-icon { font-size: 3rem; }
    .feedback-name { font-size: 1.6rem; font-weight: 800; margin: .3rem 0; }
    .feedback-sub { font-size: 1.05rem; font-weight: 600; }
    .tardy-link-box { margin-top: .75rem; background: #fff; border-radius: .5rem; padding: .6rem 1rem; font-size: 1.1rem; font-weight: 700; color: #0d6efd; word-break: break-all; }
    .name-btn { border-radius: 2rem; border: 2px solid #dee2e6; background: #fff; padding: .45rem 1rem; font-weight: 700; font-size: .95rem; }
    .name-btn:hover { border-color: #0d6efd; }
    .name-btn.marked-present { border-color: #198754; color: #198754; }
    .name-btn.marked-tardy { border-color: #e8a500; color: #b8860b; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="kiosk-wrap">
  <div class="kiosk-card">
    <div class="kiosk-header">
      <div>
        <div class="small opacity-75 fw-bold text-uppercase">Taking Attendance</div>
        <div class="fs-4 fw-bold" id="periodLabel">Loading…</div>
      </div>
      <div>
        <label class="small fw-bold d-block mb-1 opacity-75">Period</label>
        <select id="periodSelect" class="form-select form-select-sm fw-bold"></select>
      </div>
    </div>
    <div class="tally">
      <div><span class="count text-success" id="tallyPresent">0</span>Present</div>
      <div><span class="count text-warning" id="tallyTardy">0</span>Tardy</div>
      <div><span class="count text-secondary" id="tallyAbsent">0</span>Not Yet Scanned</div>
    </div>
    <div class="scan-body">
      <i class="fas fa-id-card fa-2x text-primary mb-3"></i>
      <h4 class="fw-bold mb-3">Scan Your ID</h4>
      <input type="text" id="scanInput" class="form-control mx-auto" style="max-width: 420px;" autocomplete="off" placeholder="Waiting for scan…">
      <div id="feedbackPanel" class="feedback-panel mx-auto" style="max-width: 460px;">
        <div class="feedback-icon" id="feedbackIcon"></div>
        <div class="feedback-name" id="feedbackName"></div>
        <div class="feedback-sub" id="feedbackSub"></div>
        <div id="tardyLinkBox" class="tardy-link-box d-none"></div>
      </div>

      <button id="noIdToggle" class="btn btn-link btn-sm mt-3 fw-bold text-decoration-none"><i class="fas fa-magnifying-glass me-1"></i>No ID? Click your name instead</button>
      <div id="noIdPanel" class="d-none mt-2">
        <input type="text" id="nameSearch" class="form-control mx-auto mb-3" style="max-width: 420px;" placeholder="Type to search names…">
        <div id="nameList" class="d-flex flex-wrap gap-2 justify-content-center"></div>
      </div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script type="module" src="/js/admin/attendance-scan.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Flashcards | CHS Web Design &amp; Development</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>

  <link rel="shortcut icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">

  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <link href="/css/dacStyleSheets.css" rel="stylesheet"/>
  <link href="/css/student-pages.css" rel="stylesheet"/>

  <script src="/js/bootstrap.bundle.js"></script>
  <script src="/js/jquery.js"></script>
  <script src="/js/loader.js?v=21"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <style>
    .flashcards-wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .deck-toggle .btn { font-weight: 700; }
    .card-scene { perspective: 1600px; margin: 1.5rem 0; }
    .flip-card {
      position: relative; width: 100%; min-height: 260px; cursor: pointer;
      transform-style: preserve-3d; transition: transform 0.5s;
    }
    .flip-card.is-flipped { transform: rotateY(180deg); }
    .flip-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.75rem; box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    .flip-front { background: #fff; border: 2px solid #000099; color: #212529; }
    .flip-back {
      background: #000099; color: #fff; transform: rotateY(180deg);
      font-weight: 600;
    }
    .flip-face .flip-label {
      position: absolute; top: .6rem; left: .9rem; font-size: .68rem; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase; opacity: .55;
    }
    .flip-face .flip-text { font-size: 1.15rem; line-height: 1.5; }
    .flip-hint { text-align: center; font-size: .8rem; color: #6c757d; margin-top: -.75rem; }
    .deck-empty { text-align: center; padding: 3rem 1rem; color: #6c757d; }
    #card-counter { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-light">

<div id="nav-placeholder"></div>

<div class="flashcards-wrap">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <h3 class="fw-bold mb-0" style="color:#000099;"><i class="fas fa-layer-group me-2"></i>Flashcards</h3>
    <a href="/cs-interactive.html" class="btn btn-sm btn-outline-secondary fw-bold"><i class="fas fa-arrow-left me-1"></i> Back to Class</a>
  </div>

  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body">
      <div class="btn-group deck-toggle w-100 mb-3" role="group">
        <button type="button" class="btn btn-outline-primary active" id="btn-deck-vocab">
          <i class="fas fa-spell-check me-1"></i> Vocabulary
        </button>
        <button type="button" class="btn btn-outline-primary" id="btn-deck-question">
          <i class="fas fa-circle-question me-1"></i> Question Bank
        </button>
      </div>

      <div class="row g-2 align-items-end">
        <div class="col" id="chapter-picker-wrap">
          <label class="form-label small fw-bold mb-1" for="chapter-picker">Chapter</label>
          <select id="chapter-picker" class="form-select form-select-sm"></select>
        </div>
        <div class="col d-none" id="unit-picker-wrap">
          <label class="form-label small fw-bold mb-1" for="unit-picker">Unit</label>
          <select id="unit-picker" class="form-select form-select-sm"></select>
        </div>
      </div>
    </div>
  </div>

  <div id="deck-area">
    <div class="deck-empty"><i class="fas fa-spinner fa-spin fa-2x mb-3"></i><p>Loading flashcards…</p></div>
  </div>

  <div id="controls-area" class="d-none">
    <div class="d-flex align-items-center justify-content-between">
      <button type="button" class="btn btn-outline-secondary fw-bold" id="btn-prev"><i class="fas fa-chevron-left me-1"></i> Prev</button>
      <span id="card-counter" class="fw-bold text-muted"></span>
      <button type="button" class="btn btn-outline-secondary fw-bold" id="btn-next">Next <i class="fas fa-chevron-right ms-1"></i></button>
    </div>
    <div class="text-center mt-3">
      <button type="button" class="btn btn-sm btn-outline-primary fw-bold" id="btn-shuffle"><i class="fas fa-shuffle me-1"></i> Shuffle Deck</button>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script type="module">
const params = new URLSearchParams(window.location.search);
const initialUnit = parseInt(params.get('unit'), 10) || 1;
const initialChapter = parseInt(params.get('chapter'), 10) || 1;
const initialDeck = params.get('deck') === 'question' ? 'question' : 'vocab';

let vocabData = null;   // { "1": {title, vocab:[{term,definition}], ...}, ... }
let questionData = null; // { "1": [{q,a}], ... }
let currentDeck = initialDeck;
let currentChapter = initialChapter;
let currentUnit = initialUnit;
let cards = [];       // [{front, back}]
let order = [];        // shuffled index order
let pos = 0;
let flipped = false;

const chapterPicker = document.getElementById('chapter-picker');
const unitPicker = document.getElementById('unit-picker');
const chapterPickerWrap = document.getElementById('chapter-picker-wrap');
const unitPickerWrap = document.getElementById('unit-picker-wrap');
const deckArea = document.getElementById('deck-area');
const controlsArea = document.getElementById('controls-area');
const cardCounter = document.getElementById('card-counter');
const btnDeckVocab = document.getElementById('btn-deck-vocab');
const btnDeckQuestion = document.getElementById('btn-deck-question');

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadData() {
    const [vRes, qRes] = await Promise.all([
        fetch('/data/cs-worksheets.json?v=' + Date.now()),
        fetch('/data/cs-flashcards.json?v=' + Date.now())
    ]);
    vocabData = vRes.ok ? await vRes.json() : {};
    questionData = qRes.ok ? await qRes.json() : {};
}

function populatePickers() {
    chapterPicker.innerHTML = '';
    Object.keys(vocabData).sort((a, b) => Number(a) - Number(b)).forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch;
        opt.textContent = `Ch ${ch}: ${(vocabData[ch].title || '').replace(/^Chapter \d+ Worksheet:\s*/, '')}`;
        chapterPicker.appendChild(opt);
    });
    if (vocabData[String(currentChapter)]) chapterPicker.value = String(currentChapter);

    unitPicker.innerHTML = '';
    Object.keys(questionData).sort((a, b) => Number(a) - Number(b)).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = `Unit ${u}`;
        unitPicker.appendChild(opt);
    });
    if (questionData[String(currentUnit)]) unitPicker.value = String(currentUnit);
}

function buildCards() {
    if (currentDeck === 'vocab') {
        const sheet = vocabData[String(currentChapter)];
        cards = (sheet && Array.isArray(sheet.vocab)) ? sheet.vocab.map(v => ({ front: v.term, back: v.definition })) : [];
    } else {
        const list = questionData[String(currentUnit)];
        cards = Array.isArray(list) ? list.map(c => ({ front: c.q, back: c.a })) : [];
    }
    order = cards.map((_, i) => i);
    pos = 0;
    flipped = false;
    renderCard();
}

function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
    }
    pos = 0;
    flipped = false;
    renderCard();
}

function renderCard() {
    if (cards.length === 0) {
        deckArea.innerHTML = `<div class="deck-empty"><i class="fas fa-inbox fa-2x mb-3"></i><p>No flashcards found for this ${currentDeck === 'vocab' ? 'chapter' : 'unit'} yet.</p></div>`;
        controlsArea.classList.add('d-none');
        return;
    }
    controlsArea.classList.remove('d-none');
    const idx = order[pos];
    const card = cards[idx];
    deckArea.innerHTML = `
        <div class="card-scene">
            <div class="flip-card ${flipped ? 'is-flipped' : ''}" id="flip-card">
                <div class="flip-face flip-front">
                    <span class="flip-label">Question</span>
                    <span class="flip-text">${escapeHtml(card.front)}</span>
                </div>
                <div class="flip-face flip-back">
                    <span class="flip-label" style="opacity:.7;">Answer</span>
                    <span class="flip-text">${escapeHtml(card.back)}</span>
                </div>
            </div>
        </div>
        <p class="flip-hint"><i class="fas fa-hand-pointer me-1"></i> Tap the card to flip it</p>
    `;
    document.getElementById('flip-card').addEventListener('click', () => {
        flipped = !flipped;
        document.getElementById('flip-card').classList.toggle('is-flipped', flipped);
    });
    cardCounter.textContent = `${pos + 1} / ${cards.length}`;
}

function goPrev() {
    if (cards.length === 0) return;
    pos = (pos - 1 + cards.length) % cards.length;
    flipped = false;
    renderCard();
}
function goNext() {
    if (cards.length === 0) return;
    pos = (pos + 1) % cards.length;
    flipped = false;
    renderCard();
}

btnDeckVocab.addEventListener('click', () => {
    currentDeck = 'vocab';
    btnDeckVocab.classList.add('active');
    btnDeckQuestion.classList.remove('active');
    chapterPickerWrap.classList.remove('d-none');
    unitPickerWrap.classList.add('d-none');
    buildCards();
});
btnDeckQuestion.addEventListener('click', () => {
    currentDeck = 'question';
    btnDeckQuestion.classList.add('active');
    btnDeckVocab.classList.remove('active');
    unitPickerWrap.classList.remove('d-none');
    chapterPickerWrap.classList.add('d-none');
    buildCards();
});
chapterPicker.addEventListener('change', () => { currentChapter = parseInt(chapterPicker.value, 10); buildCards(); });
unitPicker.addEventListener('change', () => { currentUnit = parseInt(unitPicker.value, 10); buildCards(); });
document.getElementById('btn-prev').addEventListener('click', goPrev);
document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-shuffle').addEventListener('click', shuffleOrder);

(async function init() {
    await loadData();
    populatePickers();
    if (initialDeck === 'question') {
        btnDeckQuestion.click();
    } else {
        currentDeck = 'vocab';
        unitPickerWrap.classList.add('d-none');
        buildCards();
    }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Logging Out | CHS Web Design</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  
  <!-- Favicon Icons -->
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">

  <!-- BootStrap & Styles -->
  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/dacStyleSheets.css?v=1.8" rel="stylesheet" />
  
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
  
  <!-- Loader for Navigation & Auth Guard -->
  <script src="/js/loader.js?v=20"></script>
  <script type="module" src="/js/auth-guard.js"></script>
</head>
<body class="d-flex flex-column bg-light vh-100">

  <!--Navigation-->
  <div class="container-fluid sticky-top px-0 no-print">
    <div id="nav-placeholder"></div>
  </div>

  <div class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="text-center p-5 bg-white rounded shadow-sm border" style="max-width: 400px;">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h3 class="fw-bold text-primary gochi">Logging you out...</h3>
        <p class="text-muted small mb-0">Clearing your local session and returning home.</p>
    </div>
  </div>

<script type="module">
    window.onload = async () => {
      // This page only ever cleared client-side localStorage -- it never
      // once called the server to actually end the session. /api/login
      // regenerates a fresh session on every successful login (server/
      // auth.js), so this was never a way for one student to access
      // another's account, but the OLD session (and its httpOnly cookie)
      // stayed fully valid server-side, for up to the store's 30-day
      // expiration, the entire time a computer sat on the login screen
      // between periods. Ending it here is the correct fix regardless of
      // any one incident -- a stale, needlessly-long-lived session sitting
      // on a shared classroom machine is exactly the kind of thing worth
      // closing on its own.
      try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { /* still clear local state below either way */ }

      // These computers are shared -- a different student sits down at the
      // same machine next period. Removing only 'user'/'shift' left every
      // other per-feature key (csLastPosition, cs_self_assessment_history,
      // the read-aloud voice/rate/progress keys, calendar view state, and
      // more added since this list was last updated) sitting in localStorage
      // for whoever logs in next, since none of those are scoped by
      // student_id the way e.g. intervention.html's `intv_*_${sid}` keys
      // are. Clearing everything except the one key that's deliberately
      // meant to survive a logout (lastPage, so a student who logs back in
      // returns to where they were) closes this off for good instead of
      // needing a manually maintained list that drifts every time a new
      // feature adds a key.
      const lastPage = localStorage.getItem('lastPage');
      localStorage.clear();
      if (lastPage !== null) localStorage.setItem('lastPage', lastPage);

      // Short delay for visual feedback, then bounce to home
      setTimeout(() => {
        window.location.replace("/index.html");
      }, 1000);
    };
  </script>

  <a href="#" class="back-to-top text-decoration-none" title="Back to Top">🚀</a>
</body>
</html>
